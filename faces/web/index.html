<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>cute-pets</title>
<style>
:root{--bg:#12131a;--card:#1b1d27;--card2:#232634;--ink:#e8e9f0;--dim:#8b90a6;--run:#58c4ff;--wait:#ffc65c;--err:#ff6b6b;--ok:#6ee7a8;--line:#2c3042}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 ui-sans-serif,system-ui,"Segoe UI",sans-serif}
header{display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
.pet{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:18px;background:var(--card2);border:1px solid var(--line)}
.pet.waiting{box-shadow:inset 0 0 0 2px var(--wait);animation:p 1.4s infinite}
.pet.running{box-shadow:inset 0 0 0 2px var(--run);animation:p 1.4s infinite}
.pet.error{box-shadow:inset 0 0 0 2px var(--err)}
.pet.idle{box-shadow:inset 0 0 0 2px var(--ok)}
@keyframes p{50%{opacity:.55}}
h1{font-size:15px;margin:0;font-weight:600}
.label{color:var(--dim);font-size:12px}
main{padding:18px;display:grid;gap:12px;max-width:980px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.title{font-weight:600}
.chip{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--dim)}
.chip.running{color:var(--run);border-color:#1d3c52;background:#10222d}
.chip.waiting{color:var(--wait);border-color:#4a3a1a;background:#2a2110}
.chip.error{color:var(--err);border-color:#4a2020;background:#2a1414}
.chip.idle{color:var(--ok);border-color:#1d4030;background:#10251c}
.snippet{color:var(--dim);font-size:12.5px;margin-top:6px;white-space:pre-wrap;max-height:4.5em;overflow:hidden}
.meta{color:var(--dim);font-size:11.5px}
input[type=text],textarea{width:100%;background:var(--card2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;resize:vertical}
textarea{min-height:38px}
button{background:var(--card2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 11px;font:inherit;cursor:pointer}
button:hover{border-color:#3d4460}
button.primary{background:#24506b;border-color:#2f6d92}
button.danger{background:#45212a;border-color:#6b2f3a}
button.ok{background:#1d4030;border-color:#2c6b4c}
.perm{border:1px solid #4a3a1a;background:#241d0f}
.perm b{color:var(--wait)}
.chat{margin-top:10px;display:none;gap:8px;flex-direction:column}
.chat.on{display:flex}
.msg{padding:8px 10px;border-radius:8px;background:var(--card2);white-space:pre-wrap;font-size:13px}
.msg.user{border-left:3px solid #3d4460}
.msg.assistant{border-left:3px solid var(--run)}
.empty{color:var(--dim);text-align:center;padding:40px 0}
form.new{display:grid;gap:8px;grid-template-columns:1fr auto}
form.new .full{grid-column:1/-1}
code{color:#b9c0d8}
</style></head>
<body>
<header>
  <div class="pet idle" id="pet">&#128062;</div>
  <div><h1>cute-pets</h1><div class="label" id="petlabel">connecting&hellip;</div></div>
  <div style="margin-left:auto" class="meta" id="servers"></div>
</header>
<main>
  <section class="card perm" id="permzone" style="display:none"></section>
  <section class="card">
    <div class="row"><span class="title">New request</span></div>
    <form class="new" id="newform">
      <input type="text" id="newtitle" placeholder="optional session title">
      <div></div>
      <textarea class="full" id="newtext" placeholder="What should OpenCode do? (Ctrl+Enter)"></textarea>
      <div class="full row"><button class="primary" type="submit">Send</button><span class="meta" id="newstatus"></span></div>
    </form>
  </section>
  <div id="sessions"></div>
  <div class="empty" id="empty">no sessions yet</div>
</main>
<script>
const $=s=>document.querySelector(s);
let state={pet:{state:"idle",label:""},sessions:[],permissions:[],servers:[]};
const expanded=new Set();
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const chip=(t,c="")=>`<span class="chip ${c}">${esc(t)}</span>`;
const short=n=>n>=1000?(n/1000).toFixed(1)+"k":String(n||0);

function render(){
  const pet=state.pet||{state:"idle",label:""};
  $("#pet").className="pet "+pet.state;
  $("#petlabel").textContent=pet.label;
  $("#servers").textContent=(state.servers||[]).map(s=>(s.online?"\u25cf ":"\u25cb ")+s.url).join("   ");
  const perms=state.permissions||[], pz=$("#permzone");
  if(perms.length){
    pz.style.display="";
    pz.innerHTML=perms.map(p=>`<div class="row" style="margin-bottom:8px">
      <div style="flex:1"><b>Approve</b> <code>${esc(p.permission)}</code>
      ${p.patterns&&p.patterns.length?" \u00b7 "+esc(p.patterns.join(", ")):""}
      <div class="meta">session ${esc((p.sessionID||"").slice(0,18))}&hellip;</div></div>
      <button class="ok" data-act="once" data-id="${esc(p.id)}">Once</button>
      <button class="ok" data-act="always" data-id="${esc(p.id)}">Always</button>
      <button class="danger" data-act="reject" data-id="${esc(p.id)}">Reject</button></div>`).join("");
  } else { pz.style.display="none"; pz.innerHTML=""; }

  const list=state.sessions||[];
  $("#empty").style.display=list.length?"none":"";
  $("#sessions").innerHTML=list.map(s=>{
    const tok=(s.tokens&&(s.tokens.input+s.tokens.output))||0;
    return `<section class="card" style="margin-bottom:12px">
      <div class="row">${chip(s.state,s.state)}<span class="title">${esc(s.title)}</span>
      <span class="meta">${esc(s.dirName||"")}${s.agent?" \u00b7 "+esc(s.agent):""}</span>
      <span class="meta" style="margin-left:auto">${short(tok)} tok${s.cost?" \u00b7 $"+s.cost.toFixed(3):""}</span></div>
      ${s.detail?`<div class="meta" style="color:var(--err)">${esc(s.detail)}</div>`:""}
      ${s.lastText?`<div class="snippet">${esc(s.lastText)}</div>`:""}
      <div class="row" style="margin-top:8px">
        <button data-act="toggle" data-server="${esc(s.server)}" data-sid="${esc(s.id)}">${expanded.has(s.id)?"Hide":"Open"}</button>
        ${s.state==="running"?`<button class="danger" data-act="abort" data-server="${esc(s.server)}" data-sid="${esc(s.id)}">Stop</button>`:""}
      </div>
      <div class="chat ${expanded.has(s.id)?"on":""}" id="chat-${esc(s.id)}"></div>
      <form class="row" style="margin-top:8px;gap:8px" data-act="reply" data-server="${esc(s.server)}" data-sid="${esc(s.id)}">
        <input type="text" name="text" placeholder="Reply in this session&hellip;" style="flex:1">
        <button type="submit">Send</button>
      </form></section>`;
  }).join("");
  if(expanded.size) for(const id of expanded) loadChatById(id,false);
}

async function loadChat(server,id){
  const el=document.getElementById("chat-"+id); if(!el) return;
  try{
    const r=await fetch(`/api/messages?server=${encodeURIComponent(server)}&sessionId=${encodeURIComponent(id)}&limit=12`);
    const msgs=await r.json();
    el.innerHTML=(msgs||[]).map(m=>{
      const t=(m.parts||[]).map(p=>p.text).join("\n");
      return `<div class="msg ${esc(m.role)}">${esc(t)}</div>`;
    }).join("")||`<div class="meta">no messages</div>`;
  }catch(e){ el.innerHTML=`<div class="meta">${esc(e)}</div>`; }
}
function loadChatById(id,force){
  const s=(state.sessions||[]).find(x=>x.id===id); if(!s) return;
  const el=document.getElementById("chat-"+id); if(!el) return;
  if(!force && el.dataset.loaded==="1") return;
  el.dataset.loaded="1"; loadChat(s.server,id);
}
async function post(path,body){
  const r=await fetch(path,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(body)});
  const j=await r.json();
  if(!r.ok) throw new Error(j.error||r.status);
  return j;
}
document.addEventListener("click",async ev=>{
  const b=ev.target.closest("button[data-act]"); if(!b) return;
  const act=b.dataset.act;
  try{
    if(act==="once"||act==="always"||act==="reject") await post("/api/permission",{id:b.dataset.id,reply:act});
    else if(act==="abort") await post("/api/abort",{server:b.dataset.server,sessionId:b.dataset.sid});
    else if(act==="toggle"){
      const id=b.dataset.sid;
      if(expanded.has(id)) expanded.delete(id); else expanded.add(id);
      render(); if(expanded.has(id)) loadChatById(id,true);
    }
  }catch(e){ alert(String(e)); }
});
document.addEventListener("submit",async ev=>{
  const f=ev.target.closest("form[data-act]"); if(!f) return;
  ev.preventDefault();
  const input=f.querySelector("input[name=text]"); const text=(input.value||"").trim(); if(!text) return;
  input.value="";
  try{ await post("/api/prompt",{server:f.dataset.server,sessionId:f.dataset.sid,text}); }catch(e){ alert(String(e)); }
});
$("#newform").addEventListener("submit",async ev=>{
  ev.preventDefault();
  const title=$("#newtitle").value.trim(), text=$("#newtext").value.trim(); if(!text) return;
  $("#newstatus").textContent="sending\u2026";
  try{ await post("/api/prompt",{newSession:true,title:title||null,text}); $("#newtext").value=""; $("#newtitle").value=""; $("#newstatus").textContent="sent"; }
  catch(e){ $("#newstatus").textContent=String(e); }
});
$("#newtext").addEventListener("keydown",e=>{ if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)) $("#newform").requestSubmit(); });
function connect(){
  const es=new EventSource("/api/events");
  es.addEventListener("state",ev=>{ state=JSON.parse(ev.data); render(); });
  es.onerror=()=>{ es.close(); setTimeout(connect,1500); };
}
connect(); render();
</script>
</body></html>
