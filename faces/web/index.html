<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>cute-pets · Saber</title>
<style>
:root{--bg:#0f1016;--panel:#16181f;--card:#1b1e27;--card2:#232734;--ink:#e9eaf2;--dim:#8b91a8;
--run:#5ac8ff;--wait:#ffc65c;--err:#ff6b6b;--ok:#6ee7a8;--line:#282c3a}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(1200px 600px at 20% -10%,#1a1f2e 0%,var(--bg) 60%);color:var(--ink);
font:14px/1.5 ui-sans-serif,system-ui,"Segoe UI",sans-serif;overflow:hidden}
.app{display:grid;grid-template-columns:280px 1fr;height:100vh}
/* ---- pet ---- */
.petpanel{background:linear-gradient(180deg,#171a24,#12141b);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:26px 18px 18px;position:relative}
.stage{position:relative;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;min-height:0}
.glow{position:absolute;width:230px;height:230px;border-radius:50%;filter:blur(42px);opacity:.32;background:var(--ok);top:50%;left:50%;transform:translate(-50%,-58%);transition:background .5s ease,opacity .5s ease}
canvas{position:relative;width:250px;height:271px;image-rendering:auto;filter:drop-shadow(0 14px 20px rgba(0,0,0,.55))}
.badge{position:relative;margin-top:2px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;padding:4px 12px;border-radius:999px;border:1px solid var(--line);color:var(--dim);background:#141720}
.badge.waiting{color:#201a08;background:var(--wait);border-color:var(--wait);font-weight:700}
.badge.running{color:#04202b;background:var(--run);border-color:var(--run);font-weight:700}
.badge.error{color:#2b0808;background:var(--err);border-color:var(--err);font-weight:700}
.statusline{margin-top:14px;font-size:15px;font-weight:600}
.counts{margin-top:6px;font-size:12px;color:var(--dim);text-align:center}
.foot{margin-top:auto;font-size:10.5px;color:#5b6076;letter-spacing:.08em;text-transform:uppercase}
/* ---- main ---- */
main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line)}
.top h1{font-size:14px;margin:0;font-weight:600;letter-spacing:.02em}
.pill{font-size:11.5px;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
select{background:var(--card2);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font:inherit;font-size:11.5px}
.scroll{overflow:auto;padding:16px 20px;display:grid;gap:10px;align-content:start}
.perm{border:1px solid #4a3a1a;background:#241d0f;border-radius:12px;padding:12px 14px}
.perm b{color:var(--wait)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;transition:border-color .15s,transform .15s}
.card:hover{border-color:#3a4157}
.card.sel{border-color:#4d5a7d;box-shadow:0 0 0 1px #3a4560 inset}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.title{font-weight:600}
.chip{font-size:10.5px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--dim);letter-spacing:.04em}
.chip.running{color:var(--run);border-color:#1d3c52;background:#10222d}
.chip.waiting{color:var(--wait);border-color:#4a3a1a;background:#2a2110}
.chip.error{color:var(--err);border-color:#4a2020;background:#2a1414}
.chip.idle{color:var(--ok);border-color:#1d4030;background:#10251c}
.meta{color:var(--dim);font-size:11.5px}
.snippet{color:#a9b0c6;font-size:12.5px;margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bar{height:3px;border-radius:2px;background:#262a38;overflow:hidden;margin-top:9px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#3d7ea6,#5ac8ff);width:0;transition:width .6s ease}
form.new{display:grid;gap:8px;grid-template-columns:1fr auto;width:100%}
form.new textarea{grid-column:1/-1}
input[type=text],textarea{width:100%;background:var(--card2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;resize:none}
textarea{min-height:40px}
button{background:var(--card2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 11px;font:inherit;cursor:pointer}
button:hover{border-color:#3d4460}
button.primary{background:#24506b;border-color:#2f6d92}
button.danger{background:#45212a;border-color:#6b2f3a}
button.ok{background:#1d4030;border-color:#2c6b4c}
/* ---- drawer ---- */
.drawer{position:fixed;top:0;right:0;height:100%;width:440px;background:#14161e;border-left:1px solid var(--line);
transform:translateX(100%);transition:transform .22s ease;display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer header{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.drawer .msgs{flex:1;overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.msg{padding:8px 11px;border-radius:10px;background:var(--card2);white-space:pre-wrap;font-size:13px;max-width:100%}
.msg.user{border-left:3px solid #3d4460;color:#c8cde0}
.msg.assistant{border-left:3px solid var(--run)}
/* markdown */
.msg{white-space:normal;overflow-wrap:anywhere}
.msg p{margin:0 0 8px}.msg p:last-child{margin-bottom:0}
.msg h1,.msg h2,.msg h3,.msg h4{margin:10px 0 6px;line-height:1.3}
.msg h1{font-size:16px}.msg h2{font-size:15px}.msg h3{font-size:14px}.msg h4{font-size:13px}
.msg ul,.msg ol{margin:5px 0;padding-left:20px}.msg li{margin:2px 0}
.msg blockquote{margin:8px 0;padding:2px 10px;border-left:3px solid var(--line2);color:var(--dim)}
.msg code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px;
background:#10131b;border:1px solid var(--line);border-radius:4px;padding:0 3px}
.msg .codeblock{margin:8px 0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#0d1017}
.msg .codehead{display:flex;justify-content:space-between;align-items:center;gap:8px;
padding:4px 9px;background:#151923;color:var(--dim);font-size:10px;text-transform:uppercase;letter-spacing:.07em}
.msg .codehead .copybtn{background:transparent;border:0;color:var(--dim);font:inherit;font-size:10px;
text-transform:none;letter-spacing:0;cursor:pointer;padding:1px 5px;border-radius:4px}
.msg .codehead .copybtn:hover{background:#20242f;color:var(--ink)}
.msg pre{margin:0;padding:9px 10px;overflow:auto;max-height:420px}
.msg pre code{background:none;border:0;padding:0;font-size:12px;line-height:1.55;white-space:pre}
.msg a{color:var(--run);text-decoration:none}.msg a:hover{text-decoration:underline}
.msg img{max-width:100%;border-radius:6px;margin:6px 0}
.msg hr{border:0;border-top:1px solid var(--line);margin:9px 0}
.msg table{border-collapse:collapse;margin:7px 0;font-size:12px;display:block;overflow:auto;max-width:100%}
.msg th,.msg td{border:1px solid var(--line);padding:4px 7px;text-align:left}
.msg th{background:#1b202b}.msg del{color:var(--dim)}
.drawer form{border-top:1px solid var(--line);padding:12px 16px;display:flex;gap:8px}
code{color:#b9c0d8}
.empty{color:var(--dim);text-align:center;padding:36px 0}
</style></head>
<body>
<div class="app">
  <aside class="petpanel">
    <div class="stage">
      <div class="glow" id="glow"></div>
      <canvas id="pet" width="500" height="542"></canvas>
      <div class="badge" id="badge">idle</div>
    </div>
    <div class="statusline" id="statusline">all done</div>
    <div class="counts" id="counts"></div>
    <div class="foot">cute-pets · saber</div>
  </aside>

  <main>
    <div class="top">
      <h1>sessions</h1>
      <span class="pill" id="servers">0 servers</span>
      <span class="pill" id="totals"></span>
      <select id="filter" title="filter by project"><option value="all">all projects</option></select>
      <div style="flex:1"></div>
      <span class="meta" id="updated"></span>
    </div>
    <div class="scroll">
      <section class="card" id="permzone" style="display:none;cursor:default"></section>
      <section class="card" style="cursor:default">
        <form class="new" id="newform">
          <input type="text" id="newtitle" placeholder="new session title (optional)">
          <button class="primary" type="submit">Send</button>
          <textarea id="newtext" placeholder="Ask OpenCode to do something... (Ctrl+Enter)"></textarea>
        </form>
      </section>
      <div id="sessions"></div>
      <div class="empty" id="empty">no sessions yet</div>
    </div>
  </main>
</div>

<aside class="drawer" id="drawer">
  <header>
    <div style="flex:1;min-width:0">
      <div class="title" id="drawerTitle" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></div>
      <div class="meta" id="drawerMeta"></div>
    </div>
    <button id="closeDrawer">Close</button>
  </header>
  <div class="msgs" id="msgs"></div>
  <form id="replyForm">
    <input type="text" id="replyText" placeholder="Reply in this conversation...">
    <button class="primary" type="submit">Send</button>
  </form>
</aside>

<script src="/markdown.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const short=n=>n>=1000?(n/1000).toFixed(1)+"k":String(n||0);
let state={pet:{state:"idle",label:""},sessions:[],permissions:[],servers:[]};
let open=null, lastMsgKey="";

/* ---------- pet sprite (active pack, served by the brain) ---------- */
const FW=192,FH=208,FRAMES=8;
const ROW={idle:0,running:2,waiting:6,error:9};
const FPS={idle:6,running:11,waiting:5,error:4};
const COLOR={idle:"#6ee7a8",running:"#5ac8ff",waiting:"#ffc65c",error:"#ff6b6b"};
const img=new Image();
// whatever pack is active - the built-in chibi knight unless the user imported one
fetch("/api/pet").then(r=>r.json()).then(p=>{ if(p&&p.url) img.src=p.url; }).catch(()=>{});
const cv=$("#pet"), ctx=cv.getContext("2d");
let petState="idle";
/* Rows are padded with fully transparent cells: the real animation length differs
   per row (idle has 7 usable frames, row 5 has 8). Sampling alpha once keeps the
   pet from blanking out on a padding frame. */
const validFrames={};
function measureFrames(){
  const c=document.createElement("canvas"); c.width=FW; c.height=FH;
  const g=c.getContext("2d");
  for(let r=0;r<11;r++){
    let last=1;
    for(let f=0;f<FRAMES;f++){
      g.clearRect(0,0,FW,FH);
      g.drawImage(img, f*FW, r*FH, FW, FH, 0, 0, FW, FH);
      const d=g.getImageData(0,0,FW,FH).data;
      let solid=0;
      for(let i=3;i<d.length;i+=4*17){ if(d[i]>16) solid++; }
      if(solid>10) last=f+1;
    }
    validFrames[r]=last;
  }
}
function frame(t){ const s=FPS[petState]||6; const n=validFrames[ROW[petState]??0]||FRAMES; return Math.floor(t/1000*s)%n; }
function loop(t){
  if(img.complete&&img.naturalWidth){
    ctx.clearRect(0,0,cv.width,cv.height);
    const f=frame(t), r=ROW[petState]??0;
    ctx.drawImage(img, f*FW, r*FH, FW, FH, 0, 0, cv.width, cv.height);
  }
  requestAnimationFrame(loop);
}
img.onload=()=>{ measureFrames(); requestAnimationFrame(loop); };
requestAnimationFrame(loop);

/* ---------- render ---------- */
function render(){
  const pet=state.pet||{state:"idle",label:""};
  petState=pet.state||"idle";
  $("#glow").style.background=COLOR[petState]||COLOR.idle;
  const badge=$("#badge"); badge.className="badge "+petState; badge.textContent=petState;
  $("#statusline").textContent=pet.label||"";
  const c=pet.counts||{};
  $("#counts").textContent=[c.waiting?`${c.waiting} waiting`:"",c.running?`${c.running} running`:"",c.error?`${c.error} error`:"",`${c.idle||0} idle`].filter(Boolean).join(" · ");
  $("#servers").textContent=`${(state.servers||[]).filter(s=>s.online).length} servers`;
  const allSessions=state.sessions||[];
  const tot=allSessions.reduce((n,s)=>n+((s.tokens?.input||0)+(s.tokens?.output||0)),0);
  $("#totals").textContent=`${allSessions.length} sessions · ${short(tot)} tok`;
  $("#updated").textContent=new Date().toLocaleTimeString();

  /* approvals */
  const perms=state.permissions||[], pz=$("#permzone");
  if(perms.length){ pz.style.display=""; pz.className="perm"; pz.innerHTML=perms.map(p=>`
    <div class="row"><div style="flex:1"><b>Approval needed</b> · <code>${esc(p.permission)}</code>
      ${(p.patterns||[]).length?`<div class="meta">${esc((p.patterns||[]).join(", "))}</div>`:""}</div>
      <button class="ok" data-act="once" data-id="${esc(p.id)}">Allow once</button>
      <button class="ok" data-act="always" data-id="${esc(p.id)}">Always</button>
      <button class="danger" data-act="reject" data-id="${esc(p.id)}">Reject</button></div>`).join(""); }
  else { pz.style.display="none"; pz.innerHTML=""; pz.className="card"; }

  /* sessions (filtered by project) */
  const all=state.sessions||[];
  const dirs=[...new Set(all.map(s=>s.dirName).filter(Boolean))].sort();
  const sel=$("#filter");
  if(sel.dataset.built!==dirs.join("|")){
    const cur=sel.value;
    sel.innerHTML=`<option value="all">all projects</option>`+dirs.map(d=>`<option value="${esc(d)}">${esc(d)}</option>`).join("");
    if(dirs.includes(cur)) sel.value=cur; else if(cur!=="all"&&cur!=="") sel.value="all";
    sel.dataset.built=dirs.join("|");
  }
  const f=sel.value||"all";
  const list=f==="all"?all:all.filter(s=>s.dirName===f);
  $("#empty").style.display=list.length?"none":"";
  $("#sessions").innerHTML=list.map(s=>{
    const tok=(s.tokens?.input||0)+(s.tokens?.output||0);
    const busy=s.state==="running";
    return `<section class="card ${open&&open.id===s.id?"sel":""}" data-open="${esc(s.id)}" data-server="${esc(s.server)}">
      <div class="row">
        <span class="chip ${s.state}">${s.state}</span>
        <span class="title">${esc(s.title)}</span>
        <span class="meta">${esc(s.dirName||"")}${s.agent?" · "+esc(s.agent):""}</span>
        <span class="meta" style="margin-left:auto">${short(tok)} tok${s.cost?" · $"+s.cost.toFixed(3):""}</span>
      </div>
      ${s.detail?`<div class="meta" style="color:var(--err)">${esc(s.detail)}</div>`:""}
      ${s.lastText?`<div class="snippet">${esc(s.lastText)}</div>`:""}
      ${busy?`<div class="bar"><i style="width:${Math.min(95,30+((Date.now()/90)%60))}%"></i></div>`:""}
    </section>`;
  }).join("");
}

/* ---------- actions ---------- */
async function post(path,body){
  const r=await fetch(path,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(body)});
  const j=await r.json(); if(!r.ok) throw new Error(j.error||r.status); return j;
}
document.addEventListener("click",async ev=>{
  const b=ev.target.closest("button[data-act]");
  if(b){ try{ await post("/api/permission",{id:b.dataset.id,reply:b.dataset.act}); }catch(e){ alert(e); } return; }
  const c=ev.target.closest("[data-open]");
  if(c){ openConversation(c.dataset.server,c.dataset.open); }
});

async function openConversation(server,id){
  const s=(state.sessions||[]).find(x=>x.id===id); if(!s) return;
  open={server,id};
  $("#drawer").classList.add("on");
  $("#drawerTitle").textContent=s.title;
  $("#drawerMeta").textContent=`${s.dirName||""} · ${s.state}${s.agent?" · "+s.agent:""}`;
  render();
  await loadMessages();
}
$("#closeDrawer").onclick=()=>{ $("#drawer").classList.remove("on"); open=null; render(); };
document.addEventListener("click",async e=>{
  const b=e.target.closest(".copybtn"); if(!b) return;
  const code=b.closest(".codeblock")?.querySelector("pre code"); if(!code) return;
  try{ await navigator.clipboard.writeText(code.textContent); b.textContent="copied";
    setTimeout(()=>{ b.textContent="copy"; },900); }catch{}
});

async function loadMessages(){
  if(!open) return;
  const el=$("#msgs");
  try{
    const r=await fetch(`/api/messages?server=${encodeURIComponent(open.server)}&sessionId=${encodeURIComponent(open.id)}&limit=30`);
    const data=await r.json().catch(()=>null);
    if(!r.ok) throw new Error(data?.error||`messages ${r.status}`);
    const msgs=Array.isArray(data)?data:[];
    const key=JSON.stringify(msgs.map(m=>(m.parts||[]).filter(p=>p.type==="text").map(p=>p.text).join("")));
    if(key===lastMsgKey) return;
    lastMsgKey=key;
    el.innerHTML=(msgs||[]).map(m=>({m, t:(m.parts||[]).filter(p=>p.type==="text").map(p=>p.text).join("\n").trim()}))
      .filter(x=>x.t)
      .map(({m,t})=>`<div class="msg ${m.role==="user"?"user":"assistant"}">${CPMarkdown.toHtml(t)}</div>`)
      .join("")||`<div class="meta">no text messages yet</div>`;
    el.scrollTop=el.scrollHeight;
  }catch(e){ lastMsgKey=""; el.innerHTML=`<div class="meta">${esc(e)}</div>`; }
}

$("#replyForm").addEventListener("submit",async ev=>{
  ev.preventDefault();
  const t=$("#replyText").value.trim(); if(!t||!open) return;
  $("#replyText").value="";
  try{ await post("/api/prompt",{server:open.server,sessionId:open.id,text:t}); setTimeout(loadMessages,600); }catch(e){ alert(e); }
});
$("#newform").addEventListener("submit",async ev=>{
  ev.preventDefault();
  const text=$("#newtext").value.trim(); if(!text) return;
  const title=$("#newtitle").value.trim();
  try{ await post("/api/prompt",{newSession:true,title:title||null,text}); $("#newtext").value=""; $("#newtitle").value=""; }catch(e){ alert(e); }
});
$("#newtext").addEventListener("keydown",e=>{ if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)) $("#newform").requestSubmit(); });

function connect(){
  const es=new EventSource("/api/events");
  es.addEventListener("state",ev=>{
    state=JSON.parse(ev.data);
    render();
    if(open){ const s=(state.sessions||[]).find(x=>x.id===open.id);
      if(s){ $("#drawerMeta").textContent=`${s.dirName||""} · ${s.state}`; loadMessages(); } }
  });
  es.onerror=()=>{ es.close(); setTimeout(connect,1500); };
}
$("#filter").addEventListener("change",()=>{ lastMsgKey=""; render(); });
connect(); render();
</script>
</body></html>
