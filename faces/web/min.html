/* ---------------- composer + command palette ---------------- */
// Commands the pet implements itself. `GET /command` only returns prompt-template
// commands (init/review/…), because /model, /new, /share and friends are TUI-client
// commands that never reach the server. Those are re-implemented here on the API.
const PET_CMDS=[
  {name:"new",      d:"start a blank chat",                 run:()=>{ startDraft(); }},
  {name:"sessions", d:"show the session list",              run:()=>{ draft=null; setExpanded(true); showView("chat"); }},
  {name:"cd",       d:"change the working directory",       run:()=>{ $("#prompt").value="/cd "; openDirPalette(); $("#prompt").focus(); }},
  {name:"queue",    d:"send after the current turn finishes", run:()=>{ $("#prompt").value="/queue "; $("#prompt").focus(); }},
  {name:"steer",    d:"send into the running turn now",      run:()=>{ $("#prompt").value="/steer "; $("#prompt").focus(); }},
  {name:"model",    d:"switch the model for this session",  pick:"model"},
  {name:"effort",   d:"set reasoning effort for this model", pick:"effort"},
  {name:"agent",    d:"switch agent (build, plan, explore)",pick:"agent"},
  {name:"plan",     d:"switch to plan (read-only); /plan <msg> sends it", run:()=>useAgent("plan"),  send:true},
  {name:"build",    d:"switch back to build; /build <msg> also sends it",  run:()=>useAgent("build"), send:true},
  {name:"compact",  d:"summarize this conversation",        act:"compact"},
  {name:"undo",     d:"revert the last message",            act:"undo"},
  {name:"redo",     d:"restore reverted messages",          act:"redo"},
  {name:"fork",     d:"fork this session at the latest message", act:"fork"},
  {name:"share",    d:"create a share link",                act:"share"},
  {name:"abort",    d:"stop the running session",           act:"abort"},
  {name:"pets",     d:"choose the pet",                     run:()=>{ setExpanded(true); showView("pets"); }},
  {name:"settings", d:"facing, config, paths",              run:()=>{ setExpanded(true); showView("settings"); }},
  {name:"help",     d:"list available commands",            run:()=>{ setExpanded(true); openPalette(""); }},
];
let modelsList=[], agentsList=[], effortItems=[], palMode="root", modelsKey="", agentsKey="";

const pal=$("#palette"); let palSel=0, palItems=[];
async function loadCommands(){
  const s=currentSession();
  try{
    const q=s?`?server=${encodeURIComponent(s.server)}`:"";
    commands=(await (await fetch("/api/commands"+q)).json()).commands||[];
  }catch{ commands=[]; }
}
async function ensureModels(){
  const srv=currentSession()?.server || draft?.server || null;
  const key=srv||"";
  if(modelsList.length && modelsKey===key) return modelsList;
  modelsKey=key;
  try{
    const q=srv?`?server=${encodeURIComponent(srv)}`:"";
    modelsList=(await (await fetch("/api/models"+q)).json()).models||[];
  }catch{ modelsList=[]; }
  return modelsList;
}
async function ensureAgents(){
  const srv=currentSession()?.server || draft?.server || null;
  const key=srv||"";
  if(agentsList.length && agentsKey===key) return agentsList;
  agentsKey=key;
  try{
    const q=srv?`?server=${encodeURIComponent(srv)}`:"";
    agentsList=(await (await fetch("/api/agents"+q)).json()).agents||[];
  }catch{ agentsList=[]; }
  return agentsList;
}

// `default` is a real choice (reset to the provider default); the rest are the
// model's catalog variants, which is where OpenCode keeps reasoning effort.
async function openEffortPalette(){
  const model=currentModel();
  if(!model?.id){ alert("pick a model first (/model)"); return; }
  await ensureModels();
  const row=modelsList.find(m=>m.id===model.id&&m.providerID===model.providerID);
  const variants=row?.variants||[];
  if(!variants.length){ alert(`${modelLabel(model)} has no effort settings`); return; }
  const active=model.variant||"default";
  effortItems=[
    {kind:"effort",label:"default",sub:"provider default"+(active==="default"?" · current":""),value:"default"},
    ...variants.map(v=>({kind:"effort",label:v,sub:v===active?"current":"",value:v})),
  ];
  if(active!=="default"&&!variants.includes(active))
    effortItems.push({kind:"effort",label:active,sub:"current",value:active});
  openPalette("","efforts");
  const idx=effortItems.findIndex(it=>it.value===active);
  if(idx>0){
    palSel=idx;
    [...pal.children].forEach((el,i)=>el.classList.toggle("sel",i===palSel));
  }
}
// A model switch keeps the current effort only when it is the same model.
function modelValue(model){
  const prev=currentModel();
  const keep=prev&&prev.id===model.id&&prev.providerID===model.providerID;
  return {id:model.id,providerID:model.providerID,variant:keep&&prev.variant?prev.variant:"default"};
}
function dirChoices(){
  // Directories already in use, for /cd: current/last first, then the sessions.
  const seen=new Map();
  const add=(dir,why)=>{ if(dir&&!seen.has(dir)) seen.set(dir,{dir,why}); };
  add(draft?.directory,"current");
  add(currentSession()?.directory,"current");
  add(defaults?.directory,"last used");
  for(const s of state.sessions) add(s.directory,"session");
  return [...seen.values()].sort((a,b)=>
    (a.why==="current"?0:1)-(b.why==="current"?0:1) || a.dir.localeCompare(b.dir));
}
function cdPrefix(value){
  const m=String(value||"").match(/^\/cd(?:\s+([\s\S]*))?$/);
  return m ? (m[1] ?? "") : null;
}
function openDirPalette(prefix=""){
  const q=String(prefix||"").trim().replace(/[\\/]+$/,"").toLowerCase();
  const dirs=dirChoices().filter(d=>!q || d.dir.toLowerCase().startsWith(q));
  if(!dirs.length){ closePalette(); return false; }
  palMode="dirs";
  palItems=dirs.map(d=>({kind:"dir",label:d.dir,sub:d.why,value:d.dir}));
  palSel=0;
  pal.classList.add("on");
  pal.innerHTML=palItems.map((it,i)=>`<div class="pitem ${i===0?"sel":""}" data-i="${i}">
      <span class="n">${esc(it.label)}</span><span class="d">${esc(it.sub)}</span></div>`).join("");
  return true;
}
function openPalette(prefix="",mode="root"){
  palMode=mode;
  const q=prefix.toLowerCase();
  if(mode==="models"){
    palItems=modelsList.map(m=>({kind:"model",label:m.id,sub:`${m.providerID}${m.free?" · free":""}${m.default?" · default":""}`,value:m}));
  }else if(mode==="agents"){
    palItems=agentsList.map(a=>({kind:"agent",label:a.name,sub:a.description||a.mode||"",value:a.name}));
  }else if(mode==="efforts"){
    palItems=effortItems;
  }else{
    palItems=[
      ...commands.filter(c=>c.name.toLowerCase().startsWith(q))
        .map(c=>({kind:"command",label:"/"+c.name,sub:c.description||""})),
      ...PET_CMDS.filter(c=>c.name.toLowerCase().startsWith(q))
        .map(c=>({kind:"pet",label:"/"+c.name,sub:c.d})),
    ];
  }
  palSel=0;
  pal.classList.toggle("on",palItems.length>0);
  pal.innerHTML=palItems.map((it,i)=>`<div class="pitem ${i===0?"sel":""}" data-i="${i}">
      <span class="n${it.kind==="pet"?" pet":""}">${esc(it.label)}</span><span class="d">${esc(it.sub)}</span></div>`).join("");
}
function closePalette(){ pal.classList.remove("on"); pal.innerHTML=""; palItems=[]; palMode="root"; }

async function choosePalette(i){
  const it=palItems[i]; if(!it) return;
  if(it.kind==="command"){ $("#prompt").value=it.label+" "; closePalette(); $("#prompt").focus(); return; }
  if(it.kind==="dir"){ closePalette(); $("#prompt").value=""; await changeDir(it.value); return; }
  if(it.kind==="effort"){ closePalette(); $("#prompt").value=""; await setEffort(it.value); return; }
  if(it.kind==="model"||it.kind==="agent"){
    if(!currentSession()&&!draft) startDraft();
    const s=currentSession();
    const value=it.kind==="model" ? modelValue(it.value) : it.value;
    if(!s && draft){
      if(it.kind==="model") draft.model=value; else draft.agent=value;
      closePalette(); $("#prompt").value=""; render(); return;
    }
    if(!s){ closePalette(); return; }
    try{ await post("/api/session/action",{server:s.server,sessionId:s.id,action:it.kind,value}); }catch(e){ alert(String(e)); }
    if(defaults){ if(it.kind==="model") defaults.model=value; else defaults.agent=value; }
    closePalette(); $("#prompt").value=""; msgKey=""; render(); return;
  }
  const cmd=PET_CMDS.find(c=>"/"+c.name===it.label);
  closePalette(); $("#prompt").value="";
  if(!cmd) return;
  if(cmd.pick==="model"){ await ensureModels(); openPalette("","models"); return; }
  if(cmd.pick==="effort"){ await openEffortPalette(); return; }
  if(cmd.pick==="agent"){ await ensureAgents(); openPalette("","agents"); return; }
  if(cmd.run) return cmd.run();
  if(cmd.act) return runAction(cmd.act);
}

async function forkSession(s){
  try{
    const r=await post("/api/session/action",{server:s.server,sessionId:s.id,action:"fork"});
    // the shell returns the normalized child; show it at once instead of waiting
    // for the next state snapshot
    if(r.session) state.sessions=state.sessions.filter(x=>x.id!==r.session.id).concat(r.session);
    const id=r.sessionId||r.session?.id;
    if(id){ draft=null; selected=id; msgKey=""; view="chat"; render(); }
    return r;
  }catch(e){ alert(String(e)); }
}
async function runAction(act){
  const s=currentSession();
  if(!s){ alert("pick a session first"); return; }
  try{
    if(act==="abort"){ await post("/api/abort",{server:s.server,sessionId:s.id}); return; }
    if(act==="fork"){ await forkSession(s); return; }
    const r=await post("/api/session/action",{server:s.server,sessionId:s.id,action:act});
    if(act==="share"&&r.url){ try{ await navigator.clipboard.writeText(r.url); alert("Share link copied:\n"+r.url); }catch{ alert("Share link:\n"+r.url); } }
  }catch(e){ alert(String(e)); }
}

// /plan and /build: set the agent on the selected session or the draft.
// Returns false when the switch failed, so a trailing message is not sent to
// the old agent.
async function useAgent(name){
  const s=currentSession();
  if(!s){
    if(!draft) startDraft();
    draft.agent=name;
    if(defaults) defaults.agent=name;
    render();
    return true;
  }
  try{
    await post("/api/session/action",{server:s.server,sessionId:s.id,action:"agent",value:name});
    if(defaults) defaults.agent=name;
    msgKey=""; render();
    return true;
  }catch(e){ alert(String(e)); return false; }
}

// /effort: set the model variant (reasoning effort) on the session or draft.
async function setEffort(variant){
  const next=variant||"default";
  const s=currentSession();
  if(!s){
    if(!draft) startDraft();
    if(!draft?.model?.id){ alert("pick a model first (/model)"); return; }
    draft.model={...draft.model,variant:next};
    if(defaults) defaults.model=draft.model;
    render();
    return;
  }
  if(!s.model?.id){ alert("this session has no model yet"); return; }
  const value={id:s.model.id,providerID:s.model.providerID,variant:next};
  try{
    await post("/api/session/action",{server:s.server,sessionId:s.id,action:"model",value});
    s.model={...s.model,...value};
    if(defaults) defaults.model=value;
    render();
  }catch(e){ alert(String(e)); }
}

// /cd: validate a draft directory, or move an existing session (v2).
async function changeDir(p){
  const s=currentSession();
  const dir=String(p||"").trim().replace(/^(["'])(.*)\1$/,"$2");
  if(!dir){
    const cur=s?.directory || draft?.directory;
    alert(cur?`current directory:\n${cur}`:"usage: /cd /path");
    return;
  }
  try{
    if(s){
      const r=await post("/api/session/action",{server:s.server,sessionId:s.id,action:"move",value:{directory:dir}});
      if(r.session) state.sessions=state.sessions.filter(x=>x.id!==r.session.id).concat(r.session);
      if(defaults) defaults.directory=r.directory||dir;
      render();
      return;
    }
    if(!draft) startDraft();
    const prevServer=draft?.server||null;
    const r=await post("/api/checkdir",{directory:dir,server:prevServer});
    draft={...(draft||{}),directory:r.directory,server:r.server||null};
    if(prevServer && r.server!==prevServer){
      draft.model=null; draft.agent=null;
      modelsList=[]; agentsList=[]; modelsKey=""; agentsKey="";
    }
    if(defaults) defaults.directory=r.directory;
    render();
  }catch(e){ alert(String(e)); }
}

$("#prompt").addEventListener("input",e=>{
  composerDrafts.set(currentComposerKey(),e.target.value);
  const v=e.target.value;
  if(palMode==="dirs"){
    if(!/^\/cd\s+/.test(v)){ closePalette(); return; }
    openDirPalette(cdPrefix(v)); // keep filtering the known directories
    return;
  }
  if(palMode!=="root"){
    if(!v.startsWith("/")) closePalette();
    else openPalette(v.slice(1).split(" ")[0], palMode);
    return;
  }
  if(v==="/cd"){ openPalette("cd"); return; }
  if(v.startsWith("/cd ")){ openDirPalette(cdPrefix(v)); return; }
  if(v.startsWith("/")){
    const rest=v.slice(1);
    // once arguments start the palette is for command names only; let Enter
    // submit the line instead of re-selecting the command and wiping the args
    if(rest.includes(" ")){ closePalette(); return; }
    openPalette(rest);
    return;
  }
  closePalette();
});
// Tab completes text into the composer; Enter is the action. A model/effort/agent
// entry has no text to complete, so Tab leaves the list alone there.
function fillPaletteSelection(){
  const it=palItems[palSel]; if(!it) return false;
  if(it.kind==="command"||it.kind==="pet"){
    $("#prompt").value=it.label+" ";
    if(it.label==="/cd") openDirPalette(""); // keep suggesting directories
    else closePalette();
    $("#prompt").focus();
    return true;
  }
  if(it.kind==="dir"){
    $("#prompt").value="/cd "+it.value;
    openDirPalette(it.value); // re-filter, keep the list open
    $("#prompt").focus();
    return true;
  }
  return false;
}
$("#prompt").addEventListener("keydown",e=>{
  if(e.isComposing) return;
  if(!pal.classList.contains("on")) return;
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){
    e.preventDefault();
    palSel=(palSel+(e.key==="ArrowDown"?1:-1)+palItems.length)%palItems.length;
    [...pal.children].forEach((el,i)=>el.classList.toggle("sel",i===palSel));
    pal.children[palSel]?.scrollIntoView({block:"nearest"});
  } else if(e.key==="Tab"){
    e.preventDefault();
    fillPaletteSelection(); // no-op for model/agent lists
  } else if(e.key==="Enter"&&!e.ctrlKey&&!e.metaKey&&!e.shiftKey){
    if(palMode==="dirs"){
      const typed=cdPrefix($("#prompt").value);
      // with a path typed, run the line; with no path, run the highlighted suggestion
      if(typed && typed.trim()){
        e.preventDefault(); closePalette(); $("#composer").requestSubmit(); return;
      }
      e.preventDefault(); choosePalette(palSel); return;
    }
    e.preventDefault(); choosePalette(palSel);
  } else if(e.key==="Escape"){ closePalette(); }
});
// Enter inserts a newline by default; Ctrl/Cmd+Enter sends. In "Enter" mode
// Enter sends and Shift+Enter inserts the newline. Ctrl/Cmd+Shift+Enter queues
// the message for the next turn in either mode.
$("#prompt").addEventListener("keydown",e=>{
  if(e.key!=="Enter"||e.isComposing||e.defaultPrevented) return;
  const ctrl=e.ctrlKey||e.metaKey;
  const queue=ctrl&&e.shiftKey;
  const send=queue || (sendWith==="enter" ? !e.shiftKey : ctrl);
  if(!send) return;
  e.preventDefault();
  closePalette();
  submitDelivery=queue?"queue":null;
  $("#composer").requestSubmit();
});
pal.addEventListener("click",e=>{
  const it=e.target.closest("[data-i]"); if(!it) return;
  const i=Number(it.dataset.i);
  if(palItems[i]?.kind==="dir"){ palSel=i; fillPaletteSelection(); return; }
  choosePalette(i);
});

// Where a new chat starts when nothing is selected: the open draft, or the
// last used values.
function draftDefaults(){
  return draft || {
    directory: defaults?.directory || null,
    server: defaults?.server || null,
    model: defaults?.model || null,
    agent: defaults?.agent || null,
  };
}

// Send a message to the selected session, or create one from the draft/last
// used values. Shared by the composer and by `/plan <text>` / `/build <text>`.
async function sendMessage(text, delivery=null){
  const s=currentSession();
  if(!s){
    const d=draftDefaults();
    try{
      const r=await post("/api/prompt",{newSession:true,text,directory:d.directory,server:d.server,model:d.model,agent:d.agent,delivery});
      if(r.session) state.sessions=state.sessions.filter(x=>x.id!==r.session.id).concat(r.session);
      clearComposer();
      draft=null; selected=r.sessionId; msgKey=""; msgSession=""; view="chat";
      if(defaults){
        if(r.session?.directory || d.directory) defaults.directory=r.session?.directory || d.directory;
        if(r.server) defaults.server=r.server;
        if(d.model) defaults.model=d.model;
        if(d.agent) defaults.agent=d.agent;
      }
      render();
    }catch(err){ alert(String(err)); }
    return;
  }
  try{
    await post("/api/prompt",{sessionId:s.id,server:s.server,newSession:false,text,delivery});
    clearComposer(); msgKey="";
    setTimeout(()=>loadMessages(s),700);
  }catch(err){ alert(String(err)); }
}

$("#composer").addEventListener("submit",async e=>{
  e.preventDefault();
  let raw=$("#prompt").value.trim();
  let delivery=submitDelivery; submitDelivery=null;
  if(!raw) return;
  // `/queue <text>` waits for the running turn; `/steer <text>` forces a steer.
  // The rest is literal text, so `/queue /model` is a message, not a command.
  let literal=false;
  const q=raw.match(/^\/(queue|steer)(?:\s+([\s\S]*))?$/);
  if(q){
    const text=(q[2]||"").trim();
    if(!text) return; // keep "/queue " in the composer so the user can type
    delivery=q[1];
    raw=text;
    literal=true;
  }
  const s=currentSession();

  if(!literal&&(raw==="/cd"||raw.startsWith("/cd "))){
    clearComposer();
    closePalette();
    await changeDir(raw.slice(3).trim());
    return;
  }

  // a pet command typed in full runs locally (/model, /undo, …)
  if(!literal&&raw.startsWith("/")){
    const body=raw.slice(1);
    const m=body.match(/^(\S+)(?:\s+([\s\S]*))?$/);
    const name=m?.[1]??"";
    const restText=(m?.[2]??"").trim();
    const pet=PET_CMDS.find(c=>c.name===name);
    if(pet){
      // /plan <text> and /build <text>: switch first, then send the rest as the
      // next message so the switch and the prompt are one user action.
      if(pet.send && pet.run){
        const ok=await pet.run();
        if(ok===false) return; // keep the line so it can be retried
        if(restText) await sendMessage(restText, delivery);
        else clearComposer();
        return;
      }
      clearComposer();
      if(pet.pick==="model"){ if(!currentSession()&&!draft) startDraft(); await ensureModels(); openPalette("","models"); return; }
      if(pet.pick==="effort"){ if(!currentSession()&&!draft) startDraft(); await openEffortPalette(); return; }
      if(pet.pick==="agent"){ if(!currentSession()&&!draft) startDraft(); await ensureAgents(); openPalette("","agents"); return; }
      if(pet.run) return pet.run();
      if(pet.act) return runAction(pet.act);
    }
    if(!s){
      const d=draftDefaults();
      try{
        const r=await post("/api/prompt",{newSession:true,server:d.server,directory:d.directory,model:d.model,agent:d.agent,
          command:name,text:restText,title:`/${name}`});
        if(r.session) state.sessions=state.sessions.filter(x=>x.id!==r.session.id).concat(r.session);
        clearComposer();
        draft=null; selected=r.sessionId; msgKey=""; msgSession=""; view="chat"; render();
      }catch(err){ alert(String(err)); }
      return;
    }
    try{
      await post("/api/prompt",{sessionId:s.id,server:s.server,newSession:false,
        command:name,text:restText,title:`/${name}`});
      clearComposer(); msgKey="";
    }catch(err){ alert(String(err)); }
    return;
  }

  await sendMessage(raw, delivery);
});

/* ---------------- panel: left-edge resize ---------------- */
const panelResizeEl=$("#panelResize");
let resizingPanel=false;
if(panelResizeEl){
  panelResizeEl.addEventListener("pointerdown",e=>{
    if(!IS_PANEL||e.button!==0||!e.isTrusted) return;
    resizingPanel=true;
    panelResizeEl.setPointerCapture(e.pointerId);
    api.panelResize({phase:"begin",x:e.screenX});
    e.preventDefault();
  });
  panelResizeEl.addEventListener("pointermove",e=>{
    if(!resizingPanel) return;
    api.panelResize({phase:"move",x:e.screenX});
  });
  const endResize=e=>{
    if(!resizingPanel) return;
    resizingPanel=false;
    try{ panelResizeEl.releasePointerCapture(e.pointerId); }catch{}
    api.panelResize({phase:"end"});
  };
  panelResizeEl.addEventListener("pointerup",endResize);
  panelResizeEl.addEventListener("pointercancel",endResize);
}

/* ---------------- pet: drag, click, context menu ---------------- */
let drag=null;
cv.addEventListener("mousedown",e=>{ if(e.button!==0||!e.isTrusted) return;
  const r=cv.getBoundingClientRect();
  drag={x:e.screenX,y:e.screenY,moved:0};
  api.dragBegin({x:e.screenX,y:e.screenY,pet:{x:r.left,y:r.top,width:r.width,height:r.height}}); });
window.addEventListener("mousemove",e=>{ if(!drag) return;
  drag.moved=Math.max(drag.moved,Math.abs(e.screenX-drag.x)+Math.abs(e.screenY-drag.y));
  api.dragMove({x:e.screenX,y:e.screenY}); });
window.addEventListener("mouseup",e=>{ if(!drag) return; const moved=drag.moved; drag=null; api.dragEnd();
  // only a real click toggles the panel; ignored when a window move re-synthesises one
  if(IS_PET && moved<4 && e.isTrusted && Date.now()-lastLayout>600) api.panel({open:!expanded});
});

const ctx=$("#ctx");
function placeMenu(el,x,y){
  const pet=petRect(), w=el.offsetWidth, hgt=el.offsetHeight;
  let px=x, py=y;
  const roomLeft=pet.left, roomRight=innerWidth-pet.right;
  if(roomLeft>w+14) px=Math.min(x,pet.left-w-10);
  else if(roomRight>w+14) px=Math.max(x,pet.right+10);
  py=Math.min(Math.max(6,y),innerHeight-hgt-6);
  if(px+w>pet.left && px<pet.right && py+hgt>pet.top && py<pet.bottom){
    py=Math.max(6,pet.top-hgt-10);
  }
  el.style.left=Math.max(6,Math.min(px,innerWidth-w-6))+"px";
  el.style.top=py+"px";
}
// The pet surface uses native menus (they need no window space). The panel
// surface keeps this DOM menu for its session rows, where there is room.
function showMenu(items,x,y){
  ctx.innerHTML=items.map(it=>it==="sep"?`<div class="sep"></div>`
    :`<button data-act="${esc(it.act)}"${it.id?` data-sid="${esc(it.id)}"`:""}>${esc(it.label)}${it.key?`<span class="k">${esc(it.key)}</span>`:""}</button>`).join("");
  ctx.classList.add("on");
  placeMenu(ctx,x,y);
}
cv.addEventListener("contextmenu",e=>{
  if(!IS_PET) return;
  e.preventDefault();
  api.petMenu();
});
ctx.addEventListener("click",async e=>{
  const btn=e.target.closest("[data-act]"); const act=btn?.dataset.act; if(!act) return;
  const sid=btn?.dataset.sid; hideCtx();
  if(act==="s-open"){ draft=null; selected=sid; msgKey=""; setExpanded(true); showView("chat"); return; }
  if(act==="s-fork"){ const s=state.sessions.find(x=>x.id===sid); if(s) await forkSession(s); return; }
  if(act==="s-abort"){ const s=state.sessions.find(x=>x.id===sid); if(s) try{ await post("/api/abort",{server:s.server,sessionId:s.id}); }catch(err){} return; }
  if(act==="s-hide"){ const s=state.sessions.find(x=>x.id===sid); if(!s) return;
    try{ await post("/api/session/hide",{server:s.server,sessionId:s.id,hidden:true});
      finishedIds=finishedIds.filter(x=>x!==sid);
      if(selected===sid){ selected=null; msgKey=""; } }catch(err){ alert(String(err)); }
    return; }
  if(act==="s-unhide"){ try{ await post("/api/session/hide",{sessionId:sid,hidden:false}); }catch(err){ alert(String(err)); } return; }
  if(act==="new"){ startDraft(); }
  if(act==="sessions"){ setExpanded(true); showView("chat"); }
  if(act==="pets"){ setExpanded(true); showView("pets"); }
  if(act==="settings"){ setExpanded(true); showView("settings"); }
  if(act==="hide"){ setExpanded(false); }
  if(act==="quit"){ api.quit(); }
});
function hideCtx(){ ctx.classList.remove("on"); }
document.addEventListener("contextmenu",e=>{
  const row=e.target.closest("[data-session]"); if(!row) return;
  const s=state.sessions.find(x=>x.id===row.dataset.session); if(!s) return;
  if(!IS_PANEL){
    e.preventDefault();
    api.bubbleMenu({sessionId:s.id,server:s.server,state:s.state});
    return;
  }
  e.preventDefault();
  showMenu([
    {label:"Open",act:"s-open",id:s.id},
    {label:"Fork",act:"s-fork",id:s.id},
    ...(s.state==="running"?[{label:"Stop",act:"s-abort",id:s.id}]:[]),
    "sep",
    {label:"Hide from pet",act:"s-hide",id:s.id},
  ], e.clientX, e.clientY);
});
document.addEventListener("mousedown",e=>{ if(!e.target.closest("#ctx")&&!e.target.closest("#pet")) hideCtx(); });
window.addEventListener("keydown",e=>{
  if(e.key==="Escape"){ hideCtx(); closePalette(); }
  if(IS_PANEL&&(e.ctrlKey||e.metaKey)&&!e.shiftKey&&!e.altKey&&e.key.toLowerCase()==="b"){
    e.preventDefault(); setListHidden(!listHidden); return;
  }
  if(e.ctrlKey&&e.key.toLowerCase()==="n"){
    e.preventDefault();
    if(IS_PET) api.panel({open:true,action:"new"});
    else if(IS_PANEL) startDraft();
  }
});

/* ---------------- copy buttons in code blocks and messages ---------------- */
document.addEventListener("click",async e=>{
  const b=e.target.closest(".copybtn"); if(!b) return;
  const code=b.closest(".codeblock")?.querySelector("pre code"); if(!code) return;
  try{
    await copyToClipboard(code.textContent);
    b.textContent="copied";
    setTimeout(()=>{ b.textContent="copy"; },900);
  }catch{}
});
document.addEventListener("click",async e=>{
  const b=e.target.closest(".msgcopy"); if(!b) return;
  const text=msgCopy.get(b.dataset.copy); if(text==null) return;
  try{
    await copyToClipboard(text);
    b.textContent="copied"; b.title="Copied";
    setTimeout(()=>{ b.textContent="copy"; b.title="Copy message"; },1100);
  }catch{
    b.textContent="failed"; b.title="Could not copy";
    setTimeout(()=>{ b.textContent="copy"; b.title="Copy message"; },1400);
  }
});

/* ---------------- tooltip: hover in the bubble window, draw in the pet window ---------------- */
const tip=$("#tip");
function tipHtml(s){
  const txt=(s.lastText||"").trim();
  const form=(s.forms||[])[0];
  const perm=(s.pending||[])[0];
  const field=form?.fields?.find(f=>!f.hidden&&(f.title||f.description));
  // Say what the session is waiting for, not just the internal state name.
  const need=s.state==="waiting"
    ? (form?"needs your answer":perm?"needs your approval":"needs you")
    : s.state;
  const meta=[s.dirName,s.agent==="plan"?"plan":null,need].filter(Boolean).join(" · ");
  const ask=form
    ? `<div style="margin-top:5px;color:var(--wait)"><b>${esc(form.title||"Question")}</b>${
        field?.title?` · ${esc(field.title)}`:""}</div>${
        field?.description?`<div style="margin-top:3px">${esc(String(field.description).slice(0,160))}${
          String(field.description).length>160?"…":""}</div>`:""}`
    : perm
      ? `<div style="margin-top:5px;color:var(--wait)"><b>Approval</b> · ${esc(perm.permission||"")}</div>`
      : "";
  return `<b>${esc(s.title)}</b><div style="color:var(--dim);margin-top:3px">${esc(meta)}</div>`
    + ask
    + (txt?`<div style="margin-top:5px">${esc(txt.slice(0,160))}${txt.length>160?"…":""}</div>`:"");
}
document.addEventListener("mouseover",e=>{
  if(!IS_BUBBLES) return;
  const b=e.target.closest(".bub"); if(!b) return;
  const s=state.sessions.find(x=>x.id===b.dataset.session); if(!s) return;
  api.tooltip({show:true,html:tipHtml(s)});
});
document.addEventListener("mouseout",e=>{ if(IS_BUBBLES&&e.target.closest(".bub")) api.tooltip({show:false}); });
if(api.onTooltip) api.onTooltip(info=>{
  if(!IS_PET) return;
  if(!info||!info.show||!info.html){ tip.classList.remove("on"); return; }
  tip.innerHTML=info.html;
  tip.classList.add("on");
});

/* ---------------- shell <-> surfaces, events, boot ---------------- */
// shell -> pet: the panel opened/closed (the click toggles it again)
if(api.onPanel) api.onPanel(s=>{
  if(!IS_PET) return;
  lastLayout=Date.now();
  setExpanded(!!s.open);
});
// shell -> panel: what to show when the panel window is opened
if(api.onPanelCommand) api.onPanelCommand(c=>{
  if(!IS_PANEL) return;
  expanded=true;
  document.body.classList.add("expanded");
  if(c.action==="new"){ startDraft(); return; }
  if(document.body.classList.contains("mini-open")){
    document.body.classList.remove("mini-open");
    api.panelSize({full:true});
  }
  if(c.sessionId){ draft=null; selected=c.sessionId; view="chat"; msgKey=""; }
  else if(c.view){ draft=null; view=c.view; }
  // a bare open keeps whatever the panel was showing (draft or session)
  render();
});

async function loadWorkspaces(){
  try{ workspaces=(await (await fetch("/api/workspaces")).json()).workspaces||[]; }catch{ workspaces=[]; }
}
async function loadDefaults(){
  try{ defaults=await (await fetch("/api/defaults")).json(); }catch{ defaults=null; }
}
function connect(){
  const es=new EventSource("/api/events");
  es.addEventListener("state",ev=>{
    state=JSON.parse(ev.data);
    render(); // renderDetail schedules the chat refresh (and keeps it on screen)
  });
  es.onerror=()=>{ es.close(); setTimeout(connect,1500); };
}
(async ()=>{ await loadDefaults(); await loadPet(); await loadWorkspaces(); await loadCommands(); connect(); render(); })();
setInterval(()=>{ loadPet(); },4000);
setInterval(()=>{ loadWorkspaces(); loadCommands(); },15000);
</script></body></html>
