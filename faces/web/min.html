<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>cute-pets</title>
<style>
:root{--ink:#eceef6;--dim:#98a0b7;--card:#181b24;--card2:#222634;--line:#2c3142;--line2:#3a4258;
--run:#5ac8ff;--wait:#ffc65c;--err:#ff6b6b;--ok:#6ee7a8}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:transparent;overflow:hidden;
font:13px/1.45 ui-sans-serif,system-ui,"Segoe UI",sans-serif;color:var(--ink);user-select:none}
.wrap{position:relative;width:100%;height:100%}
/* ---------- panel ---------- */
.panel{position:absolute;left:4px;right:4px;top:4px;bottom:226px;display:none;flex-direction:column;
background:rgba(16,18,25,.98);border:1px solid var(--line);border-radius:14px;overflow:hidden;
box-shadow:0 18px 44px rgba(0,0,0,.6)}
body.expanded .panel{display:flex}
.panel header{display:flex;align-items:center;gap:9px;padding:9px 11px;border-bottom:1px solid var(--line)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok);flex:none}
.dot.running{background:var(--run)}.dot.waiting{background:var(--wait)}.dot.error{background:var(--err)}
.h1{font-weight:600;font-size:12.5px}
.h2{font-size:11px;color:var(--dim)}
header .sp{flex:1}
header button{background:transparent;border:0;color:var(--dim);font-size:15px;cursor:pointer;padding:2px 5px;border-radius:6px}
header button:hover{color:var(--ink);background:#20242f}
.body{display:flex;flex:1;min-height:0}
.col{min-width:0;display:flex;flex-direction:column}
.col.list{width:232px;border-right:1px solid var(--line)}
.colhead{display:flex;align-items:center;gap:6px;padding:7px 9px;font-size:11px;color:var(--dim);
text-transform:uppercase;letter-spacing:.07em}
#sessions{overflow:auto;padding:0 7px 7px;display:flex;flex-direction:column;gap:5px}
#permzone{padding:0 7px 6px}
.srow{display:flex;gap:7px;align-items:flex-start;background:var(--card);border:1px solid var(--line);
border-radius:9px;padding:6px 8px;cursor:pointer}
.srow:hover{border-color:var(--line2)}
.srow.sel{border-color:#4b5a7e;background:#1b2130}
.chip{font-size:9px;letter-spacing:.06em;text-transform:uppercase;padding:1px 5px;border-radius:999px;
border:1px solid var(--line);color:var(--dim);flex:none;margin-top:1px}
.chip.running{color:var(--run);border-color:#1d3c52;background:#10222d}
.chip.waiting{color:var(--wait);border-color:#4a3a1a;background:#2a2110}
.chip.error{color:var(--err);border-color:#4a2020;background:#2a1414}
.chip.idle{color:var(--ok);border-color:#1d4030;background:#10251c}
.stitle{font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ssub{font-size:10px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* detail */
.detail{flex:1}
.dhead{padding:8px 11px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.dhead .t{font-weight:600;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.dbody{flex:1;overflow:auto;padding:9px 11px;display:flex;flex-direction:column;gap:7px}
.msg{background:var(--card2);border-radius:9px;padding:6px 9px;font-size:11.5px;white-space:pre-wrap}
.msg.user{border-left:2px solid #3d4460;color:#c6ccdf}
.msg.assistant{border-left:2px solid var(--run)}
.empty{color:var(--dim);font-size:11.5px;text-align:center;padding:18px 8px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.07em}
textarea,input[type=text],select{width:100%;background:var(--card2);color:var(--ink);border:1px solid var(--line);
border-radius:8px;padding:7px 9px;font:inherit;font-size:12px;resize:none}
textarea{min-height:64px}
.btnrow{display:flex;gap:6px;flex-wrap:wrap}
.pbtn{background:#222736;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:4px 9px;
font:inherit;font-size:11px;cursor:pointer}
.pbtn:hover{border-color:var(--line2)}
.pbtn.ok{background:#1d4030;border-color:#2c6b4c}.pbtn.no{background:#45212a;border-color:#6b2f3a}
.pbtn.on{background:#24506b;border-color:#2f6d92}
.perm{border:1px solid #4a3a1a;background:#241d0f;border-radius:9px;padding:7px 8px;font-size:11px}
.perm b{color:var(--wait)}
/* composer + palette */
.composer{position:relative;display:flex;gap:6px;padding:8px 10px;border-top:1px solid var(--line)}
.composer input{flex:1;background:var(--card2);border:1px solid var(--line);border-radius:9px;color:var(--ink);
font:inherit;font-size:12px;padding:7px 10px;min-width:0}
.composer button{background:#24506b;border:1px solid #2f6d92;color:var(--ink);border-radius:9px;padding:6px 11px;
font:inherit;cursor:pointer}
.palette{position:absolute;left:8px;right:8px;bottom:46px;background:#171a23;border:1px solid var(--line);
border-radius:10px;box-shadow:0 -10px 26px rgba(0,0,0,.5);overflow:hidden;display:none;max-height:248px;overflow-y:auto}
.palette.on{display:block}
.pitem{display:flex;gap:8px;padding:6px 10px;cursor:pointer;align-items:baseline}
.pitem:hover,.pitem.sel{background:#222736}
.pitem .n{font-family:ui-monospace,monospace;font-size:11.5px;color:#9fd2ff;flex:none}
.pitem .n.pet{color:#8ee0b0}
.pitem .d{font-size:10.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* pet */
body.flip .panel{top:226px;bottom:4px}
body.flip .petzone{top:0;bottom:auto}
body.flip .bubbles{bottom:auto;top:220px}
.mini{position:absolute;right:6px;width:396px;display:none;flex-direction:column;gap:6px;
background:rgba(16,18,25,.98);border:1px solid var(--line);border-radius:12px;padding:9px;
box-shadow:0 16px 36px rgba(0,0,0,.6)}
body.mini-open .mini{display:flex;bottom:226px}
body.mini-open.flip .mini{bottom:auto;top:226px}
body.mini-open .panel{display:none}
.mini textarea{min-height:56px}
.petzone{position:absolute;right:0;bottom:0;width:260px;height:222px;display:flex;flex-direction:column;
align-items:center;justify-content:flex-end;padding-bottom:2px}
body.expanded .petzone{opacity:.92}
#pet{cursor:grab;width:200px;height:217px;transform-origin:50% 70%;
filter:drop-shadow(0 12px 16px rgba(0,0,0,.6));transition:transform .35s cubic-bezier(.3,1.4,.5,1)}
#pet.flip{transform:scaleX(-1)}
#pet:active{cursor:grabbing}
.bubbles{position:absolute;bottom:222px;right:0;display:flex;flex-direction:column;align-items:flex-end;gap:5px;padding:0 6px;max-width:250px}
body.expanded .bubbles{display:none}
.bub{display:flex;align-items:center;gap:6px;max-width:248px;background:rgba(24,27,36,.95);
border:1px solid var(--line);border-radius:11px;padding:5px 9px;font:inherit;font-size:11.5px;color:var(--ink);
cursor:pointer;box-shadow:0 6px 16px rgba(0,0,0,.45)}
.bub:hover{border-color:var(--line2)}
.bub i{width:7px;height:7px;border-radius:50%;background:var(--dim);flex:none}
.bub.waiting i{background:var(--wait)}.bub.running i{background:var(--run)}.bub.error i{background:var(--err)}
.bub span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* tooltip + context menu */
.tip{position:fixed;max-width:300px;background:#12151c;border:1px solid var(--line2);border-radius:9px;
padding:7px 9px;font-size:11px;color:#c8cde0;box-shadow:0 12px 26px rgba(0,0,0,.6);display:none;z-index:50}
.tip.on{display:block}
.ctx{position:fixed;min-width:186px;background:#161922;border:1px solid var(--line2);border-radius:10px;
padding:5px;box-shadow:0 16px 34px rgba(0,0,0,.65);display:none;z-index:60}
.ctx.on{display:block}
.ctx button{display:block;width:100%;text-align:left;background:transparent;border:0;color:var(--ink);
font:inherit;font-size:12px;padding:6px 9px;border-radius:7px;cursor:pointer}
.ctx button:hover{background:#222736}
.ctx .sep{height:1px;background:var(--line);margin:4px 6px}
.ctx .k{float:right;color:var(--dim);font-size:10.5px}
</style></head>
<body class="minimized">
<div class="wrap">
  <section class="panel">
    <header>
      <div class="dot" id="dot"></div>
      <div style="min-width:0"><div class="h1" id="petname">pet</div><div class="h2" id="psub">starting…</div></div>
      <div class="sp"></div>
      <button id="btnNew" title="New chat (Ctrl+N)">+</button>
      <button id="btnSettings" title="Settings">&#9881;</button>
      <button id="collapse" title="Collapse">&#10005;</button>
    </header>
    <div class="body">
      <aside class="col list">
        <div class="colhead">sessions <select id="filter" style="width:auto;padding:2px 4px;font-size:10.5px"></select></div>
        <div id="permzone"></div>
        <div id="sessions"></div>
      </aside>
      <section class="col detail">
        <div class="dhead"><span class="chip idle" id="dstate">idle</span><div class="t" id="dtitle">Nothing selected</div>
          <span class="ssub" id="dmeta" style="flex:none"></span>
          <button class="pbtn" id="dabort" style="display:none">stop</button></div>
        <div class="dbody" id="dbody"></div>
      </section>
    </div>
    <form class="composer" id="composer">
      <div class="palette" id="palette"></div>
      <input id="prompt" placeholder="Message the selected session — / for commands" autocomplete="off">
      <button type="submit">&#9166;</button>
    </form>
  </section>

  <section class="mini" id="mini">
    <div class="row" style="gap:6px">
      <b style="font-size:11.5px">New chat</b>
      <span class="ssub" id="miniDir" style="flex:1;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></span>
      <button class="pbtn" id="miniDirBtn" title="Choose folder">folder</button>
      <button class="pbtn" id="miniX" title="Close">&#10005;</button>
    </div>
    <textarea id="miniText" placeholder="What should OpenCode do?"></textarea>
    <div class="row"><button class="pbtn ok" id="miniGo" style="flex:1">Start chat</button></div>
  </section>

  <div class="petzone">
    <div class="bubbles" id="bubbles"></div>
    <canvas id="pet" width="400" height="434"></canvas>
  </div>
</div>
<div class="tip" id="tip"></div>
<div class="ctx" id="ctx"></div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const api=window.cp||{setExpanded(){},setIgnore(){},setFacing(){},onFacing(){},pickFolder:async()=>({ok:false})};
const B="";
let state={pet:{state:"idle"},sessions:[],permissions:[],servers:[]};
let expanded=false, selected=null, view="chat", filter="all", commands=[], newDir=null, workspaces=[];

/* ---------------- sprite ---------------- */
const FW=192,FH=208,FRAMES=8;
const ROW={idle:0,running:2,waiting:6,error:9};
const FPS={idle:6,running:11,waiting:5,error:4};
const img=new Image(), cv=$("#pet"), ctx2=cv.getContext("2d");
const valid={}; let petState="idle", facing="right", petKey="";
function measure(){
  const c=document.createElement("canvas"); c.width=FW; c.height=FH; const g=c.getContext("2d");
  for(let r=0;r<11;r++){ let last=1;
    for(let f=0;f<FRAMES;f++){
      g.clearRect(0,0,FW,FH); g.drawImage(img,f*FW,r*FH,FW,FH,0,0,FW,FH);
      const d=g.getImageData(0,0,FW,FH).data; let solid=0;
      for(let i=3;i<d.length;i+=4*17) if(d[i]>16) solid++;
      if(solid>10) last=f+1;
    }
    valid[r]=last;
  }
}
function draw(t){
  if(img.complete&&img.naturalWidth&&petKey){
    const r=ROW[petState]??0, n=valid[r]||FRAMES, s=FPS[petState]||6;
    const f=Math.floor(t/1000*s)%n;
    ctx2.clearRect(0,0,cv.width,cv.height);
    ctx2.drawImage(img,f*FW,r*FH,FW,FH,0,0,cv.width,cv.height);
  }
  requestAnimationFrame(draw);
}
img.onload=()=>{ measure(); };
requestAnimationFrame(draw);
async function loadPet(){
  try{
    const p=await (await fetch("/api/pet")).json();
    if(p.url && p.url!==petKey){
      petKey=p.url; img.src=p.url;
      $("#petname").textContent=p.name||"pet";
      document.title=p.name||"cute-pets";
    }
  }catch{}
}
function applyFacing(){ cv.classList.toggle("flip", facing==="left"); }
api.onFacing((f)=>{ facing=f; applyFacing(); });

/* ---------------- helpers ---------------- */
async function post(path, body){
  const r=await fetch(path,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.error||r.status);
  return j;
}
const PANEL_H=574;
let lastLayout=0;   // setExpanded moves the window; a click that lands right after is noise
function petRect(){ return cv.getBoundingClientRect(); }
function setExpanded(on){
  if(on===expanded) return;
  lastLayout=Date.now();
  const before=petRect().top;
  expanded=on;
  document.body.classList.toggle("expanded",on);
  document.body.classList.toggle("minimized",!on);
  // If there is no room above the pet for the panel, render it below instead and
  // move the window down by the same amount so the pet does not appear to jump.
  const petTopScreen=window.screenY+before;
  const flip=on && petTopScreen < PANEL_H+12;
  document.body.classList.toggle("flip",flip);
  const after=petRect().top;
  if(api.moveBy && before!==after) api.moveBy(0, Math.round(before-after));
  api.setExpanded(on);
  if(!on) document.body.classList.remove("mini-open");
}
function showView(v){ view=v; render(); }
const currentSession=()=>state.sessions.find(s=>s.id===selected)||null;

/* ---------------- rendering ---------------- */
function renderBubbles(){
  const act=state.sessions.filter(s=>s.state!=="idle")
    .sort((a,b)=>(a.state==="waiting"?0:1)-(b.state==="waiting"?0:1)).slice(0,3);
  $("#bubbles").innerHTML=act.map(s=>`<button class="bub ${s.state}" data-session="${esc(s.id)}">
      <i></i><span>${esc(s.title)}</span></button>`).join("");
}
function renderList(){
  const dirs=[...new Set(state.sessions.map(s=>s.dirName).filter(Boolean))].sort();
  const sel=$("#filter");
  if(sel.dataset.k!==dirs.join("|")){
    const cur=sel.value||"all";
    sel.innerHTML=`<option value="all">all</option>`+dirs.map(d=>`<option value="${esc(d)}">${esc(d)}</option>`).join("");
    sel.value=dirs.includes(cur)?cur:"all";
    sel.dataset.k=dirs.join("|");
  }
  const list=state.sessions.filter(s=>sel.value==="all"||s.dirName===sel.value);
  $("#sessions").innerHTML=list.length?list.map(s=>`
    <div class="srow ${s.id===selected?"sel":""}" data-session="${esc(s.id)}">
      <span class="chip ${s.state}">${s.state}</span>
      <div style="min-width:0;flex:1">
        <div class="stitle">${esc(s.title)}</div>
        <div class="ssub">${esc(s.dirName||"")}${s.lastText?" · "+esc(s.lastText.slice(0,42)):""}</div>
      </div>
    </div>`).join(""):`<div class="empty">no sessions</div>`;
}
function renderPerms(){
  const perms=state.permissions||[];
  $("#permzone").innerHTML=perms.slice(0,3).map(p=>`<div class="perm">
      <b>Approval</b> · ${esc(p.permission)}
      ${(p.patterns||[]).length?`<div style="color:var(--dim);font-size:10px">${esc((p.patterns||[]).join(", "))}</div>`:""}
      <div class="btnrow" style="margin-top:5px">
        <button class="pbtn ok" data-perm="${esc(p.id)}" data-reply="once">once</button>
        <button class="pbtn" data-perm="${esc(p.id)}" data-reply="always">always</button>
        <button class="pbtn no" data-perm="${esc(p.id)}" data-reply="reject">reject</button>
      </div></div>`).join("")+(perms.length>3?`<div class="ssub" style="padding:4px 2px">+${perms.length-3} more</div>`:"");
}
function renderDetail(){
  const s=currentSession();
  $("#dstate").className="chip "+(s?s.state:"idle");
  $("#dstate").textContent=s?s.state:"idle";
  $("#dtitle").textContent = view==="new" ? "New chat"
    : view==="pets" ? "Pets" : view==="settings" ? "Settings"
    : s?s.title:"Nothing selected";
  $("#dabort").style.display = s&&s.state==="running" ? "" : "none";
  $("#dmeta").textContent = s ? [s.model?.id, s.agent].filter(Boolean).join(" · ") : "";
  const body=$("#dbody");
  if(view==="new"){ body.innerHTML=newChatHtml(); return; }
  if(view==="pets"){ body.innerHTML=petsHtml(); return; }
  if(view==="settings"){ body.innerHTML=settingsHtml(); return; }
  if(!s){ body.innerHTML=`<div class="empty">pick a session, or press + for a new chat</div>`; return; }
  body.innerHTML=`<div class="empty">loading…</div>`;
  loadMessages(s);
}
let msgKey="";
async function loadMessages(s){
  try{
    const msgs=await (await fetch(`/api/messages?server=${encodeURIComponent(s.server)}&sessionId=${encodeURIComponent(s.id)}&limit=30`)).json();
    const rows=(msgs||[]).map(m=>({m,t:(m.parts||[]).map(p=>p.text).join("\n").trim()})).filter(x=>x.t);
    const key=JSON.stringify(rows.map(r=>r.t));
    const body=$("#dbody");
    if(key===msgKey) return;
    msgKey=key;
    body.innerHTML=rows.map(({m,t})=>`<div class="msg ${m.role==="user"?"user":"assistant"}">${esc(t)}</div>`).join("")
      ||`<div class="empty">no messages yet</div>`;
    body.scrollTop=body.scrollHeight;
  }catch(e){ $("#dbody").innerHTML=`<div class="empty">${esc(e)}</div>`; }
}
function newChatHtml(){
  const opts=workspaces.slice(0,8).map(w=>`<option value="${esc(w.directory)}">${esc(w.dirName)} — ${esc(w.directory)}</option>`).join("");
  return `<div class="field"><label>Prompt</label>
      <textarea id="newtext" placeholder="What should OpenCode do?"></textarea></div>
    <div class="field"><label>Working directory</label>
      <div class="btnrow">
        <select id="newdir" style="flex:1;min-width:0">${opts}</select>
        <button class="pbtn" id="pickDir">Choose folder…</button>
      </div>
      <div class="ssub" id="newdirtext">${esc(newDir||workspaces[0]?.directory||"(no folder picked)")}</div></div>
    <div class="btnrow"><button class="pbtn ok" id="newgo">Start chat</button></div>`;
}
function petsHtml(){
  return `<div id="petlist" style="display:flex;flex-direction:column;gap:5px"></div>
    <div class="btnrow" style="margin-top:8px">
      <button class="pbtn" id="importZip">Import .zip</button>
      <button class="pbtn" id="importDir">Import folder</button>
    </div>`;
}
function settingsHtml(){
  return `<div class="field"><label>Facing</label>
      <div class="btnrow">
        <button class="pbtn ${facing==="right"?"on":""}" data-facing="right">right (authored)</button>
        <button class="pbtn ${facing==="left"?"on":""}" data-facing="left">left (mirrored)</button>
      </div></div>
    <div class="field"><label>Config</label><div class="ssub" style="font-family:ui-monospace,monospace">~/.cute-pets/config.json</div></div>
    <div class="field"><label>Pets folder</label><div class="ssub" style="font-family:ui-monospace,monospace">~/.cute-pets/pets/</div></div>
    <div class="field"><label>Sessions</label><div class="ssub">${state.sessions.length} tracked across ${(state.servers||[]).filter(s=>s.online).length} servers</div></div>
    <div class="field"><label>Hidden from pet</label>
      ${(state.hidden||[]).length
        ? (state.hidden||[]).map(x=>`<div class="srow" style="cursor:default"><div style="min-width:0;flex:1">
             <div class="stitle">${esc(x.title)}</div><div class="ssub">hidden, still in OpenCode</div></div>
             <button class="pbtn" data-act="s-unhide" data-sid="${esc(x.id)}">unhide</button></div>`).join("")
        : `<div class="ssub">none - right-click a session and pick "Hide from pet"</div>`}
    </div>`;
}
async function renderPetsList(){
  const el=$("#petlist"); if(!el) return;
  const {pets,active}=await (await fetch("/api/pets")).json();
  el.innerHTML=(pets||[]).map(p=>`<div class="srow ${p.id===active?"sel":""}" data-pet="${esc(p.id)}">
      <div style="min-width:0;flex:1"><div class="stitle">${esc(p.name)}</div>
      <div class="ssub">${esc(p.id)}</div></div>
      ${p.id===active?`<span class="chip idle">active</span>`:""}</div>`).join("")
    ||`<div class="empty">no pets imported</div>`;
}

function render(){
  petState=(state.pet&&state.pet.state)||"idle";
  $("#dot").className="dot "+petState;
  const c=state.pet?.counts||{};
  $("#psub").textContent=[c.waiting?`${c.waiting} needs you`:"",c.running?`${c.running} working`:"",
    c.error?`${c.error} error`:"",`${c.idle||0} idle`].filter(Boolean).join(" · ")||"idle";
  renderBubbles(); renderList(); renderPerms(); renderDetail();
  if(view==="pets") renderPetsList();
}

/* ---------------- interactions ---------------- */
document.addEventListener("click",async e=>{
  const unh=e.target.closest("[data-act='s-unhide']");
  if(unh){ try{ await post("/api/session/hide",{sessionId:unh.dataset.sid,hidden:false}); }catch(err){ alert(String(err)); }
    showView("settings"); return; }
  const perm=e.target.closest("[data-perm]");
  if(perm){ try{ await post("/api/permission",{id:perm.dataset.perm,reply:perm.dataset.reply}); }catch(err){} return; }
  const row=e.target.closest("[data-session]");
  if(row){ selected=row.dataset.session; msgKey=""; showView("chat"); setExpanded(true); return; }
  const pet=e.target.closest("[data-pet]");
  if(pet){ try{ await post("/api/pets/active",{id:pet.dataset.pet}); await loadPet(); renderPetsList(); }catch(err){} return; }
  const face=e.target.closest("[data-facing]");
  if(face){ facing=face.dataset.facing; applyFacing(); api.setFacing(facing); render(); return; }
  if(e.target.id==="btnNew"){ openMini(); return; }
  if(e.target.id==="miniX"){ setExpanded(false); return; }
  if(e.target.id==="miniDirBtn"){ const r=await api.pickFolder(); if(r&&r.ok){ newDir=r.path; $("#miniDir").textContent=r.path; } return; }
  if(e.target.id==="miniGo"){ await startMini(); return; }
  if(e.target.id==="btnSettings"){ setExpanded(true); showView("settings"); return; }
  if(e.target.id==="collapse"){ setExpanded(false); return; }
  if(e.target.id==="dabort"){ const s=currentSession(); if(s) try{ await post("/api/abort",{server:s.server,sessionId:s.id}); }catch(err){} return; }
  if(e.target.id==="newgo"){ await startNewChat(); return; }
  if(e.target.id==="pickDir"){ const r=await api.pickFolder(); if(r&&r.ok){ newDir=r.path;
      const sel=$("#newdir"); const o=document.createElement("option"); o.value=r.path; o.textContent=r.path; o.selected=true; sel?.append(o);
      const t=$("#newdirtext"); if(t) t.textContent=r.path; } return; }
  if(e.target.id==="importZip"){ await api.importPet("file"); await loadPet(); renderPetsList(); return; }
  if(e.target.id==="importDir"){ await api.importPet("folder"); await loadPet(); renderPetsList(); return; }
  hideCtx();
});

$("#filter").addEventListener("change",render);

function openMini(){
  newDir=newDir||workspaces[0]?.directory||null;
  setExpanded(true);
  document.body.classList.add("mini-open");
  $("#miniDir").textContent=newDir||"no folder";
  $("#miniDir").textContent=newDir||"no folder";
  setTimeout(()=>$("#miniText").focus(),60);
}
async function startMini(){
  const text=$("#miniText").value.trim(); if(!text) return;
  const dir=newDir||null;
  try{
    const r=await post("/api/prompt",{newSession:true,text,directory:dir});
    $("#miniText").value="";
    selected=r.sessionId; msgKey=""; showView("chat");
    document.body.classList.remove("mini-open");
  }catch(e){ alert(String(e)); }
}

async function startNewChat(){
  const text=$("#newtext")?.value.trim(); if(!text) return;
  const dir=$("#newdir")?.value||newDir||null;
  try{
    const r=await post("/api/prompt",{newSession:true,text,directory:dir});
    selected=r.sessionId; msgKey=""; setExpanded(true); showView("chat");
    await post("/api/workspace",{directory:dir}).catch(()=>{});
  }catch(e){ alert(String(e)); }
}

/* ---------------- composer + command palette ---------------- */
// Commands the pet implements itself. `GET /command` only returns prompt-template
// commands (init/review/…), because /model, /new, /share and friends are TUI-client
// commands that never reach the server. Those are re-implemented here on the API.
const PET_CMDS=[
  {name:"new",      d:"start a chat in a folder",           run:()=>{ setExpanded(true); newDir=workspaces[0]?.directory||null; showView("new"); }},
  {name:"sessions", d:"show the session list",              run:()=>{ setExpanded(true); showView("chat"); }},
  {name:"model",    d:"switch the model for this session",  pick:"model"},
  {name:"agent",    d:"switch agent (build, plan, explore)",pick:"agent"},
  {name:"compact",  d:"summarize this conversation",        act:"compact"},
  {name:"undo",     d:"revert the last message",            act:"undo"},
  {name:"redo",     d:"restore reverted messages",          act:"redo"},
  {name:"share",    d:"create a share link",                act:"share"},
  {name:"abort",    d:"stop the running session",           act:"abort"},
  {name:"pets",     d:"choose the pet",                     run:()=>{ setExpanded(true); showView("pets"); }},
  {name:"settings", d:"facing, config, paths",              run:()=>{ setExpanded(true); showView("settings"); }},
  {name:"help",     d:"list available commands",            run:()=>{ setExpanded(true); openPalette(""); }},
];
let modelsList=[], agentsList=[], palMode="root";

const pal=$("#palette"); let palSel=0, palItems=[];
async function loadCommands(){
  const s=currentSession();
  try{
    const q=s?`?server=${encodeURIComponent(s.server)}`:"";
    commands=(await (await fetch("/api/commands"+q)).json()).commands||[];
  }catch{ commands=[]; }
}
async function ensureModels(){
  if(modelsList.length) return modelsList;
  const s=currentSession();
  try{
    const q=s?`?server=${encodeURIComponent(s.server)}`:"";
    modelsList=(await (await fetch("/api/models"+q)).json()).models||[];
  }catch{ modelsList=[]; }
  return modelsList;
}
async function ensureAgents(){
  if(agentsList.length) return agentsList;
  const s=currentSession();
  try{
    const q=s?`?server=${encodeURIComponent(s.server)}`:"";
    agentsList=(await (await fetch("/api/agents"+q)).json()).agents||[];
  }catch{ agentsList=[]; }
  return agentsList;
}

function openPalette(prefix="",mode="root"){
  palMode=mode;
  const q=prefix.toLowerCase();
  if(mode==="models"){
    palItems=modelsList.map(m=>({kind:"model",label:m.id,sub:`${m.providerID}${m.free?" · free":""}${m.default?" · default":""}`,value:m}));
  }else if(mode==="agents"){
    palItems=agentsList.map(a=>({kind:"agent",label:a.name,sub:a.description||a.mode||"",value:a.name}));
  }else{
    palItems=[
      ...commands.filter(c=>c.name.toLowerCase().startsWith(q))
        .map(c=>({kind:"command",label:"/"+c.name,sub:c.description||""})),
      ...PET_CMDS.filter(c=>c.name.toLowerCase().startsWith(q))
        .map(c=>({kind:"pet",label:"/"+c.name,sub:c.d})),
    ];
  }
  palSel=0;
  pal.classList.toggle("on",palItems.length>0);
  pal.innerHTML=palItems.map((it,i)=>`<div class="pitem ${i===0?"sel":""}" data-i="${i}">
      <span class="n${it.kind==="pet"?" pet":""}">${esc(it.label)}</span><span class="d">${esc(it.sub)}</span></div>`).join("");
}
function closePalette(){ pal.classList.remove("on"); pal.innerHTML=""; palItems=[]; palMode="root"; }

async function choosePalette(i){
  const it=palItems[i]; if(!it) return;
  if(it.kind==="command"){ $("#prompt").value=it.label+" "; closePalette(); $("#prompt").focus(); return; }
  if(it.kind==="model"||it.kind==="agent"){
    const s=currentSession();
    if(!s){ closePalette(); return; }
    try{ await post("/api/session/action",{server:s.server,sessionId:s.id,action:it.kind,value:it.value}); }catch(e){ alert(String(e)); }
    closePalette(); $("#prompt").value=""; msgKey=""; return;
  }
  const cmd=PET_CMDS.find(c=>"/"+c.name===it.label);
  closePalette(); $("#prompt").value="";
  if(!cmd) return;
  if(cmd.pick==="model"){ await ensureModels(); openPalette("","models"); return; }
  if(cmd.pick==="agent"){ await ensureAgents(); openPalette("","agents"); return; }
  if(cmd.run) return cmd.run();
  if(cmd.act) return runAction(cmd.act);
}

async function runAction(act){
  const s=currentSession();
  if(!s){ alert("pick a session first"); return; }
  try{
    if(act==="abort"){ await post("/api/abort",{server:s.server,sessionId:s.id}); return; }
    const r=await post("/api/session/action",{server:s.server,sessionId:s.id,action:act});
    if(act==="share"&&r.url){ try{ await navigator.clipboard.writeText(r.url); alert("Share link copied:\n"+r.url); }catch{ alert("Share link:\n"+r.url); } }
  }catch(e){ alert(String(e)); }
}

$("#prompt").addEventListener("input",e=>{
  const v=e.target.value;
  if(palMode!=="root"){ if(!v.startsWith("/")) closePalette(); else openPalette(v.slice(1).split(" ")[0], palMode); return; }
  if(v.startsWith("/")) openPalette(v.slice(1).split(" ")[0]);
  else closePalette();
});
$("#prompt").addEventListener("keydown",e=>{
  if(!pal.classList.contains("on")) return;
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){
    e.preventDefault();
    palSel=(palSel+(e.key==="ArrowDown"?1:-1)+palItems.length)%palItems.length;
    [...pal.children].forEach((el,i)=>el.classList.toggle("sel",i===palSel));
    pal.children[palSel]?.scrollIntoView({block:"nearest"});
  } else if(e.key==="Tab"){
    e.preventDefault(); choosePalette(palSel);
  } else if(e.key==="Enter"){
    e.preventDefault(); choosePalette(palSel);
  } else if(e.key==="Escape"){ closePalette(); }
});
pal.addEventListener("click",e=>{
  const it=e.target.closest("[data-i]"); if(!it) return;
  choosePalette(Number(it.dataset.i));
});

$("#composer").addEventListener("submit",async e=>{
  e.preventDefault();
  const raw=$("#prompt").value.trim(); if(!raw) return;
  const s=currentSession();

  // a pet command typed in full runs locally (/model, /undo, …)
  if(raw.startsWith("/")){
    const [name,...rest]=raw.slice(1).split(" ");
    const pet=PET_CMDS.find(c=>c.name===name);
    if(pet){
      $("#prompt").value="";
      if(pet.pick==="model"){ await ensureModels(); openPalette("","models"); return; }
      if(pet.pick==="agent"){ await ensureAgents(); openPalette("","agents"); return; }
      if(pet.run) return pet.run();
      if(pet.act) return runAction(pet.act);
    }
    try{
      await post("/api/prompt",{sessionId:s?s.id:null,server:s?s.server:null,newSession:!s,
        command:name,text:rest.join(" "),title:`/${name}`});
      $("#prompt").value=""; msgKey="";
    }catch(err){ alert(String(err)); }
    return;
  }

  try{
    await post("/api/prompt",{sessionId:s?s.id:null,server:s?s.server:null,newSession:!s,text:raw});
    $("#prompt").value=""; msgKey="";
    if(s) setTimeout(()=>loadMessages(s),700);
  }catch(err){ alert(String(err)); }
});

/* ---------------- pet: drag, click, context menu ---------------- */
let drag=null;
cv.addEventListener("mousedown",e=>{ if(e.button!==0||!e.isTrusted) return;
  const r=cv.getBoundingClientRect();
  drag={x:e.screenX,y:e.screenY,moved:0};
  api.dragBegin({x:e.screenX,y:e.screenY,pet:{x:r.left,y:r.top,width:r.width,height:r.height}}); });
window.addEventListener("mousemove",e=>{ if(!drag) return;
  drag.moved=Math.max(drag.moved,Math.abs(e.screenX-drag.x)+Math.abs(e.screenY-drag.y));
  api.dragMove({x:e.screenX,y:e.screenY}); });
window.addEventListener("mouseup",e=>{ if(!drag) return; const moved=drag.moved; drag=null; api.dragEnd();
  // only a real click toggles the panel; ignored when a window move re-synthesises one
  if(moved<4 && e.isTrusted && Date.now()-lastLayout>600) setExpanded(!expanded); });

const ctx=$("#ctx");
function placeMenu(el,x,y){
  const pet=petRect(), w=el.offsetWidth, hgt=el.offsetHeight;
  let px=x, py=y;
  const roomLeft=pet.left, roomRight=innerWidth-pet.right;
  if(roomLeft>w+14) px=Math.min(x,pet.left-w-10);
  else if(roomRight>w+14) px=Math.max(x,pet.right+10);
  py=Math.min(Math.max(6,y),innerHeight-hgt-6);
  if(px+w>pet.left && px<pet.right && py+hgt>pet.top && py<pet.bottom){
    py=Math.max(6,pet.top-hgt-10);
  }
  el.style.left=Math.max(6,Math.min(px,innerWidth-w-6))+"px";
  el.style.top=py+"px";
}
function showMenu(items,x,y){
  ctx.innerHTML=items.map(it=>it==="sep"?`<div class="sep"></div>`
    :`<button data-act="${esc(it.act)}"${it.id?` data-sid="${esc(it.id)}"`:""}>${esc(it.label)}${it.key?`<span class="k">${esc(it.key)}</span>`:""}</button>`).join("");
  ctx.classList.add("on");
  placeMenu(ctx,x,y);
}
cv.addEventListener("contextmenu",e=>{
  e.preventDefault();
  const items=[
    ["New chat…","new","ctrl+n"],["Sessions","sessions",""],["Pets","pets",""],["Settings","settings",""],
    ["sep","",""],["Hide pet","hide",""],["Quit","quit",""],
  ];
  ctx.innerHTML=items.map(([label,act,key])=>label==="sep"?`<div class="sep"></div>`
    :`<button data-act="${act}">${label}${key?`<span class="k">${key}</span>`:""}</button>`).join("");
  ctx.classList.add("on");
  placeMenu(ctx, e.clientX, e.clientY);
});
ctx.addEventListener("click",async e=>{
  const btn=e.target.closest("[data-act]"); const act=btn?.dataset.act; if(!act) return;
  const sid=btn?.dataset.sid; hideCtx();
  if(act==="s-open"){ selected=sid; msgKey=""; setExpanded(true); showView("chat"); return; }
  if(act==="s-abort"){ const s=state.sessions.find(x=>x.id===sid); if(s) try{ await post("/api/abort",{server:s.server,sessionId:s.id}); }catch(err){} return; }
  if(act==="s-hide"){ const s=state.sessions.find(x=>x.id===sid); if(!s) return;
    try{ await post("/api/session/hide",{server:s.server,sessionId:s.id,hidden:true});
      if(selected===sid){ selected=null; msgKey=""; } }catch(err){ alert(String(err)); }
    return; }
  if(act==="s-unhide"){ try{ await post("/api/session/hide",{sessionId:sid,hidden:false}); }catch(err){ alert(String(err)); } return; }
  if(act==="new"){ openMini(); }
  if(act==="sessions"){ setExpanded(true); showView("chat"); }
  if(act==="pets"){ setExpanded(true); showView("pets"); }
  if(act==="settings"){ setExpanded(true); showView("settings"); }
  if(act==="hide"){ setExpanded(false); }
  if(act==="quit"){ api.quit(); }
});
function hideCtx(){ ctx.classList.remove("on"); }
document.addEventListener("contextmenu",e=>{
  const row=e.target.closest("[data-session]"); if(!row) return;
  e.preventDefault();
  const s=state.sessions.find(x=>x.id===row.dataset.session); if(!s) return;
  showMenu([
    {label:"Open",act:"s-open",id:s.id},
    ...(s.state==="running"?[{label:"Stop",act:"s-abort",id:s.id}]:[]),
    "sep",
    {label:"Hide from pet",act:"s-hide",id:s.id},
  ], e.clientX, e.clientY);
});
document.addEventListener("mousedown",e=>{ if(!e.target.closest("#ctx")&&!e.target.closest("#pet")) hideCtx(); });
window.addEventListener("keydown",e=>{
  if(e.key==="Escape"){ hideCtx(); closePalette(); }
  if(e.ctrlKey&&e.key.toLowerCase()==="n"){ e.preventDefault(); openMini(); }
});

/* ---------------- tooltip on bubbles ---------------- */
const tip=$("#tip");
document.addEventListener("mouseover",e=>{
  const b=e.target.closest(".bub"); if(!b) return;
  const s=state.sessions.find(x=>x.id===b.dataset.session); if(!s) return;
  const txt=(s.lastText||"").trim();
  tip.innerHTML=`<b>${esc(s.title)}</b><div style="color:var(--dim);margin-top:3px">${esc(s.dirName||"")} · ${esc(s.state)}</div>`
    + (txt?`<div style="margin-top:5px">${esc(txt.slice(0,160))}${txt.length>160?"…":""}</div>`:"");
  tip.classList.add("on");
  const r=b.getBoundingClientRect();
  tip.style.left=Math.max(6,Math.min(r.left, innerWidth-310))+"px";
  tip.style.top=Math.max(6,r.top-tip.offsetHeight-8)+"px";
});
document.addEventListener("mouseout",e=>{ if(e.target.closest(".bub")) tip.classList.remove("on"); });

/* ---------------- passthrough, events, boot ---------------- */
document.addEventListener("mousemove",e=>{
  const el=document.elementFromPoint(e.clientX,e.clientY);
  // .mini must be here too, or the window stays click-through over the popover
  api.setIgnore(!(el&&el.closest(".interactive, .panel, .petzone, .ctx, .tip, .palette, .mini")));
});

async function loadWorkspaces(){
  try{ workspaces=(await (await fetch("/api/workspaces")).json()).workspaces||[]; }catch{ workspaces=[]; }
}
function connect(){
  const es=new EventSource("/api/events");
  es.addEventListener("state",ev=>{
    state=JSON.parse(ev.data); render();
    if(expanded&&view==="chat"&&currentSession()) loadMessages(currentSession());
  });
  es.onerror=()=>{ es.close(); setTimeout(connect,1500); };
}
(async ()=>{ await loadPet(); await loadWorkspaces(); await loadCommands(); connect(); render(); })();
setInterval(()=>{ loadPet(); },4000);
setInterval(()=>{ loadWorkspaces(); loadCommands(); },15000);
</script></body></html>
