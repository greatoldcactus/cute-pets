<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>cute-pets</title>
<style>
:root{--ink:#eceef6;--dim:#98a0b7;--card:#181b24;--card2:#222634;--line:#2c3142;--line2:#3a4258;
--run:#5ac8ff;--wait:#ffc65c;--err:#ff6b6b;--ok:#6ee7a8;--plan:#a78bfa}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:transparent;overflow:hidden;
font:13px/1.45 ui-sans-serif,system-ui,"Segoe UI",sans-serif;color:var(--ink);user-select:none}
.wrap{position:relative;width:100%;height:100%}
/* ---------- panel ---------- */
.panel{position:absolute;left:4px;right:4px;top:auto;bottom:226px;height:var(--panelH,574px);display:none;flex-direction:column;
background:rgba(16,18,25,.98);border:1px solid var(--line);border-radius:14px;overflow:hidden;
box-shadow:0 18px 44px rgba(0,0,0,.6)}
body.expanded .panel{display:flex}
#panelResize{position:absolute;left:0;top:0;bottom:0;width:7px;cursor:ew-resize;z-index:20;display:none}
body.mode-panel #panelResize{display:block}
#panelResize:hover,#panelResize:active{background:linear-gradient(90deg,rgba(90,200,255,.32),rgba(90,200,255,0))}
.panel header{display:flex;align-items:center;gap:9px;padding:9px 11px;border-bottom:1px solid var(--line)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok);flex:none}
.dot.running{background:var(--run)}.dot.waiting{background:var(--wait)}.dot.error{background:var(--err)}
.dot.plan{background:var(--plan);box-shadow:0 0 7px rgba(167,139,250,.75)}
.h1{font-weight:600;font-size:12.5px}
.h2{font-size:11px;color:var(--dim)}
header .sp{flex:1}
header button{background:transparent;border:0;color:var(--dim);font-size:15px;cursor:pointer;padding:2px 5px;border-radius:6px}
header button:hover{color:var(--ink);background:#20242f}
.body{display:flex;flex:1;min-height:0}
.col{min-width:0;display:flex;flex-direction:column}
.col.list{width:232px;border-right:1px solid var(--line)}
body.list-hidden .col.list{display:none}
.colhead{display:flex;align-items:center;gap:6px;padding:7px 9px;font-size:11px;color:var(--dim);
text-transform:uppercase;letter-spacing:.07em}
#sessions{overflow:auto;padding:0 7px 7px;display:flex;flex-direction:column;gap:5px}
#permzone{padding:0 7px 6px}
.srow{display:flex;gap:7px;align-items:flex-start;background:var(--card);border:1px solid var(--line);
border-radius:9px;padding:6px 8px;cursor:pointer}
.srow:hover{border-color:var(--line2)}
.srow.sel{border-color:#4b5a7e;background:#1b2130}
.chip{font-size:9px;letter-spacing:.06em;text-transform:uppercase;padding:1px 5px;border-radius:999px;
border:1px solid var(--line);color:var(--dim);flex:none;margin-top:1px}
.chip.running{color:var(--run);border-color:#1d3c52;background:#10222d}
.chip.waiting{color:var(--wait);border-color:#4a3a1a;background:#2a2110}
.chip.error{color:var(--err);border-color:#4a2020;background:#2a1414}
.chip.idle{color:var(--ok);border-color:#1d4030;background:#10251c}
.chip.plan{color:var(--plan);border-color:#3f3168;background:#1d1730}
.stitle{font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ssub{font-size:10px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* detail */
.detail{flex:1}
.dhead{padding:8px 11px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.dhead .t{font-weight:600;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.dhead #dmeta{max-width:52%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dbody{flex:1;overflow:auto;padding:9px 11px;display:flex;flex-direction:column;gap:7px}
.msg{position:relative;background:var(--card2);border-radius:9px;padding:6px 9px;font-size:11.5px;white-space:normal;overflow-wrap:anywhere}
.msg.copyable{padding-right:50px}
.msgcopy{position:absolute;top:5px;right:6px;background:transparent;border:0;color:var(--dim);
font:inherit;font-size:9px;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;padding:2px 4px;
border-radius:5px;opacity:.5}
.msgcopy:hover,.msgcopy:focus-visible{opacity:1;background:#20242f;color:var(--ink)}
.dbody .msg{user-select:text}
.msg.user{border-left:2px solid #3d4460;color:#c6ccdf}
.msg.assistant{border-left:2px solid var(--run)}
/* markdown */
.msg p{margin:0 0 7px}.msg p:last-child{margin-bottom:0}
.msg h1,.msg h2,.msg h3,.msg h4{margin:9px 0 5px;line-height:1.3}
.msg h1{font-size:14px}.msg h2{font-size:13px}.msg h3{font-size:12px}.msg h4{font-size:11.5px}
.msg ul,.msg ol{margin:4px 0;padding-left:18px}.msg li{margin:1px 0}
.msg blockquote{margin:6px 0;padding:2px 9px;border-left:2px solid var(--line2);color:var(--dim)}
.msg code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:10.5px;
background:#10131b;border:1px solid var(--line);border-radius:4px;padding:0 3px}
.msg .codeblock{margin:7px 0;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:#0d1017}
.msg .codehead{display:flex;justify-content:space-between;align-items:center;gap:8px;
padding:3px 8px;background:#151923;color:var(--dim);font-size:9.5px;text-transform:uppercase;letter-spacing:.07em}
.msg .codehead .copybtn{background:transparent;border:0;color:var(--dim);font:inherit;font-size:9.5px;
text-transform:none;letter-spacing:0;cursor:pointer;padding:1px 4px;border-radius:4px}
.msg .codehead .copybtn:hover{background:#20242f;color:var(--ink)}
.msg pre{margin:0;padding:8px 9px;overflow:auto;max-height:340px}
.msg pre code{background:none;border:0;padding:0;font-size:10.5px;line-height:1.5;white-space:pre}
.msg a{color:var(--run);text-decoration:none}.msg a:hover{text-decoration:underline}
.msg img{max-width:100%;border-radius:6px;margin:5px 0}
.msg hr{border:0;border-top:1px solid var(--line);margin:8px 0}
.msg table{border-collapse:collapse;margin:6px 0;font-size:10.5px;display:block;overflow:auto;max-width:100%}
.msg th,.msg td{border:1px solid var(--line);padding:3px 6px;text-align:left}
.msg th{background:#1b202b}.msg del{color:var(--dim)}
/* collapsed tool / thinking / error trace */
.msg .trace{margin-top:6px;border-top:1px dashed var(--line);padding-top:5px}
.msg .trace.above{margin-top:0;margin-bottom:6px;padding-top:0;padding-bottom:5px;
border-top:0;border-bottom:1px dashed var(--line)}
.msg .trace>summary{cursor:pointer;color:var(--dim);font-size:10px;list-style:none;
display:flex;align-items:center;gap:5px;user-select:none}
.msg .trace>summary::-webkit-details-marker{display:none}
.msg .trace>summary:before{content:"▸";font-size:9px}
.msg .trace[open]>summary:before{content:"▾"}
.msg .trace>summary.has-error{color:var(--err)}
.msg .trace>summary .tbits{flex:none}
.msg .trace>summary .tpreview{min-width:0;flex:1;display:flex;align-items:center;gap:5px;color:var(--run);
font-size:9.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg .trace>summary .tpreview:before{content:"●";font-size:7px;animation:tpulse 1.1s ease-in-out infinite}
@keyframes tpulse{50%{opacity:.25}}
.msggap{display:flex;align-items:center;gap:8px;justify-content:center;color:var(--dim);font-size:10px;padding:2px 0}
.msggap:before,.msggap:after{content:"";flex:1;border-top:1px dashed var(--line)}
.msggap .pbtn{padding:2px 7px;font-size:10px}
.liveactivity{margin-top:2px;color:var(--dim);font-size:10px;padding:4px 9px}
.liveactivity .tpreview{display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.liveactivity .tpreview:before{content:"●";color:var(--run);font-size:7px;animation:tpulse 1.1s ease-in-out infinite}
.msg .tracebody{display:flex;flex-direction:column;gap:4px;padding:4px 0 0 10px}
.msg .toolpart{border-left:2px solid var(--line2);padding-left:7px}
.msg .toolpart>summary{cursor:pointer;font-size:10px;color:var(--dim);list-style:none;
display:flex;align-items:baseline;gap:6px}
.msg .toolpart>summary::-webkit-details-marker{display:none}
.msg .toolpart>summary:before{content:"›";font-size:10px}
.msg .toolpart[open]>summary:before{content:"⌄"}
.msg .toolpart .tname{color:var(--ink);font-family:ui-monospace,monospace;font-size:10px}
.msg .toolpart .tstatus{font-size:9px;text-transform:uppercase;letter-spacing:.05em}
.msg .toolpart.error .tstatus{color:var(--err)}
.msg .toolpart.running .tstatus{color:var(--run)}
.msg .tlabel{font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;margin-top:4px}
.msg .trace pre,.msg .trace .rmd{max-height:240px;overflow:auto;white-space:pre-wrap;background:#0d1017;
border:1px solid var(--line);border-radius:4px;padding:4px 6px;margin:2px 0;font-size:10px}
.msg .trace .rmd{font-size:10.5px;color:#c6ccdf;white-space:normal}
.msg-error{margin-top:5px;font-size:10px;color:var(--err);border-left:2px solid var(--err);
padding-left:6px;overflow-wrap:anywhere}
.msg-error.muted{color:var(--wait);border-color:var(--wait)}
/* jump-to-latest */
.detail{position:relative}
.tobottom{position:absolute;right:14px;bottom:12px;width:26px;height:26px;border-radius:50%;
border:1px solid var(--line2);background:rgba(22,25,34,.96);color:var(--ink);display:none;
align-items:center;justify-content:center;cursor:pointer;z-index:6;font-size:13px;padding:0}
.tobottom.on{display:flex}
.tobottom:hover{border-color:#4b5a7e;color:#fff}
.empty{color:var(--dim);font-size:11.5px;text-align:center;padding:18px 8px}
/* v2 forms: the agent is waiting for an answer */
.formzone{padding:0 11px 8px;display:flex;flex-direction:column;gap:6px;max-height:290px;overflow:auto}
.formzone:empty{display:none}
.formcard{border:1px solid #4a3a1a;background:#241d0f;border-radius:9px;padding:7px 9px;display:flex;flex-direction:column;gap:6px}
.formcard .ft{font-size:11px;font-weight:600;color:var(--wait)}
.formcard.plan{border-color:#3f3168;background:#191527}
.formcard.plan .ft{color:var(--plan)}
.formcard .fdesc{font-size:10px;color:var(--dim);white-space:normal}
.ffield{display:flex;flex-direction:column;gap:3px}
.ffield>label{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
.ffield .fhelp{font-size:10px;color:var(--dim);text-transform:none;letter-spacing:0;white-space:normal}
.ffield input[type=text],.ffield input[type=number],.ffield input[type=email],.ffield input[type=url],
.ffield input[type=date],.ffield input[type=datetime-local],.ffield select{
background:var(--card2);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:5px 7px;
font:inherit;font-size:11.5px;min-width:0}
.fopt{display:flex;align-items:flex-start;gap:6px;font-size:11px;color:var(--ink);cursor:pointer}
.fopt input{margin:1px 0 0;accent-color:var(--plan);flex:none}
.fopt a{color:var(--plan);text-decoration:none}.fopt a:hover{text-decoration:underline}
.dbody.plan .msg.assistant{border-left-color:var(--plan)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.07em}
textarea,input[type=text],select{width:100%;background:var(--card2);color:var(--ink);border:1px solid var(--line);
border-radius:8px;padding:7px 9px;font:inherit;font-size:12px;resize:none}
textarea{min-height:64px}
.btnrow{display:flex;gap:6px;flex-wrap:wrap}
.pbtn{background:#222736;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:4px 9px;
font:inherit;font-size:11px;cursor:pointer}
.pbtn:hover{border-color:var(--line2)}
.pbtn.ok{background:#1d4030;border-color:#2c6b4c}.pbtn.no{background:#45212a;border-color:#6b2f3a}
.pbtn.on{background:#24506b;border-color:#2f6d92}
.perm{border:1px solid #4a3a1a;background:#241d0f;border-radius:9px;padding:7px 8px;font-size:11px}
.perm b{color:var(--wait)}
/* composer + palette */
.composer{position:relative;display:flex;flex-wrap:wrap;gap:6px;padding:8px 10px;border-top:1px solid var(--line)}
.composer textarea{flex:1;background:var(--card2);border:1px solid var(--line);border-radius:9px;color:var(--ink);
font:inherit;font-size:12px;padding:7px 10px;min-width:0;min-height:84px;resize:none;line-height:1.45}
.composer button{background:#24506b;border:1px solid #2f6d92;color:var(--ink);border-radius:9px;padding:6px 11px;
font:inherit;cursor:pointer;align-self:flex-end}
.palette{position:absolute;left:8px;right:8px;bottom:calc(100% + 6px);background:#171a23;border:1px solid var(--line);
border-radius:10px;box-shadow:0 -10px 26px rgba(0,0,0,.5);overflow:hidden;display:none;max-height:248px;overflow-y:auto}
.palette.on{display:block}
.queuestrip{flex-basis:100%;display:flex;flex-direction:column;gap:4px;max-height:100px;overflow-y:auto}
.queuestrip:empty{display:none}
.qrow{display:flex;gap:6px;align-items:center;background:#171d2a;border:1px solid var(--line);border-radius:8px;padding:4px 7px;font-size:11px}
.qrow .qmode{flex:none;font-size:9.5px;color:#9fd2ff;text-transform:uppercase;letter-spacing:.4px}
.qrow .qtext{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--dim)}
.qrow .pbtn{padding:2px 6px;font-size:10px;flex:none}
.pitem{display:flex;gap:8px;padding:6px 10px;cursor:pointer;align-items:baseline}
.pitem:hover,.pitem.sel{background:#222736}
.pitem .n{font-family:ui-monospace,monospace;font-size:11.5px;color:#9fd2ff;flex:none}
.pitem .n.pet{color:#8ee0b0}
.pitem .d{font-size:10.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* pet */
body.flip .panel{top:226px;bottom:auto}
body.flip .petzone{top:0;bottom:auto}
body.flip .bubbles{bottom:auto;top:220px}
.mini{position:absolute;right:6px;width:396px;display:none;flex-direction:column;gap:6px;
background:rgba(16,18,25,.98);border:1px solid var(--line);border-radius:12px;padding:9px;
box-shadow:0 16px 36px rgba(0,0,0,.6)}
body.mini-open .mini{display:flex;bottom:226px}
body.mini-open.flip .mini{bottom:auto;top:226px}
body.mini-open .panel{display:none}
body.switching .panel,body.switching .mini{visibility:hidden}
.mini textarea{min-height:56px}
.petzone{position:absolute;right:0;bottom:0;width:260px;height:222px;display:flex;flex-direction:column;
align-items:center;justify-content:flex-end;padding-bottom:2px}
body.expanded .petzone{opacity:.92}
#pet{cursor:grab;width:200px;height:217px;transform-origin:50% 70%;
filter:drop-shadow(0 12px 16px rgba(0,0,0,.6));transition:transform .35s cubic-bezier(.3,1.4,.5,1),filter .3s ease}
body.auras-on #pet.aura-idle{filter:drop-shadow(0 0 10px rgba(110,231,168,.5)) drop-shadow(0 12px 16px rgba(0,0,0,.6))}
body.auras-on #pet.aura-running{filter:drop-shadow(0 0 11px rgba(90,200,255,.6)) drop-shadow(0 12px 16px rgba(0,0,0,.6))}
body.auras-on #pet.aura-waiting{filter:drop-shadow(0 0 11px rgba(255,198,92,.65)) drop-shadow(0 12px 16px rgba(0,0,0,.6))}
body.auras-on #pet.aura-error{filter:drop-shadow(0 0 11px rgba(255,107,107,.65)) drop-shadow(0 12px 16px rgba(0,0,0,.6))}
body.auras-on #pet.aura-plan{filter:drop-shadow(0 0 11px rgba(167,139,250,.65)) drop-shadow(0 12px 16px rgba(0,0,0,.6))}
#pet.flip{transform:scaleX(-1)}
#pet:active{cursor:grabbing}
.bubbles{position:absolute;bottom:222px;right:0;display:flex;flex-direction:column;align-items:flex-end;gap:5px;padding:0 6px;max-width:250px}
body.expanded .bubbles{display:none}
.bub{display:flex;align-items:center;gap:6px;max-width:248px;background:rgba(24,27,36,.95);
border:1px solid var(--line);border-radius:11px;padding:5px 9px;font:inherit;font-size:11.5px;color:var(--ink);
cursor:pointer;box-shadow:0 6px 16px rgba(0,0,0,.45)}
.bub:hover{border-color:var(--line2)}
.bub i{width:7px;height:7px;border-radius:50%;background:var(--dim);flex:none}
.bub.done{opacity:.82;border-style:dashed}
.bub.done i{background:#6ee7a8}
.bub.done span{color:#b9c2d6}
.bub.waiting i{background:var(--wait)}.bub.running i{background:var(--run)}.bub.error i{background:var(--err)}
.bub.plan i{background:var(--plan)}
/* A pending question/approval must win over the plan colour: a plan-mode
   question otherwise looked like ordinary planning work. */
.bub.plan.waiting i{background:var(--wait)}
.bub.plan.error i{background:var(--err)}
.bub.waiting{border-color:#6d5420;background:rgba(36,29,15,.97)}
.bub.waiting i{box-shadow:0 0 6px rgba(255,198,92,.85);animation:bpulse 1.4s ease-in-out infinite}
.bub.plan.waiting span{color:#d9cffb}
.bub .need{flex:none;font-size:8.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  color:#201a08;background:var(--wait);border-radius:5px;padding:1px 4px;line-height:1.45}
@keyframes bpulse{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.bub.waiting i{animation:none}}
.bub.done.plan{border-color:#3f3168;opacity:.95}
.bub.done.plan span{color:#d9cffb}
.bub span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* tooltip + context menu */
.tip{position:fixed;max-width:300px;background:#12151c;border:1px solid var(--line2);border-radius:9px;
padding:7px 9px;font-size:11px;color:#c8cde0;box-shadow:0 12px 26px rgba(0,0,0,.6);display:none;z-index:50;
/* never become the hover target: an overlapping tip used to steal the bubble,
   which hid the tip, which brought the bubble back — a flicker plus dead clicks */
pointer-events:none}
.tip.on{display:block}
.ctx{position:fixed;min-width:186px;background:#161922;border:1px solid var(--line2);border-radius:10px;
padding:5px;box-shadow:0 16px 34px rgba(0,0,0,.65);display:none;z-index:60}
.ctx.on{display:block}
.ctx button{display:block;width:100%;text-align:left;background:transparent;border:0;color:var(--ink);
font:inherit;font-size:12px;padding:6px 9px;border-radius:7px;cursor:pointer}
.ctx button:hover{background:#222736}
.ctx .sep{height:1px;background:var(--line);margin:4px 6px}
.ctx .k{float:right;color:var(--dim);font-size:10.5px}
/* ---- three surfaces: pet, bubbles, panel ---- */
body.mode-pet .panel, body.mode-pet .mini, body.mode-pet .bubbles{display:none!important}
body.mode-panel .petzone, body.mode-panel .bubbles, body.mode-panel .tip{display:none!important}
body.mode-bubbles .petzone, body.mode-bubbles .panel, body.mode-bubbles .mini,
body.mode-bubbles .tip{display:none!important}
/* the bubble window is exactly the stack: no room for the tooltip, which the
   pet window draws through the shell instead */
body.mode-bubbles .bubbles{position:absolute;right:0;top:0;bottom:auto;left:auto;max-width:250px}
/* the tooltip lives in the fixed-size pet window, over the sprite */
body.mode-pet .tip{left:6px;right:6px;top:6px;max-width:none}
/* the panel window is exactly the panel: fill it, no 560x800 shell around it */
body.mode-panel .panel{position:absolute;left:0;right:0;top:0;bottom:0;height:auto;display:flex;border-radius:12px}
body.mode-panel.mini-open .panel{display:none}
/* the mini window is sized to exactly this form, so it starts at the top */
body.mode-panel .mini{left:0;right:0;top:0;bottom:auto;width:auto}
</style></head>
<body class="minimized">
<div class="wrap">
  <section class="panel">
    <div id="panelResize" title="Drag to resize"></div>
    <header>
      <button id="btnList" title="Hide sessions (Ctrl+B)" aria-pressed="true">&#9776;</button>
      <div class="dot" id="dot"></div>
      <div style="min-width:0"><div class="h1" id="petname">pet</div><div class="h2" id="psub">starting…</div></div>
      <div class="sp"></div>
      <button id="btnNew" title="New chat (Ctrl+N)">+</button>
      <button id="btnSettings" title="Settings">&#9881;</button>
      <button id="collapse" title="Collapse">&#10005;</button>
    </header>
    <div class="body">
      <aside class="col list">
        <div class="colhead">sessions <select id="filter" style="width:auto;padding:2px 4px;font-size:10.5px"></select></div>
        <div id="permzone"></div>
        <div id="sessions"></div>
      </aside>
      <section class="col detail">
        <div class="dhead"><span class="chip idle" id="dstate">idle</span><div class="t" id="dtitle">Nothing selected</div>
          <span class="ssub" id="dmeta" style="flex:none"></span>
          <button class="pbtn" id="dabort" style="display:none">stop</button></div>
        <div class="dbody" id="dbody"></div>
        <div class="formzone" id="formzone"></div>
        <button class="tobottom" id="toBottom" title="Jump to latest" type="button">&#8595;</button>
      </section>
    </div>
    <form class="composer" id="composer">
      <div class="palette" id="palette"></div>
      <div class="queuestrip" id="queued"></div>
      <textarea id="prompt" rows="5" placeholder="Message the selected session — / for commands · Ctrl+Enter to send" autocomplete="off"></textarea>

<script>

  bubblesSize(){},tooltip(){},onTooltip(){},petMenu(){},bubbleMenu(){},pickFolder:async()=>({ok:false})};

function measure(){
  const c=document.createElement("canvas"); c.width=FW; c.height=FH; const g=c.getContext("2d");

function updateComposerHint(){

/* ---------------- helpers ---------------- */

let lastLayout=0;   // a click that lands right after the panel toggles is noise

// A new chat inherits the chat it is started from: its directory, model (with

function startDraft(){

    directory: from?.directory || base.directory || workspaces[0]?.directory || null,

function modelLabel(model){

// Labels are ellipsized to keep the header compact. Give them a native

}
function currentModel(){ return currentSession()?.model || draft?.model || defaults?.model || null; }

// Keep unsent text per chat. syncComposer saves the old key before restoring the

function syncComposer(){

/* ---------------- rendering ---------------- */
// The brain orders sessions itself: needs-you first, then creation time. That
// order ignores last-update churn on purpose, because with several sessions
// streaming the "most recent" session changes every few frames and would move
// the button out from under the cursor.
let bubbleSig=null;
// What a waiting session is waiting FOR. The badge is the visible cue on the
// pet; the tooltip names the form/permission itself.
function needLabel(s){
  if(s.state!=="waiting") return "";
  if((s.forms||[]).length) return "answer";
  if((s.pending||[]).length) return "approve";
  return "needs you";
}
function renderBubbles(){
  const act=state.sessions.filter(s=>s.state!=="idle").slice(0,3);
  // Sessions that finished while the pet was running keep a bubble until they are
  // hidden (or fall out of the list of the last few).
  const shown=new Set(act.map(s=>s.id));

    .filter(s=>s&&!shown.has(s.id)).slice(-2);

  // depends on it. Rebuilding identical markup would still replace the hovered
  // button; the browser then retargets the click to the container and the click
  // is lost.
  const sig=JSON.stringify([act.map(s=>[s.id,s.state,s.agent||"",s.title,(s.forms||[]).length,(s.pending||[]).length]),
    done.map(s=>[s.id,s.agent||"",s.title])]);

  bubbleSig=sig;

      <i></i>${need?`<b class="need">${need}</b>`:""}<span>${esc(s.title)}</span></button>`; }),
    ...done.map(s=>`<button class="bub done${s.agent==="plan"?" plan":""}" data-session="${esc(s.id)}" title="finished - right-click to hide">
      <i></i><span>${s.agent==="plan"?"plan ready · ":"&#10003; "}${esc(s.title)}</span></button>`)].join("");
  syncBubbleSize();
}
// The bubble window is sized to its content; the shell does the actual resize.
let bubbleKey="";
function syncBubbleSize(){
  if(!IS_BUBBLES) return;
  const el=$("#bubbles"), r=el.getBoundingClientRect();
  const w=Math.ceil(r.width), h=Math.ceil(r.height);

  bubbleKey=key;
  api.bubblesSize({width:w,height:h});

// Snapshot-driven rendering reuses rows instead of rebuilding the list: the
// brain pushes state ~8x/s while sessions stream, and replacing the row under
// the cursor loses the click (the browser retargets it to the container).
const listRows=new Map(); // session id -> {el, html, sel}
let listOrder="";
function renderList(){
  const dirs=[...new Set(state.sessions.map(s=>s.dirName).filter(Boolean))].sort();
  const sel=$("#filter");
  if(sel.dataset.k!==dirs.join("|")){
    const cur=sel.value||"all";
    sel.innerHTML=`<option value="all">all</option>`+dirs.map(d=>`<option value="${esc(d)}">${esc(d)}</option>`).join("");
    sel.value=dirs.includes(cur)?cur:"all";
    sel.dataset.k=dirs.join("|");
  }
  const list=state.sessions.filter(s=>sel.value==="all"||s.dirName===sel.value);
  const box=$("#sessions");
  const wanted=new Set(list.map(s=>s.id));
  for(const [id,row] of listRows) if(!wanted.has(id)){ row.el.remove(); listRows.delete(id); }
  if(!list.length){
    listOrder="";
    if(!box.querySelector(".empty")) box.innerHTML=`<div class="empty">no sessions</div>`;
    return;
  }
  box.querySelector(".empty")?.remove();
  for(const s of list){
    let row=listRows.get(s.id);
    if(!row){
      row={el:document.createElement("div"),html:"",sel:null};
      row.el.className="srow";
      row.el.dataset.session=s.id;
      listRows.set(s.id,row);
    }
    if(row.sel!==(s.id===selected)){
      row.sel=s.id===selected;
      row.el.classList.toggle("sel",row.sel);
    }
    // Per-row rebuild: the row element itself survives, so a click that is in
    // flight while streaming text updates still lands on a `[data-session]`.
    const html=`<span class="chip ${s.state}${s.agent==="plan"?" plan":""}">${s.agent==="plan"&&s.state==="running"?"plan":s.agent==="plan"&&s.state==="waiting"?"answer":s.state}</span>
      <div style="min-width:0;flex:1">
        <div class="stitle" data-full="${esc(s.title)}">${esc(s.title)}</div>
        <div class="ssub" data-full="${esc([s.dirName,s.lastText].filter(Boolean).join(" · "))}">${esc(s.dirName||"")}${s.lastText?" · "+esc(s.lastText.slice(0,42)):""}</div>
      </div>`;
    if(html!==row.html){
      row.html=html;
      row.el.innerHTML=html;
      for(const el of row.el.querySelectorAll("[data-full]")) fitLabel(el,el.dataset.full);
    }

  // costs the hover state and the in-flight click.

// Approvals are the last place a swallowed click should happen: rebuilding the
// buttons on every streaming snapshot would do exactly that.
let permSig=null;
function renderPerms(){
  const perms=state.permissions||[];
  const sig=JSON.stringify([perms.length,perms.slice(0,3).map(p=>[p.id,p.permission,p.patterns||[]])]);
  if(sig===permSig) return;
  permSig=sig;
  $("#permzone").innerHTML=perms.slice(0,3).map(p=>`<div class="perm">
      <b>Approval</b> · ${esc(p.permission)}
      ${(p.patterns||[]).length?`<div style="color:var(--dim);font-size:10px">${esc((p.patterns||[]).join(", "))}</div>`:""}
      <div class="btnrow" style="margin-top:5px">
        <button class="pbtn ok" data-perm="${esc(p.id)}" data-reply="once">once</button>
        <button class="pbtn" data-perm="${esc(p.id)}" data-reply="always">always</button>
        <button class="pbtn no" data-perm="${esc(p.id)}" data-reply="reject">reject</button>
      </div></div>`).join("")+(perms.length>3?`<div class="ssub" style="padding:4px 2px">+${perms.length-3} more</div>`:"");
}
// Undelivered messages live in OpenCode's durable inbox, not in the message

function renderQueued(){
  const el=$("#queued"); if(!el) return;
  const s=currentSession();
  const rows=view==="chat"&&s&&Array.isArray(s.queued)?s.queued:[];
  const key=JSON.stringify(rows.map(x=>[x.id,x.delivery,x.text]));
  if(key===queuedKey) return;
  queuedKey=key;
  el.innerHTML=rows.map(x=>`<div class="qrow" title="${esc(x.text)}">
      <span class="qmode">${x.delivery==="steer"?"steering":"queued"}</span>
      <span class="qtext">${esc(x.text)||"(empty)"}</span>
      ${x.delivery==="queue"?`<button class="pbtn" type="button" data-queue-steer="${esc(x.id)}" title="Steer into the running turn">send now</button>`:""}
      <button class="pbtn" type="button" data-queue-cancel="${esc(x.id)}" title="Cancel queued message">&times;</button>
    </div>`).join("");

// New/pets/settings (and the draft hint) are static for a state snapshot: rebuild

// swallowed by a rebuild that lands between mousedown and mouseup.
function setBody(html){
  const b=$("#dbody");

  b.innerHTML=html;
  updateToBottom();
}
function renderDetail(){
  const s=currentSession();
  const d = view==="chat" && !s ? draft : null;
  const isPlan=Boolean((s&&s.agent==="plan")||(d&&d.agent==="plan"));
  $("#dstate").className="chip "+(s?s.state:"idle")+(isPlan?" plan":"");
  $("#dstate").textContent=s?(isPlan&&s.state==="running"?"plan":isPlan&&s.state==="waiting"?"plan · answer":s.state)
    :d?(isPlan?"plan":"new"):"idle";
  const title = view==="new" ? "New chat"
    : view==="pets" ? "Pets" : view==="settings" ? "Settings"
    : d ? (isPlan?"New plan chat":"New chat") : s?s.title:"Nothing selected";

  fitLabel($("#dmeta"), s ? [modelLabel(s.model), s.agent].filter(Boolean).join(" · ")
    : d ? [dirName || "no folder", modelLabel(d.model), d.agent].filter(Boolean).join(" · ") : "");
  const body=$("#dbody");
  body.classList.toggle("plan",isPlan);
  if(view!=="chat"){ msgSession=""; msgKey=""; }
  if(view==="new"){ setBody(newChatHtml()); return; }
  if(view==="pets"){ setBody(petsHtml()); return; }
  if(view==="settings"){ setBody(settingsHtml()); return; }
  if(d){
    setBody(`<div class="empty" style="padding:26px 10px">${isPlan?"Plan mode":"New chat"}${
      d.directory?`<div class="ssub" style="margin-top:4px;overflow-wrap:anywhere">${esc(d.directory)}</div>`:""}
      ${isPlan?`<div class="ssub" style="margin-top:10px;color:var(--plan)">Read-only planning · /build to implement</div>`:""}
      <div class="ssub" style="margin-top:10px">/cd directory · /model model · /effort reasoning effort</div></div>`);
    return;
  }
  if(!s){ msgSession=""; setBody(`<div class="empty">pick a session, or press + for a new chat</div>`); return; }
  // Only show the placeholder when the session actually changed. Re-rendering the
  // same chat must not replace it with "loading…" and then early-return.
  const sk=sessionKey(s);
  if(msgSession!==sk){ msgSession=sk; msgKey=""; body.innerHTML=`<div class="empty">loading…</div>`; }
  scheduleMessages(s);
}
let msgKey="", msgSession="", msgSeq=0, msgTimer=null;
const sessionKey=(s)=>`${s.server}|${s.id}`;
function scheduleMessages(s){
  if(!s) return;
  clearTimeout(msgTimer);
  msgTimer=setTimeout(()=>loadMessages(s),70);
}
function updateToBottom(){
  const b=$("#dbody"), to=$("#toBottom");
  if(!b||!to) return;
  to.classList.toggle("on", b.scrollHeight-b.scrollTop-b.clientHeight>80);
}
function messageError(err, recovered = false, retrying = false){
  if(!err) return "";
  const type=err.type||"error";
  const msg=err.message||err.data?.message||(typeof err==="string"?err:JSON.stringify(err));
  const aborted=/aborted|interrupt/i.test(type+" "+msg);
  const muted=recovered||retrying||aborted;
  const label=recovered?"retried":retrying?"retrying":type;
  const short=msg.length>220?msg.slice(0,220)+"…":msg;
  return `<div class="msg-error${muted?" muted":""}" title="${esc(msg)}">${esc(label)} · ${esc(short)}</div>`;
}
function renderPart(p,mid,i){
  if(p.type==="tool"){
    const status=String(p.status||"");
    const input=p.input==null?"":(typeof p.input==="string"?p.input:JSON.stringify(p.input,null,2));
    const output=String(p.output??"");
    return `<details class="toolpart ${esc(status)}" data-k="${esc(mid)}:tool:${i}">`+
      `<summary><span class="tname">${esc(p.name||"tool")}</span> <span class="tstatus">${esc(status)}</span></summary>`+
      (input?`<div class="tlabel">input</div><pre>${esc(input.slice(0,8000))}</pre>`:"")+
      (output?`<div class="tlabel">output</div><pre>${esc(output.slice(0,8000))}</pre>`:"")+
      `</details>`;
  }
  if(p.type==="reasoning"||p.type==="system"){
    const label=p.type==="reasoning"?"thinking":"system";
    return `<div class="rpart"><div class="tlabel">${label}</div><div class="rmd">${CPMarkdown.toHtml(p.text||"")}</div></div>`;
  }
  if(p.type==="file") return `<div class="tlabel">file · ${esc(p.name||p.path||"file")}</div>`;
  return "";
}
function messageTrace(m,mid,above){
  const extras=(m.parts||[]).filter(p=>p.type!=="text");
  if(!extras.length) return "";
  const tools=extras.filter(p=>p.type==="tool");
  const nThink=extras.filter(p=>p.type==="reasoning").length;
  const nFile=extras.filter(p=>p.type==="file").length;
  const nSys=extras.filter(p=>p.type==="system").length;
  const bits=[];
  if(tools.length) bits.push(`${tools.length} tool${tools.length>1?"s":""}`);
  if(nThink) bits.push(`${nThink} thinking`);
  if(nFile) bits.push(`${nFile} file${nFile>1?"s":""}`);
  if(nSys) bits.push(`${nSys} system`);
  // A tool failure is usually handled by the next step; only fatal message
  // errors colour the trace, and those are rendered by renderProcess.
  return `<details class="trace${above?" above":""}" data-k="${esc(mid)}:trace">`+
    `<summary>${esc(bits.join(" · "))||"trace"}</summary>`+
    `<div class="tracebody">${extras.map((p,i)=>renderPart(p,mid,i)).join("")}</div></details>`;
}
const msgCopy=new Map(); // message id -> raw text, populated by renderRows
function renderMessage(m){
  const mid=m.id||`m${Math.random().toString(36).slice(2)}`;
  const parts=m.parts||[];
  const text=parts.filter(p=>p.type==="text"&&p.text).map(p=>p.text).join("\n\n");
  const role=m.role==="user"?"user":"assistant";
  // Keep the real order: a message is [reasoning, text] (thinking before the
  // answer), not text followed by its thinking. Only move the trace below when
  // it actually came after the text.
  const firstText=parts.findIndex(p=>p.type==="text"&&p.text);
  const firstExtra=parts.findIndex(p=>p.type!=="text");
  const above=firstExtra>=0 && (firstText<0 || firstExtra<firstText);
  const trace=messageTrace(m,mid,above);
  if(text) msgCopy.set(mid,text);
  const copy=text?`<button class="msgcopy" type="button" data-copy="${esc(mid)}" title="Copy message" aria-label="Copy message">copy</button>`:"";
  return `<div class="msg ${role}${text?" copyable":""}">${copy}${above?trace:""}${text?CPMarkdown.toHtml(text):""}${messageError(m.error,Boolean(m.errorRecovered),Boolean(m.errorRetrying))}${above?"":trace}</div>`;
}
// An error is recovered when a later assistant message without an error exists.
// A retryable provider error is also muted while the session is still running,
// even before the retry has produced a message.
function markRecoveredErrors(rows, live = false){
  for(let i=0;i<rows.length;i++){
    const m=rows[i];
    if(!m.error||m.gap) continue;
    let recovered=false;
    for(let j=i+1;j<rows.length;j++){
      const n=rows[j];
      if(n.role==="assistant"&&!n.error){ recovered=true; break; }
    }
    m.errorRecovered=recovered;
    m.errorRetrying=Boolean(live&&!recovered&&isRetryableError(m.error));
  }
}
function isRetryableError(err){
  const type=String(err?.type||"");
  const msg=String(err?.message||err?.data?.message||"");
  const status=Number(err?.status||0);
  if(status===408||status===425||status===429||status>=500) return true;
  return /rate.?limit|retry|overload|unavailable|timeout|transport|econnreset|econnrefused|network|temporar/i.test(type+" "+msg);
}
function compactPreview(text, n = 120){
  const one=String(text??"").replace(/\s+/g," ").trim();
  return one.length>n?one.slice(0,n)+"…":one;
}
function lastLine(text, n = 120){
  const lines=String(text??"").split(/\n/).map(x=>x.trim()).filter(Boolean);
  return compactPreview(lines[lines.length-1]||"",n);
}
function toolInputHint(input){
  if(input==null) return "";
  if(typeof input==="string") return compactPreview(input,90);
  if(typeof input==="object"){
    for(const k of ["command","filePath","path","pattern","query","description","url","prompt"]){
      if(typeof input[k]==="string"&&input[k]) return compactPreview(input[k],90);
    }
  }
  try{ return compactPreview(JSON.stringify(input),90); }catch{ return ""; }
}
function activityPreview(activity, fallbackPart){
  if(activity){
    if(activity.kind==="tool"){
      return [activity.tool||"tool",activity.status||"",activity.detail?compactPreview(activity.detail,90):""].filter(Boolean).join(" · ");
    }
    if(activity.kind==="thinking"){
      const line=lastLine(activity.text,110);
      return line?`thinking · ${line}`:"thinking…";
    }
  }
  if(fallbackPart){
    if(fallbackPart.type==="tool"){
      return [fallbackPart.name||"tool",fallbackPart.status||"",fallbackPart.input?toolInputHint(fallbackPart.input):""].filter(Boolean).join(" · ");
    }
    if(fallbackPart.type==="reasoning"){
      const line=lastLine(fallbackPart.text,110);
      return line?`thinking · ${line}`:"thinking…";
    }
  }
  return "";
}
function renderGap(){
  return `<div class="msggap"><span>Earlier messages omitted</span><button class="pbtn" data-load-earlier="1" ${msgLoadingOlder?"disabled":""}>${msgLoadingOlder?"Loading…":"Load earlier"}</button></div>`;
}
function renderLiveActivity(activity){
  const preview=activityPreview(activity,null);
  return preview?`<div class="msg assistant liveactivity"><span class="tpreview">${esc(preview)}</span></div>`:"";
}
// Consecutive assistant steps with no answer text are one process run. Collapsing
// them into a single trace keeps a turn readable: one "N steps · M tools" line
// instead of one line per step.
function renderRows(rows, opts = {}){
  msgCopy.clear();
  const groups=[];
  let pending=null;
  for(const m of rows){
    if(m.gap){ pending=null; groups.push({kind:"gap"}); continue; }
    const hasText=(m.parts||[]).some(p=>p.type==="text"&&p.text);
    if(hasText){ pending=null; groups.push({kind:"msg",m}); }
    else {
      if(!pending){ pending={kind:"proc",msgs:[]}; groups.push(pending); }
      pending.msgs.push(m);
    }
  }
  const lastKind=groups[groups.length-1]?.kind;
  return groups.map((g,i)=>{
    if(g.kind==="gap") return renderGap();
    if(g.kind==="msg") return renderMessage(g.m);
    return renderProcess(g.msgs,{live:Boolean(opts.live&&i===groups.length-1),activity:opts.activity});
  }).join("") + (opts.live && lastKind!=="proc" ? renderLiveActivity(opts.activity) : "");
}
function renderProcess(msgs, { live = false, activity = null } = {}){
  const key=`process:${msgs[0]?.id||"p"}`;
  const parts=msgs.flatMap(m=>m.parts||[]);
  const tools=parts.filter(p=>p.type==="tool");
  const nThink=parts.filter(p=>p.type==="reasoning").length;
  const nFile=parts.filter(p=>p.type==="file").length;
  const nSys=parts.filter(p=>p.type==="system").length;
  const errs=[], seen=new Map();
  for(const m of msgs){
    const e=m.error; if(!e) continue;
    const k=`${e.type}|${e.message}`;
    const prev=seen.get(k);
    if(prev){
      prev.recovered = prev.recovered && Boolean(m.errorRecovered);
      prev.retrying = prev.retrying && Boolean(m.errorRetrying);
    } else {
      seen.set(k,{err:e, recovered:Boolean(m.errorRecovered), retrying:Boolean(m.errorRetrying)});
    }
  }
  errs.push(...seen.values());
  const bits=[`${msgs.length} step${msgs.length>1?"s":""}`];
  if(tools.length) bits.push(`${tools.length} tool${tools.length>1?"s":""}`);
  if(nThink) bits.push(`${nThink} thinking`);
  if(nFile) bits.push(`${nFile} file${nFile>1?"s":""}`);
  if(nSys) bits.push(`${nSys} system`);
  const hasErr=errs.some(e=>!e.recovered&&!e.retrying);
  const preview=live?activityPreview(activity,parts[parts.length-1]):"";
  const summary=`<summary class="${hasErr?"has-error":""}"><span class="tbits">${esc(bits.join(" · "))}</span>`+
    `${preview?`<span class="tpreview">${esc(preview)}</span>`:""}</summary>`;
  const trace=parts.length
    ? `<details class="trace" data-k="${esc(key)}:trace">${summary}<div class="tracebody">`+
      `${parts.map((p,i)=>renderPart(p,key,i)).join("")}</div></details>`
    : "";
  return `<div class="msg assistant process">${errs.map(e=>messageError(e.err,e.recovered,e.retrying)).join("")}${trace}</div>`;
}
let msgStore=null, msgLoadingOlder=false;
const emptyMsgStore=(key)=>({key,first:null,firstLoaded:false,older:[],tail:[],cursor:null});
async function fetchMessagePage(s, opts = {}){
  const qs=new URLSearchParams({server:s.server,sessionId:s.id,limit:String(opts.limit??40)});
  if(opts.order) qs.set("order",opts.order);
  if(opts.type) qs.set("type",opts.type);
  if(opts.cursor) qs.set("cursor",opts.cursor);
  if(opts.compact) qs.set("compact","1");
  const r=await fetch("/api/message-page?"+qs.toString());
  if(r.status===404){
    const rr=await fetch(`/api/messages?server=${encodeURIComponent(s.server)}&sessionId=${encodeURIComponent(s.id)}&limit=${opts.limit??40}`);
    const data=await rr.json().catch(()=>null);
    if(!rr.ok) throw new Error(data?.error||`messages ${rr.status}`);
    if(!Array.isArray(data)) throw new Error("unexpected messages response");
    return {messages:data,cursor:null,hasMore:false};
  }
  const data=await r.json().catch(()=>null);
  if(!r.ok) throw new Error(data?.error||`messages ${r.status}`);
  if(!data||!Array.isArray(data.messages)) throw new Error("unexpected messages response");
  return data;
}
function renderMessageStore(s, { preserve = false, force = false } = {}){
  if(!s||!msgStore||msgStore.key!==sessionKey(s)) return;
  const byTime=(a,b)=>(a.time??0)-(b.time??0);
  const seen=new Set(), rest=[];
  for(const m of [...msgStore.older,...msgStore.tail]){
    if(!m||!m.id||seen.has(m.id)) continue;
    seen.add(m.id); rest.push(m);
  }
  rest.sort(byTime);
  const rows=[];
  if(msgStore.first) rows.push(msgStore.first);
  rows.push(...rest.filter(m=>!msgStore.first||m.id!==msgStore.first.id));
  if(msgStore.cursor) rows.splice(msgStore.first?1:0,0,{id:"__gap__",gap:true});
  markRecoveredErrors(rows,s.state==="running");
  const key=JSON.stringify({rows:rows.map(m=>[m.id,m.error,m.errorRecovered,m.errorRetrying,m.gap,m.parts]),
    live:s.state==="running",activity:s.activity||null,loading:msgLoadingOlder});
  if(!force&&key===msgKey){ updateToBottom(); return; }
  msgKey=key;
  const body=$("#dbody");
  const atBottom=body.scrollHeight-body.scrollTop-body.clientHeight<40;
  const prevH=body.scrollHeight, prevTop=body.scrollTop;
  const open=new Set([...body.querySelectorAll("details[open][data-k]")].map(d=>d.dataset.k));
  body.innerHTML=renderRows(rows,{live:s.state==="running",activity:s.activity})||`<div class="empty">no messages yet</div>`;
  for(const k of open){
    const d=[...body.querySelectorAll("details[data-k]")].find(x=>x.dataset.k===k);
    if(d) d.open=true;
  }
  if(preserve) body.scrollTop=body.scrollHeight-prevH+prevTop;
  else if(atBottom) body.scrollTop=body.scrollHeight;
  updateToBottom();
}
async function loadMessages(s){
  if(!s) return;
  const sk=sessionKey(s);
  const seq=++msgSeq;
  try{
    const page=await fetchMessagePage(s,{limit:40,order:"desc"});
    if(seq!==msgSeq||msgSession!==sk) return; // a newer session/load won
    if(!msgStore||msgStore.key!==sk) msgStore=emptyMsgStore(sk);
    msgStore.tail=page.messages;
    if(!msgStore.older.length) msgStore.cursor=page.hasMore?(page.cursor?.next??null):null;
    if(msgStore.cursor&&!msgStore.firstLoaded){
      msgStore.firstLoaded=true;
      try{
        const first=await fetchMessagePage(s,{limit:1,order:"asc",type:"user"});
        if(msgStore?.key===sk){
          msgStore.first=first.messages[0]||null;
          if(currentSession()?.id===s.id) renderMessageStore(s,{});
        }
      }catch{
        if(msgStore?.key===sk) msgStore.firstLoaded=false;
      }
    }
    renderMessageStore(s,{});
  }catch(e){
    if(seq===msgSeq&&msgSession===sk){
      msgKey="";
      $("#dbody").innerHTML=`<div class="empty">${esc(e.message||e)}</div>`;
      updateToBottom();
    }
  }
}
async function loadEarlier(){
  const s=currentSession();
  if(!s||!msgStore||msgStore.key!==sessionKey(s)||!msgStore.cursor||msgLoadingOlder) return;
  const store=msgStore, key=store.key;
  msgLoadingOlder=true; msgKey=""; renderMessageStore(s,{preserve:true,force:true});
  try{
    const page=await fetchMessagePage(s,{limit:40,cursor:store.cursor,compact:true});
    if(msgStore!==store||msgStore.key!==key||currentSession()?.id!==s.id) return;
    const ids=new Set([...msgStore.older,...msgStore.tail].map(m=>m.id));
    const older=[...msgStore.older];
    for(const m of page.messages){
      if(!m.id||ids.has(m.id)) continue;
      ids.add(m.id); older.push(m);
    }
    msgStore.older=older;
    msgStore.cursor=page.hasMore?(page.cursor?.next??null):null;
  }catch(e){
    if(msgStore===store) $("#dbody").insertAdjacentHTML("afterbegin",`<div class="empty">${esc(e.message||e)}</div>`);
  }finally{
    msgLoadingOlder=false;
    if(msgStore===store&&msgStore.key===key&&currentSession()?.id===s.id){
      msgKey="";
      renderMessageStore(s,{preserve:true,force:true});
    }
  }
}

/* ---------------- v2 forms (questions the agent waits on) ---------------- */
let formDrafts={}, formSig="";
const cssEsc=s=>window.CSS?.escape?CSS.escape(String(s)):String(s).replace(/["\\]/g,"\\$&");
function formValues(fid){ return formDrafts[fid]||(formDrafts[fid]={}); }
function seedDefaults(form,vals){
  for(const x of form.fields||[]){
    if(x.hidden||x.type==="external"||x.key in vals) continue;
    if(x.default!==undefined) vals[x.key]=x.default;
    else if(x.type==="boolean"&&x.required) vals[x.key]=false;
    else if(x.type==="multiselect") vals[x.key]=[];
  }
}
function condMet(field,vals){
  const when=field.when;
  if(!when?.length) return true;
  return when.every(w=>{
    const v=vals[w.key];
    const same=(Array.isArray(v)||Array.isArray(w.value))
      ? JSON.stringify(v??null)===JSON.stringify(w.value??null)
      : v===w.value;
    return w.op==="neq"?!same:same;
  });
}
function findField(formId,key){
  const s=currentSession();
  const form=(s?.forms||[]).find(f=>f.id===formId);
  return (form?.fields||[]).find(x=>x.key===key)||null;
}
function inputType(field){
  return field.format==="email"?"email":field.format==="uri"?"url"
    :field.format==="date"?"date":field.format==="date-time"?"datetime-local":"text";
}
function formFieldHtml(formId,field,vals){
  const key=field.key, fid=esc(formId), fk=esc(key), title=field.title||key;
  const common=`data-form="${fid}" data-fk="${fk}"`;
  const desc=field.description?`<div class="fhelp">${esc(field.description)}</div>`:"";
  const label=esc(title)+(field.required?` <span style="color:var(--plan)">*</span>`:"");
  const v=vals[key];
  if(field.type==="external"){
    const url=/^https?:\/\//i.test(String(field.url||""))?field.url:"#";
    return `<div class="ffield"><label class="fopt"><input type="checkbox" ${common} ${v===true?"checked":""}>
        <span>Open <a href="${esc(url)}" target="_blank" rel="noreferrer">${label}</a></span></label>${desc}</div>`;
  }
  if(field.type==="boolean"){
    return `<div class="ffield"><label class="fopt"><input type="checkbox" ${common} ${v===true?"checked":""}>
        <span>${label}</span></label>${desc}</div>`;
  }
  if(field.type==="multiselect"){
    const picked=Array.isArray(v)?v:[];
    return `<div class="ffield"><label>${label}</label>${desc}
      ${(field.options||[]).map(o=>`<label class="fopt"><input type="checkbox" ${common} value="${esc(o.value)}" ${picked.includes(o.value)?"checked":""}>
        <span>${esc(o.label||o.value)}${o.description?` <span class="fhelp">${esc(o.description)}</span>`:""}</span></label>`).join("")}</div>`;
  }
  if(field.type==="string"&&(field.options||[]).length&&!field.custom){
    return `<div class="ffield"><label>${label}</label>${desc}
      <select ${common}>
        ${field.required?"":`<option value="">(none)</option>`}
        ${(field.options||[]).map(o=>`<option value="${esc(o.value)}" ${v===o.value?"selected":""}>${esc(o.label||o.value)}</option>`).join("")}
      </select></div>`;
  }
  if(field.type==="number"||field.type==="integer"){
    const min=field.minimum!==undefined?` min="${esc(field.minimum)}"`:"";
    const max=field.maximum!==undefined?` max="${esc(field.maximum)}"`:"";
    const step=field.type==="integer"?' step="1"':' step="any"';
    return `<div class="ffield"><label>${label}</label>${desc}
      <input type="number" ${common} value="${v===undefined?"":esc(v)}"${min}${max}${step}></div>`;
  }
  const opts=(field.options||[]).length;
  const list=opts?` list="dl-${fid}-${fk}"`:"";
  const datalist=opts?`<datalist id="dl-${fid}-${fk}">${field.options.map(o=>`<option value="${esc(o.value)}">${esc(o.label||o.value)}</option>`).join("")}</datalist>`:"";
  const extra=(field.minLength!==undefined?` minlength="${esc(field.minLength)}"`:"")
    +(field.maxLength!==undefined?` maxlength="${esc(field.maxLength)}"`:"")
    +(field.pattern?` pattern="${esc(field.pattern)}"`:"");
  return `<div class="ffield"><label>${label}</label>${desc}
    <input type="${inputType(field)}" ${common}${list} value="${v===undefined?"":esc(v)}"
      placeholder="${esc(field.placeholder||"")}"${extra} autocomplete="off">${datalist}</div>`;
}
function formHtml(form){
  const vals=formValues(form.id);
  seedDefaults(form,vals);
  const fields=(form.fields||[]).filter(x=>!x.hidden&&condMet(x,vals));
  const plan=currentSession()?.agent==="plan";
  return `<div class="formcard${plan?" plan":""}" data-formcard="${esc(form.id)}">
    <div class="ft">${esc(form.title||"The agent has a question")}</div>
    ${fields.map(x=>formFieldHtml(form.id,x,vals)).join("")}
    <div class="btnrow"><button class="pbtn ok" data-form-send="${esc(form.id)}">Answer</button></div>
  </div>`;
}
function renderForms(force=false){
  const s=currentSession();
  const forms=(s?.forms)||[];
  const sig=s?s.id+"|"+JSON.stringify(forms.map(f=>[f.id,f.title,f.fields])):"";
  if(!force&&sig===formSig) return;
  formSig=sig;
  const z=$("#formzone"); if(!z) return;
  for(const id of Object.keys(formDrafts)) if(!forms.some(f=>f.id===id)) delete formDrafts[id];
  const active=document.activeElement;
  const aform=active?.dataset?.form, akey=active?.dataset?.fk;
  const caret=active?.selectionStart;
  z.innerHTML=forms.map(formHtml).join("");
  if(aform&&akey&&z.contains(document.activeElement)===false){
    const el=z.querySelector(`[data-form="${cssEsc(aform)}"][data-fk="${cssEsc(akey)}"]`);
    if(el){ el.focus(); try{ if(caret!=null&&el.setSelectionRange) el.setSelectionRange(caret,caret); }catch{} }
  }
}
function storeFormField(el){
  const fid=el.dataset.form, key=el.dataset.fk;
  const field=findField(fid,key); if(!field) return;
  const vals=formValues(fid);
  if(field.type==="boolean"||field.type==="external") vals[key]=el.checked;
  else if(field.type==="multiselect"){
    vals[key]=[...document.querySelectorAll(`input[data-form="${cssEsc(fid)}"][data-fk="${cssEsc(key)}"]:checked`)].map(x=>x.value);
  } else if(field.type==="number"||field.type==="integer"){
    vals[key]=el.value.trim()===""?undefined:Number(el.value);
  } else vals[key]=el.value;
}
async function sendForm(formId){
  const s=currentSession(); if(!s) return;
  const form=(s.forms||[]).find(f=>f.id===formId); if(!form) return;
  const vals=formDrafts[formId]||{};
  const answer={};
  for(const x of form.fields||[]){
    if(x.hidden){ if(x.default!==undefined) answer[x.key]=x.default; continue; }
    if(!condMet(x,vals)) continue;
    const v=vals[x.key]===undefined?x.default:vals[x.key];
    if(x.type==="external"){
      if(v!==true){ alert(`Please acknowledge "${x.title||x.url}" before answering.`); return; }
      answer[x.key]=true;
      continue;
    }
    if(x.type==="multiselect"){
      const arr=Array.isArray(v)?v:[];
      if(x.required&&!arr.length){ alert(`"${x.title||x.key}" is required.`); return; }
      answer[x.key]=arr;
      continue;
    }
    if(v===undefined||v===""){
      if(x.type==="boolean"&&x.required){ answer[x.key]=false; continue; }
      if(x.required){ alert(`"${x.title||x.key}" is required.`); return; }
      continue;
    }
    if(x.type==="number"||x.type==="integer"){
      const n=Number(v);
      if(Number.isNaN(n)){ alert(`"${x.title||x.key}" must be a number.`); return; }
      answer[x.key]=n;
      continue;
    }
    answer[x.key]=v;
  }
  try{
    await post("/api/form",{server:s.server,sessionId:s.id,formId,answer});
    s.forms=(s.forms||[]).filter(x=>x.id!==formId);
    if(state.forms) state.forms=state.forms.filter(x=>x.id!==formId);
    delete formDrafts[formId];
    formSig=""; renderForms(true);
  }catch(e){ alert(String(e)); }
}

function render(){
  // remember what just finished: running/waiting/error -> idle
  const live=new Set(state.sessions.map(s=>s.id));
  for(const s of state.sessions){
    const was=prevStates.get(s.id);
    // Append, so a bubble that is already on screen keeps its slot; `slice(-4)`
    // drops the oldest history, and the stack shows the newest two of it.
    if(was && was!=="idle" && s.state==="idle")
      finishedIds=[...finishedIds.filter(x=>x!==s.id),s.id].slice(-4);
    prevStates.set(s.id,s.state);
  }
  for(const k of [...prevStates.keys()]) if(!live.has(k)) prevStates.delete(k);
  if(!firstRender){
    firstRender=true;
    // Seed with what finished shortly before the face started, oldest first so
    // the newest sits at the bottom like a live finish would.
    const recent=state.sessions.filter(s=>s.state==="idle"&&s.lastText&&Date.now()-(s.updatedAt||0)<15*60*1000)
      .sort((a,b)=>b.updatedAt-a.updatedAt).slice(0,2).reverse().map(s=>s.id);
    finishedIds=[...new Set([...finishedIds,...recent])].slice(-4);
  }
  finishedIds=finishedIds.filter(id=>live.has(id));
  const plan=Boolean(state.pet?.plan);
  petState=(state.pet&&state.pet.state)||"idle";
  // Plan mode has its own pose while it works; a question/error keeps the pose
  // that tells you it needs attention, but the violet aura stays.
  if(plan&&petState==="running") petState="plan";
  const aura=plan?"plan":petState;
  for(const k of AURA_STATES) cv.classList.toggle("aura-"+k,k===aura);
  if(IS_PANEL){
    $("#dot").className="dot "+petState+(plan&&petState!=="plan"&&petState!=="waiting"&&petState!=="error"?" plan":"");
    const c=state.pet?.counts||{};
    $("#psub").textContent=[plan?"planning":"",c.waiting?`${c.waiting} needs you`:"",c.running?`${c.running} working`:"",
      c.error?`${c.error} error`:"",`${c.idle||0} idle`].filter(Boolean).join(" · ")||"idle";
    renderList(); renderPerms(); renderDetail(); renderForms(); renderQueued(); syncComposer();
    if(view==="pets") renderPetsList();
  }
  if(IS_BUBBLES) renderBubbles();
}
