<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>cute-pets</title>
<style>
:root{--ink:#eceef6;--dim:#98a0b7;--card:#181b24;--card2:#222634;--line:#2c3142;--line2:#3a4258;
--run:#5ac8ff;--wait:#ffc65c;--err:#ff6b6b;--ok:#6ee7a8}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:transparent;overflow:hidden;
font:13px/1.45 ui-sans-serif,system-ui,"Segoe UI",sans-serif;color:var(--ink);user-select:none}
.wrap{position:relative;width:100%;height:100%}
/* ---------- panel ---------- */
.panel{position:absolute;left:4px;right:4px;top:auto;bottom:226px;height:var(--panelH,574px);display:none;flex-direction:column;
background:rgba(16,18,25,.98);border:1px solid var(--line);border-radius:14px;overflow:hidden;
box-shadow:0 18px 44px rgba(0,0,0,.6)}
body.expanded .panel{display:flex}
.panel header{display:flex;align-items:center;gap:9px;padding:9px 11px;border-bottom:1px solid var(--line)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok);flex:none}
.dot.running{background:var(--run)}.dot.waiting{background:var(--wait)}.dot.error{background:var(--err)}
.h1{font-weight:600;font-size:12.5px}
.h2{font-size:11px;color:var(--dim)}
header .sp{flex:1}
header button{background:transparent;border:0;color:var(--dim);font-size:15px;cursor:pointer;padding:2px 5px;border-radius:6px}
header button:hover{color:var(--ink);background:#20242f}
.body{display:flex;flex:1;min-height:0}
.col{min-width:0;display:flex;flex-direction:column}
.col.list{width:232px;border-right:1px solid var(--line)}
.colhead{display:flex;align-items:center;gap:6px;padding:7px 9px;font-size:11px;color:var(--dim);
text-transform:uppercase;letter-spacing:.07em}
#sessions{overflow:auto;padding:0 7px 7px;display:flex;flex-direction:column;gap:5px}
#permzone{padding:0 7px 6px}
.srow{display:flex;gap:7px;align-items:flex-start;background:var(--card);border:1px solid var(--line);
border-radius:9px;padding:6px 8px;cursor:pointer}
.srow:hover{border-color:var(--line2)}
.srow.sel{border-color:#4b5a7e;background:#1b2130}
.chip{font-size:9px;letter-spacing:.06em;text-transform:uppercase;padding:1px 5px;border-radius:999px;
border:1px solid var(--line);color:var(--dim);flex:none;margin-top:1px}
.chip.running{color:var(--run);border-color:#1d3c52;background:#10222d}
.chip.waiting{color:var(--wait);border-color:#4a3a1a;background:#2a2110}
.chip.error{color:var(--err);border-color:#4a2020;background:#2a1414}
.chip.idle{color:var(--ok);border-color:#1d4030;background:#10251c}
.stitle{font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ssub{font-size:10px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* detail */
.detail{flex:1}
.dhead{padding:8px 11px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.dhead .t{font-weight:600;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.dbody{flex:1;overflow:auto;padding:9px 11px;display:flex;flex-direction:column;gap:7px}
.msg{background:var(--card2);border-radius:9px;padding:6px 9px;font-size:11.5px;white-space:normal;overflow-wrap:anywhere}
.msg.user{border-left:2px solid #3d4460;color:#c6ccdf}
.msg.assistant{border-left:2px solid var(--run)}
/* markdown */
.msg p{margin:0 0 7px}.msg p:last-child{margin-bottom:0}
.msg h1,.msg h2,.msg h3,.msg h4{margin:9px 0 5px;line-height:1.3}
.msg h1{font-size:14px}.msg h2{font-size:13px}.msg h3{font-size:12px}.msg h4{font-size:11.5px}
.msg ul,.msg ol{margin:4px 0;padding-left:18px}.msg li{margin:1px 0}
.msg blockquote{margin:6px 0;padding:2px 9px;border-left:2px solid var(--line2);color:var(--dim)}
.msg code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:10.5px;
background:#10131b;border:1px solid var(--line);border-radius:4px;padding:0 3px}
.msg .codeblock{margin:7px 0;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:#0d1017}
.msg .codehead{display:flex;justify-content:space-between;align-items:center;gap:8px;
padding:3px 8px;background:#151923;color:var(--dim);font-size:9.5px;text-transform:uppercase;letter-spacing:.07em}
.msg .codehead .copybtn{background:transparent;border:0;color:var(--dim);font:inherit;font-size:9.5px;
text-transform:none;letter-spacing:0;cursor:pointer;padding:1px 4px;border-radius:4px}
.msg .codehead .copybtn:hover{background:#20242f;color:var(--ink)}
.msg pre{margin:0;padding:8px 9px;overflow:auto;max-height:340px}
.msg pre code{background:none;border:0;padding:0;font-size:10.5px;line-height:1.5;white-space:pre}
.msg a{color:var(--run);text-decoration:none}.msg a:hover{text-decoration:underline}
.msg img{max-width:100%;border-radius:6px;margin:5px 0}
.msg hr{border:0;border-top:1px solid var(--line);margin:8px 0}
.msg table{border-collapse:collapse;margin:6px 0;font-size:10.5px;display:block;overflow:auto;max-width:100%}
.msg th,.msg td{border:1px solid var(--line);padding:3px 6px;text-align:left}
.msg th{background:#1b202b}.msg del{color:var(--dim)}
/* collapsed tool / thinking / error trace */
.msg .trace{margin-top:6px;border-top:1px dashed var(--line);padding-top:5px}
.msg .trace.above{margin-top:0;margin-bottom:6px;padding-top:0;padding-bottom:5px;
border-top:0;border-bottom:1px dashed var(--line)}
.msg .trace>summary{cursor:pointer;color:var(--dim);font-size:10px;list-style:none;
display:flex;align-items:center;gap:5px;user-select:none}
.msg .trace>summary::-webkit-details-marker{display:none}
.msg .trace>summary:before{content:"▸";font-size:9px}
.msg .trace[open]>summary:before{content:"▾"}
.msg .trace>summary.has-error{color:var(--err)}
.msg .tracebody{display:flex;flex-direction:column;gap:4px;padding:4px 0 0 10px}
.msg .toolpart{border-left:2px solid var(--line2);padding-left:7px}
.msg .toolpart>summary{cursor:pointer;font-size:10px;color:var(--dim);list-style:none;
display:flex;align-items:baseline;gap:6px}
.msg .toolpart>summary::-webkit-details-marker{display:none}
.msg .toolpart>summary:before{content:"›";font-size:10px}
.msg .toolpart[open]>summary:before{content:"⌄"}
.msg .toolpart .tname{color:var(--ink);font-family:ui-monospace,monospace;font-size:10px}
.msg .toolpart .tstatus{font-size:9px;text-transform:uppercase;letter-spacing:.05em}
.msg .toolpart.error .tstatus{color:var(--err)}
.msg .toolpart.running .tstatus{color:var(--run)}
.msg .tlabel{font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;margin-top:4px}
.msg .trace pre,.msg .trace .rmd{max-height:240px;overflow:auto;white-space:pre-wrap;background:#0d1017;
border:1px solid var(--line);border-radius:4px;padding:4px 6px;margin:2px 0;font-size:10px}
.msg .trace .rmd{font-size:10.5px;color:#c6ccdf;white-space:normal}
.msg-error{margin-top:5px;font-size:10px;color:var(--err);border-left:2px solid var(--err);
padding-left:6px;overflow-wrap:anywhere}
.msg-error.muted{color:var(--wait);border-color:var(--wait)}
/* jump-to-latest */
.detail{position:relative}
.tobottom{position:absolute;right:14px;bottom:12px;width:26px;height:26px;border-radius:50%;
border:1px solid var(--line2);background:rgba(22,25,34,.96);color:var(--ink);display:none;
align-items:center;justify-content:center;cursor:pointer;z-index:6;font-size:13px;padding:0}
.tobottom.on{display:flex}
.tobottom:hover{border-color:#4b5a7e;color:#fff}
.empty{color:var(--dim);font-size:11.5px;text-align:center;padding:18px 8px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.07em}
textarea,input[type=text],select{width:100%;background:var(--card2);color:var(--ink);border:1px solid var(--line);
border-radius:8px;padding:7px 9px;font:inherit;font-size:12px;resize:none}
textarea{min-height:64px}
.btnrow{display:flex;gap:6px;flex-wrap:wrap}
.pbtn{background:#222736;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:4px 9px;
font:inherit;font-size:11px;cursor:pointer}
.pbtn:hover{border-color:var(--line2)}
.pbtn.ok{background:#1d4030;border-color:#2c6b4c}.pbtn.no{background:#45212a;border-color:#6b2f3a}
.pbtn.on{background:#24506b;border-color:#2f6d92}
.perm{border:1px solid #4a3a1a;background:#241d0f;border-radius:9px;padding:7px 8px;font-size:11px}
.perm b{color:var(--wait)}
/* composer + palette */
.composer{position:relative;display:flex;gap:6px;padding:8px 10px;border-top:1px solid var(--line)}
.composer input{flex:1;background:var(--card2);border:1px solid var(--line);border-radius:9px;color:var(--ink);
font:inherit;font-size:12px;padding:7px 10px;min-width:0}
.composer button{background:#24506b;border:1px solid #2f6d92;color:var(--ink);border-radius:9px;padding:6px 11px;
font:inherit;cursor:pointer}
.palette{position:absolute;left:8px;right:8px;bottom:46px;background:#171a23;border:1px solid var(--line);
border-radius:10px;box-shadow:0 -10px 26px rgba(0,0,0,.5);overflow:hidden;display:none;max-height:248px;overflow-y:auto}
.palette.on{display:block}
.pitem{display:flex;gap:8px;padding:6px 10px;cursor:pointer;align-items:baseline}
.pitem:hover,.pitem.sel{background:#222736}
.pitem .n{font-family:ui-monospace,monospace;font-size:11.5px;color:#9fd2ff;flex:none}
.pitem .n.pet{color:#8ee0b0}
.pitem .d{font-size:10.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* pet */
body.flip .panel{top:226px;bottom:auto}
body.flip .petzone{top:0;bottom:auto}
body.flip .bubbles{bottom:auto;top:220px}
.mini{position:absolute;right:6px;width:396px;display:none;flex-direction:column;gap:6px;
background:rgba(16,18,25,.98);border:1px solid var(--line);border-radius:12px;padding:9px;
box-shadow:0 16px 36px rgba(0,0,0,.6)}
body.mini-open .mini{display:flex;bottom:226px}
body.mini-open.flip .mini{bottom:auto;top:226px}
body.mini-open .panel{display:none}
body.switching .panel,body.switching .mini{visibility:hidden}
.mini textarea{min-height:56px}
.petzone{position:absolute;right:0;bottom:0;width:260px;height:222px;display:flex;flex-direction:column;
align-items:center;justify-content:flex-end;padding-bottom:2px}
body.expanded .petzone{opacity:.92}
#pet{cursor:grab;width:200px;height:217px;transform-origin:50% 70%;
filter:drop-shadow(0 12px 16px rgba(0,0,0,.6));transition:transform .35s cubic-bezier(.3,1.4,.5,1)}
#pet.flip{transform:scaleX(-1)}
#pet:active{cursor:grabbing}
.bubbles{position:absolute;bottom:222px;right:0;display:flex;flex-direction:column;align-items:flex-end;gap:5px;padding:0 6px;max-width:250px}
body.expanded .bubbles{display:none}
.bub{display:flex;align-items:center;gap:6px;max-width:248px;background:rgba(24,27,36,.95);
border:1px solid var(--line);border-radius:11px;padding:5px 9px;font:inherit;font-size:11.5px;color:var(--ink);
cursor:pointer;box-shadow:0 6px 16px rgba(0,0,0,.45)}
.bub:hover{border-color:var(--line2)}
.bub i{width:7px;height:7px;border-radius:50%;background:var(--dim);flex:none}
.bub.done{opacity:.82;border-style:dashed}
.bub.done i{background:#6ee7a8}
.bub.done span{color:#b9c2d6}
.bub.waiting i{background:var(--wait)}.bub.running i{background:var(--run)}.bub.error i{background:var(--err)}
.bub span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* tooltip + context menu */
.tip{position:fixed;max-width:300px;background:#12151c;border:1px solid var(--line2);border-radius:9px;
padding:7px 9px;font-size:11px;color:#c8cde0;box-shadow:0 12px 26px rgba(0,0,0,.6);display:none;z-index:50;
/* never become the hover target: an overlapping tip used to steal the bubble,
   which hid the tip, which brought the bubble back — a flicker plus dead clicks */
pointer-events:none}
.tip.on{display:block}
.ctx{position:fixed;min-width:186px;background:#161922;border:1px solid var(--line2);border-radius:10px;
padding:5px;box-shadow:0 16px 34px rgba(0,0,0,.65);display:none;z-index:60}
.ctx.on{display:block}
.ctx button{display:block;width:100%;text-align:left;background:transparent;border:0;color:var(--ink);
font:inherit;font-size:12px;padding:6px 9px;border-radius:7px;cursor:pointer}
.ctx button:hover{background:#222736}
.ctx .sep{height:1px;background:var(--line);margin:4px 6px}
.ctx .k{float:right;color:var(--dim);font-size:10.5px}
/* ---- three surfaces: pet, bubbles, panel ---- */
body.mode-pet .panel, body.mode-pet .mini, body.mode-pet .bubbles{display:none!important}
body.mode-panel .petzone, body.mode-panel .bubbles, body.mode-panel .tip{display:none!important}
body.mode-bubbles .petzone, body.mode-bubbles .panel, body.mode-bubbles .mini,
body.mode-bubbles .tip{display:none!important}
/* the bubble window is exactly the stack: no room for the tooltip, which the
   pet window draws through the shell instead */
body.mode-bubbles .bubbles{position:absolute;right:0;top:0;bottom:auto;left:auto;max-width:250px}
/* the tooltip lives in the fixed-size pet window, over the sprite */
body.mode-pet .tip{left:6px;right:6px;top:6px;max-width:none}
/* the panel window is exactly the panel: fill it, no 560x800 shell around it */
body.mode-panel .panel{position:absolute;left:0;right:0;top:0;bottom:0;height:auto;display:flex;border-radius:12px}
body.mode-panel.mini-open .panel{display:none}
/* the mini window is sized to exactly this form, so it starts at the top */
body.mode-panel .mini{left:0;right:0;top:0;bottom:auto;width:auto}
</style></head>
<body class="minimized">
<div class="wrap">
  <section class="panel">
    <header>
      <div class="dot" id="dot"></div>
      <div style="min-width:0"><div class="h1" id="petname">pet</div><div class="h2" id="psub">starting…</div></div>
      <div class="sp"></div>
      <button id="btnNew" title="New chat (Ctrl+N)">+</button>
      <button id="btnSettings" title="Settings">&#9881;</button>
      <button id="collapse" title="Collapse">&#10005;</button>
    </header>
    <div class="body">
      <aside class="col list">
        <div class="colhead">sessions <select id="filter" style="width:auto;padding:2px 4px;font-size:10.5px"></select></div>
        <div id="permzone"></div>
        <div id="sessions"></div>
      </aside>
      <section class="col detail">
        <div class="dhead"><span class="chip idle" id="dstate">idle</span><div class="t" id="dtitle">Nothing selected</div>
          <span class="ssub" id="dmeta" style="flex:none"></span>
          <button class="pbtn" id="dabort" style="display:none">stop</button></div>
        <div class="dbody" id="dbody"></div>
        <button class="tobottom" id="toBottom" title="Jump to latest" type="button">&#8595;</button>
      </section>
    </div>
    <form class="composer" id="composer">
      <div class="palette" id="palette"></div>
      <input id="prompt" placeholder="Message the selected session — / for commands" autocomplete="off">
      <button type="submit">&#9166;</button>
    </form>
  </section>

  <section class="mini" id="mini">
    <div class="row" style="gap:6px">
      <b style="font-size:11.5px">New chat</b>
      <span class="ssub" id="miniDir" style="flex:1;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></span>
      <button class="pbtn" id="miniDirBtn" title="Choose folder">folder</button>
      <button class="pbtn" id="miniX" title="Close">&#10005;</button>
    </div>
    <textarea id="miniText" placeholder="What should OpenCode do?"></textarea>
    <div class="row"><button class="pbtn ok" id="miniGo" style="flex:1">Start chat</button></div>
  </section>

  <div class="petzone">
    <canvas id="pet" width="400" height="434"></canvas>
  </div>
  <div class="bubbles" id="bubbles"></div>
</div>
<div class="tip" id="tip"></div>
<div class="ctx" id="ctx"></div>

<script src="/markdown.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const api=window.cp||{setFacing(){},onFacing(){},onPanel(){},onPanelCommand(){},panel(){},panelSize(){},
  bubblesSize(){},tooltip(){},onTooltip(){},petMenu(){},bubbleMenu(){},pickFolder:async()=>({ok:false})};
// One page, three windows: #pet is the sprite, #bubbles the bubble stack, #panel
// the sessions/chat/settings UI.
const HASH=(location.hash||"#pet").slice(1);
const SURFACE=["pet","panel","bubbles"].includes(HASH)?HASH:"pet";
const IS_PET=SURFACE==="pet", IS_PANEL=SURFACE==="panel", IS_BUBBLES=SURFACE==="bubbles";
document.body.classList.add("mode-"+SURFACE);
const B="";
let state={pet:{state:"idle"},sessions:[],permissions:[],servers:[]};
let finishedIds=[], prevStates=new Map(), firstRender=false;   // sessions that ended while we were watching
let expanded=IS_PANEL, selected=null, view="chat", filter="all", commands=[], newDir=null, workspaces=[];
let draft=null, defaults=null; // a new chat before its first message
if(IS_PANEL) document.body.classList.add("expanded"); // the panel window only exists while open

/* ---------------- sprite ---------------- */
const FW=192,FH=208,FRAMES=8;
const ROW={idle:0,running:2,waiting:6,error:9};
const FPS={idle:6,running:11,waiting:5,error:4};
const img=new Image(), cv=$("#pet"), ctx2=cv.getContext("2d");
const valid={}; let petState="idle", facing="right", petKey="";
function measure(){
  const c=document.createElement("canvas"); c.width=FW; c.height=FH; const g=c.getContext("2d");
  for(let r=0;r<11;r++){ let last=1;
    for(let f=0;f<FRAMES;f++){
      g.clearRect(0,0,FW,FH); g.drawImage(img,f*FW,r*FH,FW,FH,0,0,FW,FH);
      const d=g.getImageData(0,0,FW,FH).data; let solid=0;
      for(let i=3;i<d.length;i+=4*17) if(d[i]>16) solid++;
      if(solid>10) last=f+1;
    }
    valid[r]=last;
  }
}
function draw(t){
  if(img.complete&&img.naturalWidth&&petKey){
    const r=ROW[petState]??0, n=valid[r]||FRAMES, s=FPS[petState]||6;
    const f=Math.floor(t/1000*s)%n;
    ctx2.clearRect(0,0,cv.width,cv.height);
    ctx2.drawImage(img,f*FW,r*FH,FW,FH,0,0,cv.width,cv.height);
  }
  requestAnimationFrame(draw);
}
img.onload=()=>{ if(IS_PET) measure(); };
if(IS_PET) requestAnimationFrame(draw);
async function loadPet(){
  try{
    const p=await (await fetch("/api/pet")).json();
    if(p.url && p.url!==petKey){
      petKey=p.url; img.src=p.url;
      $("#petname").textContent=p.name||"pet";
      document.title=p.name||"cute-pets";
    }
  }catch{}
}
function applyFacing(){ cv.classList.toggle("flip", facing==="left"); }
api.onFacing((f)=>{ facing=f; applyFacing(); });

/* ---------------- helpers ---------------- */
async function post(path, body){
  const r=await fetch(path,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.error||r.status);
  return j;
}
let lastLayout=0;   // a click that lands right after the panel toggles is noise
function petRect(){ return cv.getBoundingClientRect(); }

// The panel is a separate window now (electron/main.cjs). On the pet surface this
// only tracks the panel-open state the shell reports back, so bubbles can hide and
// the window can hug the sprite. On the panel surface, closing asks the shell to
// hide the window; opening is the shell's job.
function setExpanded(on){
  if(IS_PANEL){ if(!on) api.panel({open:false}); return; }
  if(!IS_PET||on===expanded) return;
  lastLayout=Date.now();
  expanded=on;
  document.body.classList.toggle("expanded",on);
  document.body.classList.toggle("minimized",!on);
}
function showView(v){ view=v; if(v!=="chat") draft=null; render(); }
function startDraft(){
  const base=defaults||{};
  draft={
    directory: base.directory || workspaces[0]?.directory || null,
    server: base.server || null,
    model: base.model || null,
    agent: base.agent || null,
  };
  selected=null; msgSession=""; msgKey=""; msgSeq++;
  if(msgTimer) clearTimeout(msgTimer);
  view="chat"; expanded=true;
  document.body.classList.add("expanded");
  closePalette(); hideCtx();
  render();
  setTimeout(()=>$("#prompt")?.focus(),30);
}
const currentSession=()=>state.sessions.find(s=>s.id===selected)||null;

/* ---------------- rendering ---------------- */
function renderBubbles(){
  const act=state.sessions.filter(s=>s.state!=="idle")
    .sort((a,b)=>(a.state==="waiting"?0:1)-(b.state==="waiting"?0:1)).slice(0,3);
  // Sessions that finished while the pet was running keep a bubble until they are
  // hidden (or fall out of the list of the last few).
  const shown=new Set(act.map(s=>s.id));
  const done=finishedIds.map(id=>state.sessions.find(s=>s.id===id))
    .filter(s=>s&&!shown.has(s.id)).slice(0,2);
  $("#bubbles").innerHTML=[...act.map(s=>`<button class="bub ${s.state}" data-session="${esc(s.id)}">
      <i></i><span>${esc(s.title)}</span></button>`),
    ...done.map(s=>`<button class="bub done" data-session="${esc(s.id)}" title="finished - right-click to hide">

let msgKey="", msgSession="", msgSeq=0, msgTimer=null;
const sessionKey=(s)=>`${s.server}|${s.id}`;
function scheduleMessages(s){
  if(!s) return;
  clearTimeout(msgTimer);
  msgTimer=setTimeout(()=>loadMessages(s),70);
}
function updateToBottom(){

function messageError(err){
  if(!err) return "";
  const type=err.type||"error";
  const msg=err.message||err.data?.message||(typeof err==="string"?err:JSON.stringify(err));
  const muted=/aborted|interrupt/i.test(type+" "+msg);
  const short=msg.length>220?msg.slice(0,220)+"…":msg;
  return `<div class="msg-error${muted?" muted":""}" title="${esc(msg)}">${esc(type)} · ${esc(short)}</div>`;
}
function renderPart(p,mid,i){
  if(p.type==="tool"){
    const status=String(p.status||"");
    const input=p.input==null?"":(typeof p.input==="string"?p.input:JSON.stringify(p.input,null,2));
    const output=String(p.output??"");
    return `<details class="toolpart ${esc(status)}" data-k="${esc(mid)}:tool:${i}">`+
      `<summary><span class="tname">${esc(p.name||"tool")}</span> <span class="tstatus">${esc(status)}</span></summary>`+
      (input?`<div class="tlabel">input</div><pre>${esc(input.slice(0,8000))}</pre>`:"")+
      (output?`<div class="tlabel">output</div><pre>${esc(output.slice(0,8000))}</pre>`:"")+
      `</details>`;
  }
  if(p.type==="reasoning"||p.type==="system"){
    const label=p.type==="reasoning"?"thinking":"system";
    return `<div class="rpart"><div class="tlabel">${label}</div><div class="rmd">${CPMarkdown.toHtml(p.text||"")}</div></div>`;
  }
  if(p.type==="file") return `<div class="tlabel">file · ${esc(p.name||p.path||"file")}</div>`;
  return "";
}
function messageTrace(m,mid,above){
  const extras=(m.parts||[]).filter(p=>p.type!=="text");
  if(!extras.length) return "";
  const tools=extras.filter(p=>p.type==="tool");
  const nThink=extras.filter(p=>p.type==="reasoning").length;
  const nFile=extras.filter(p=>p.type==="file").length;
  const nSys=extras.filter(p=>p.type==="system").length;
  const bits=[];
  if(tools.length) bits.push(`${tools.length} tool${tools.length>1?"s":""}`);
  if(nThink) bits.push(`${nThink} thinking`);
  if(nFile) bits.push(`${nFile} file${nFile>1?"s":""}`);
  if(nSys) bits.push(`${nSys} system`);
  const hasErr=tools.some(t=>/error|failed/i.test(String(t.status)));
  return `<details class="trace${above?" above":""}" data-k="${esc(mid)}:trace">`+
    `<summary class="${hasErr?"has-error":""}">${esc(bits.join(" · "))||"trace"}</summary>`+
    `<div class="tracebody">${extras.map((p,i)=>renderPart(p,mid,i)).join("")}</div></details>`;
}
function renderMessage(m){
  const mid=m.id||`m${Math.random().toString(36).slice(2)}`;
  const parts=m.parts||[];
  const text=parts.filter(p=>p.type==="text"&&p.text).map(p=>p.text).join("\n\n");
  const role=m.role==="user"?"user":"assistant";
  // Keep the real order: a message is [reasoning, text] (thinking before the
  // answer), not text followed by its thinking. Only move the trace below when
  // it actually came after the text.
  const firstText=parts.findIndex(p=>p.type==="text"&&p.text);
  const firstExtra=parts.findIndex(p=>p.type!=="text");
  const above=firstExtra>=0 && (firstText<0 || firstExtra<firstText);
  const trace=messageTrace(m,mid,above);
  return `<div class="msg ${role}">${above?trace:""}${text?CPMarkdown.toHtml(text):""}${messageError(m.error)}${above?"":trace}</div>`;
}
// Consecutive assistant steps with no answer text are one process run. Collapsing
// them into a single trace keeps a turn readable: one "N steps · M tools" line
// instead of one line per step.
function renderRows(rows){
  const groups=[];
  let pending=null;
  for(const m of rows){
    const hasText=(m.parts||[]).some(p=>p.type==="text"&&p.text);
    if(hasText){ pending=null; groups.push({kind:"msg",m}); }
    else {
      if(!pending){ pending={kind:"proc",msgs:[]}; groups.push(pending); }
      pending.msgs.push(m);
    }
  }
  return groups.map(g=>g.kind==="msg"?renderMessage(g.m):renderProcess(g.msgs)).join("");
}
function renderProcess(msgs){
  const key=`process:${msgs[0]?.id||"p"}`;
  const parts=msgs.flatMap(m=>m.parts||[]);
  const tools=parts.filter(p=>p.type==="tool");
  const nThink=parts.filter(p=>p.type==="reasoning").length;
  const nFile=parts.filter(p=>p.type==="file").length;
  const nSys=parts.filter(p=>p.type==="system").length;
  const errs=[], seen=new Set();
  for(const m of msgs){
    const e=m.error; if(!e) continue;
    const k=`${e.type}|${e.message}`; if(seen.has(k)) continue;
    seen.add(k); errs.push(e);
  }
  const bits=[`${msgs.length} step${msgs.length>1?"s":""}`];
  if(tools.length) bits.push(`${tools.length} tool${tools.length>1?"s":""}`);
  if(nThink) bits.push(`${nThink} thinking`);
  if(nFile) bits.push(`${nFile} file${nFile>1?"s":""}`);
  if(nSys) bits.push(`${nSys} system`);
  const hasErr=errs.length||tools.some(t=>/error|failed/i.test(String(t.status)));
  const trace=parts.length
    ? `<details class="trace" data-k="${esc(key)}:trace"><summary class="${hasErr?"has-error":""}">`+
      `${esc(bits.join(" · "))}</summary><div class="tracebody">`+
      `${parts.map((p,i)=>renderPart(p,key,i)).join("")}</div></details>`
    : "";
  return `<div class="msg assistant process">${errs.map(messageError).join("")}${trace}</div>`;
}
async function loadMessages(s){
  if(!s) return;
  const sk=sessionKey(s);
  const seq=++msgSeq;
  try{
    const msgs=await (await fetch(`/api/messages?server=${encodeURIComponent(s.server)}&sessionId=${encodeURIComponent(s.id)}&limit=30`)).json();
    if(seq!==msgSeq||msgSession!==sk) return; // a newer session/load won
    const rows=(msgs||[]).filter(m=>(m.parts&&m.parts.length)||m.error);
    const key=JSON.stringify(rows.map(m=>[m.id,m.error,m.parts]));
    if(key===msgKey){ updateToBottom(); return; } // already on screen
    msgKey=key;
    const body=$("#dbody");
    const atBottom=body.scrollHeight-body.scrollTop-body.clientHeight<40;
    const open=new Set([...body.querySelectorAll("details[open][data-k]")].map(d=>d.dataset.k));
    body.innerHTML=renderRows(rows)||`<div class="empty">no messages yet</div>`;
    // keep expanded traces/tools expanded across streaming updates
    for(const k of open){
      const d=[...body.querySelectorAll("details[data-k]")].find(x=>x.dataset.k===k);
      if(d) d.open=true;
    }
    if(atBottom) body.scrollTop=body.scrollHeight;
    updateToBottom();
  }catch(e){
    if(seq===msgSeq&&msgSession===sk){
      msgKey=""; // let the next poll retry and repaint after a transient failure
      $("#dbody").innerHTML=`<div class="empty">${esc(e)}</div>`;
      updateToBottom();
    }
  }
}

function render(){
  // remember what just finished: running/waiting/error -> idle
  const live=new Set(state.sessions.map(s=>s.id));
  for(const s of state.sessions){
    const was=prevStates.get(s.id);
    if(was && was!=="idle" && s.state==="idle")
      finishedIds=[s.id,...finishedIds.filter(x=>x!==s.id)].slice(0,4);
    prevStates.set(s.id,s.state);
  }
  for(const k of [...prevStates.keys()]) if(!live.has(k)) prevStates.delete(k);
  if(!firstRender){
    firstRender=true;
    const recent=state.sessions.filter(s=>s.state==="idle"&&s.lastText&&Date.now()-(s.updatedAt||0)<15*60*1000)
      .sort((a,b)=>b.updatedAt-a.updatedAt).slice(0,2).map(s=>s.id);
    finishedIds=[...new Set([...finishedIds,...recent])].slice(0,4);
  }
  finishedIds=finishedIds.filter(id=>live.has(id));
  petState=(state.pet&&state.pet.state)||"idle";
  if(IS_PANEL){
    $("#dot").className="dot "+petState;
    const c=state.pet?.counts||{};
    $("#psub").textContent=[c.waiting?`${c.waiting} needs you`:"",c.running?`${c.running} working`:"",
      c.error?`${c.error} error`:"",`${c.idle||0} idle`].filter(Boolean).join(" · ")||"idle";
    renderList(); renderPerms(); renderDetail();
    if(view==="pets") renderPetsList();
  }
  if(IS_BUBBLES) renderBubbles();
}

function dirChoices(){
  const seen=new Map();
  const add=(dir,why)=>{ if(dir&&!seen.has(dir)) seen.set(dir,{dir,why}); };
  add(draft?.directory,"current");
  add(currentSession()?.directory,"current");
  add(defaults?.directory,"last used");
  for(const s of state.sessions) add(s.directory,"session");
  return [...seen.values()].sort((a,b)=>
    (a.why==="current"?0:1)-(b.why==="current"?0:1) || a.dir.localeCompare(b.dir));
}
function cdPrefix(value){
  const m=String(value||"").match(/^\/cd(?:\s+([\s\S]*))?$/);
  return m ? (m[1] ?? "") : null;
}
function openDirPalette(prefix=""){
  const q=String(prefix||"").trim().replace(/[\\/]+$/,"").toLowerCase();
  const dirs=dirChoices().filter(d=>!q || d.dir.toLowerCase().startsWith(q));
  if(!dirs.length){ closePalette(); return false; }
  palMode="dirs";
  palItems=dirs.map(d=>({kind:"dir",label:d.dir,sub:d.why,value:d.dir}));
  palSel=0;
  pal.classList.add("on");
  pal.innerHTML=palItems.map((it,i)=>`<div class="pitem ${i===0?"sel":""}" data-i="${i}">
      <span class="n">${esc(it.label)}</span><span class="d">${esc(it.sub)}</span></div>`).join("");
  return true;
}
function openPalette(prefix="",mode="root"){
  palMode=mode;
  const q=prefix.toLowerCase();
  if(mode==="models"){
    palItems=modelsList.map(m=>({kind:"model",label:m.id,sub:`${m.providerID}${m.free?" · free":""}${m.default?" · default":""}`,value:m}));
  }else if(mode==="agents"){
    palItems=agentsList.map(a=>({kind:"agent",label:a.name,sub:a.description||a.mode||"",value:a.name}));
  }else{
    palItems=[
      ...commands.filter(c=>c.name.toLowerCase().startsWith(q))
        .map(c=>({kind:"command",label:"/"+c.name,sub:c.description||""})),
      ...PET_CMDS.filter(c=>c.name.toLowerCase().startsWith(q))
        .map(c=>({kind:"pet",label:"/"+c.name,sub:c.d})),
    ];
  }
  palSel=0;
  pal.classList.toggle("on",palItems.length>0);
  pal.innerHTML=palItems.map((it,i)=>`<div class="pitem ${i===0?"sel":""}" data-i="${i}">
      <span class="n${it.kind==="pet"?" pet":""}">${esc(it.label)}</span><span class="d">${esc(it.sub)}</span></div>`).join("");
}
function closePalette(){ pal.classList.remove("on"); pal.innerHTML=""; palItems=[]; palMode="root"; }

async function choosePalette(i){
  const it=palItems[i]; if(!it) return;
  if(it.kind==="command"){ $("#prompt").value=it.label+" "; closePalette(); $("#prompt").focus(); return; }
  if(it.kind==="dir"){ closePalette(); $("#prompt").value=""; await changeDir(it.value); return; }
  if(it.kind==="model"||it.kind==="agent"){
    if(!currentSession()&&!draft) startDraft();
    const s=currentSession();
    const value=it.kind==="model"
      ? {id:it.value.id, providerID:it.value.providerID, variant:it.value.variant ?? "default"}
      : it.value;
    if(!s && draft){
      if(it.kind==="model") draft.model=value; else draft.agent=value;
      closePalette(); $("#prompt").value=""; render(); return;
    }
    if(!s){ closePalette(); return; }
    try{ await post("/api/session/action",{server:s.server,sessionId:s.id,action:it.kind,value}); }catch(e){ alert(String(e)); }
    if(defaults){ if(it.kind==="model") defaults.model=value; else defaults.agent=value; }
    closePalette(); $("#prompt").value=""; msgKey=""; render(); return;
  }
  const cmd=PET_CMDS.find(c=>"/"+c.name===it.label);
  closePalette(); $("#prompt").value="";
  if(!cmd) return;
  if(cmd.pick==="model"){ await ensureModels(); openPalette("","models"); return; }
  if(cmd.pick==="agent"){ await ensureAgents(); openPalette("","agents"); return; }
  if(cmd.run) return cmd.run();
  if(cmd.act) return runAction(cmd.act);
}

async function forkSession(s){
  try{
    const r=await post("/api/session/action",{server:s.server,sessionId:s.id,action:"fork"});
    // the shell returns the normalized child; show it at once instead of waiting
    // for the next state snapshot
    if(r.session) state.sessions=state.sessions.filter(x=>x.id!==r.session.id).concat(r.session);
    const id=r.sessionId||r.session?.id;
    if(id){ draft=null; selected=id; msgKey=""; view="chat"; render(); }
    return r;
  }catch(e){ alert(String(e)); }
}
async function runAction(act){
  const s=currentSession();
  if(!s){ alert("pick a session first"); return; }
  try{
    if(act==="abort"){ await post("/api/abort",{server:s.server,sessionId:s.id}); return; }
    if(act==="fork"){ await forkSession(s); return; }
    const r=await post("/api/session/action",{server:s.server,sessionId:s.id,action:act});
    if(act==="share"&&r.url){ try{ await navigator.clipboard.writeText(r.url); alert("Share link copied:\n"+r.url); }catch{ alert("Share link:\n"+r.url); } }
  }catch(e){ alert(String(e)); }
}

// /cd: validate a draft directory, or move an existing session (v2).
async function changeDir(p){
  const s=currentSession();
  const dir=String(p||"").trim().replace(/^(["'])(.*)\1$/,"$2");
  if(!dir){
    const cur=s?.directory || draft?.directory;
    alert(cur?`current directory:\n${cur}`:"usage: /cd /path");
    return;
  }
  try{
    if(s){
      const r=await post("/api/session/action",{server:s.server,sessionId:s.id,action:"move",value:{directory:dir}});
      if(r.session) state.sessions=state.sessions.filter(x=>x.id!==r.session.id).concat(r.session);
      if(defaults) defaults.directory=r.directory||dir;
      render();
      return;
    }
    if(!draft) startDraft();
    const prevServer=draft?.server||null;
    const r=await post("/api/checkdir",{directory:dir,server:prevServer});
    draft={...(draft||{}),directory:r.directory,server:r.server||null};
    if(prevServer && r.server!==prevServer){
      draft.model=null; draft.agent=null;
      modelsList=[]; agentsList=[]; modelsKey=""; agentsKey="";
    }
    if(defaults) defaults.directory=r.directory;
    render();
  }catch(e){ alert(String(e)); }
}

$("#prompt").addEventListener("input",e=>{
  const v=e.target.value;
  if(palMode==="dirs"){
    if(!/^\/cd\s+/.test(v)){ closePalette(); return; }
    openDirPalette(cdPrefix(v)); // keep filtering the known directories
    return;
  }
  if(palMode!=="root"){
    if(!v.startsWith("/")) closePalette();
    else openPalette(v.slice(1).split(" ")[0], palMode);
    return;
  }
  if(v==="/cd"){ openPalette("cd"); return; }
  if(v.startsWith("/cd ")){ openDirPalette(cdPrefix(v)); return; }
  if(v.startsWith("/")){
    const rest=v.slice(1);
    // once arguments start the palette is for command names only; let Enter
    // submit the line instead of re-selecting the command and wiping the args
    if(rest.includes(" ")){ closePalette(); return; }
    openPalette(rest);
    return;
  }
  closePalette();
});
// Tab completes text into the composer; Enter is the action. A model/agent entry
// has no text to complete, so Tab leaves the list alone there.
function fillPaletteSelection(){
  const it=palItems[palSel]; if(!it) return false;
  if(it.kind==="command"||it.kind==="pet"){
    $("#prompt").value=it.label+" ";
    if(it.label==="/cd") openDirPalette(""); // keep suggesting directories
    else closePalette();
    $("#prompt").focus();
    return true;
  }
  if(it.kind==="dir"){
    $("#prompt").value="/cd "+it.value;
    openDirPalette(it.value); // re-filter, keep the list open
    $("#prompt").focus();
    return true;
  }
  return false;
}
$("#prompt").addEventListener("keydown",e=>{
  if(!pal.classList.contains("on")) return;
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){
    e.preventDefault();
    palSel=(palSel+(e.key==="ArrowDown"?1:-1)+palItems.length)%palItems.length;
    [...pal.children].forEach((el,i)=>el.classList.toggle("sel",i===palSel));
    pal.children[palSel]?.scrollIntoView({block:"nearest"});
  } else if(e.key==="Tab"){
    e.preventDefault();
    fillPaletteSelection(); // no-op for model/agent lists
  } else if(e.key==="Enter"){
    if(palMode==="dirs"){
      const typed=cdPrefix($("#prompt").value);
      // with a path typed, let Enter submit the line; with no path, run the
      // highlighted suggestion
      if(typed && typed.trim()) return;
      e.preventDefault(); choosePalette(palSel); return;
    }
    e.preventDefault(); choosePalette(palSel);
  } else if(e.key==="Escape"){ closePalette(); }
});
pal.addEventListener("click",e=>{
  const it=e.target.closest("[data-i]"); if(!it) return;
  const i=Number(it.dataset.i);
  if(palItems[i]?.kind==="dir"){ palSel=i; fillPaletteSelection(); return; }
  choosePalette(i);
});

$("#composer").addEventListener("submit",async e=>{
  e.preventDefault();
  const raw=$("#prompt").value.trim(); if(!raw) return;
  const s=currentSession();
  // the first message of a draft (or of the empty panel) creates the session at
  // the draft's directory/model and sends in one go
  const pending = () => draft || {
    directory: defaults?.directory || null,
    server: defaults?.server || null,
    model: defaults?.model || null,
    agent: defaults?.agent || null,
  };

  if(raw==="/cd"||raw.startsWith("/cd ")){
    $("#prompt").value="";
    closePalette();
    await changeDir(raw.slice(3).trim());
    return;
  }

  // a pet command typed in full runs locally (/model, /undo, …)
  if(raw.startsWith("/")){
    const [name,...rest]=raw.slice(1).split(" ");
    const pet=PET_CMDS.find(c=>c.name===name);
    if(pet){
      $("#prompt").value="";
      if(pet.pick==="model"){ if(!currentSession()&&!draft) startDraft(); await ensureModels(); openPalette("","models"); return; }
      if(pet.pick==="agent"){ if(!currentSession()&&!draft) startDraft(); await ensureAgents(); openPalette("","agents"); return; }
      if(pet.run) return pet.run();
      if(pet.act) return runAction(pet.act);
    }
    if(!s){
      const d=pending();
      try{
        const r=await post("/api/prompt",{newSession:true,server:d.server,directory:d.directory,model:d.model,agent:d.agent,
          command:name,text:rest.join(" "),title:`/${name}`});
        if(r.session) state.sessions=state.sessions.filter(x=>x.id!==r.session.id).concat(r.session);
        draft=null; selected=r.sessionId; msgKey=""; msgSession=""; view="chat"; render();
      }catch(err){ alert(String(err)); }
      return;
    }
    try{
      await post("/api/prompt",{sessionId:s?s.id:null,server:s?s.server:null,newSession:!s,
        command:name,text:rest.join(" "),title:`/${name}`});
      $("#prompt").value=""; msgKey="";
    }catch(err){ alert(String(err)); }
    return;
  }

  if(!s){
    const d=pending();
    try{
      const r=await post("/api/prompt",{newSession:true,text:raw,directory:d.directory,server:d.server,model:d.model,agent:d.agent});
      if(r.session) state.sessions=state.sessions.filter(x=>x.id!==r.session.id).concat(r.session);
      draft=null; selected=r.sessionId; msgKey=""; msgSession=""; view="chat";
      if(defaults){
        if(r.session?.directory || d.directory) defaults.directory=r.session?.directory || d.directory;
        if(r.server) defaults.server=r.server;
        if(d.model) defaults.model=d.model;
        if(d.agent) defaults.agent=d.agent;
      }
      render();
    }catch(err){ alert(String(err)); }
    return;
  }

  try{
    await post("/api/prompt",{sessionId:s?s.id:null,server:s?s.server:null,newSession:!s,text:raw});
    $("#prompt").value=""; msgKey="";
    if(s) setTimeout(()=>loadMessages(s),700);
  }catch(err){ alert(String(err)); }
});

/* ---------------- pet: drag, click, context menu ---------------- */
let drag=null;
cv.addEventListener("mousedown",e=>{ if(e.button!==0||!e.isTrusted) return;
  const r=cv.getBoundingClientRect();
  drag={x:e.screenX,y:e.screenY,moved:0};
  api.dragBegin({x:e.screenX,y:e.screenY,pet:{x:r.left,y:r.top,width:r.width,height:r.height}}); });
window.addEventListener("mousemove",e=>{ if(!drag) return;
  drag.moved=Math.max(drag.moved,Math.abs(e.screenX-drag.x)+Math.abs(e.screenY-drag.y));
  api.dragMove({x:e.screenX,y:e.screenY}); });
window.addEventListener("mouseup",e=>{ if(!drag) return; const moved=drag.moved; drag=null; api.dragEnd();
  // only a real click toggles the panel; ignored when a window move re-synthesises one
  if(IS_PET && moved<4 && e.isTrusted && Date.now()-lastLayout>600) api.panel({open:!expanded});
});

const ctx=$("#ctx");
function placeMenu(el,x,y){
  const pet=petRect(), w=el.offsetWidth, hgt=el.offsetHeight;
  let px=x, py=y;
  const roomLeft=pet.left, roomRight=innerWidth-pet.right;
  if(roomLeft>w+14) px=Math.min(x,pet.left-w-10);
  else if(roomRight>w+14) px=Math.max(x,pet.right+10);
  py=Math.min(Math.max(6,y),innerHeight-hgt-6);
  if(px+w>pet.left && px<pet.right && py+hgt>pet.top && py<pet.bottom){
    py=Math.max(6,pet.top-hgt-10);
  }
  el.style.left=Math.max(6,Math.min(px,innerWidth-w-6))+"px";
  el.style.top=py+"px";
}
// The pet surface uses native menus (they need no window space). The panel
// surface keeps this DOM menu for its session rows, where there is room.
function showMenu(items,x,y){
  ctx.innerHTML=items.map(it=>it==="sep"?`<div class="sep"></div>`
    :`<button data-act="${esc(it.act)}"${it.id?` data-sid="${esc(it.id)}"`:""}>${esc(it.label)}${it.key?`<span class="k">${esc(it.key)}</span>`:""}</button>`).join("");
  ctx.classList.add("on");
  placeMenu(ctx,x,y);
}
cv.addEventListener("contextmenu",e=>{
  if(!IS_PET) return;
  e.preventDefault();
  api.petMenu();
});
ctx.addEventListener("click",async e=>{
  const btn=e.target.closest("[data-act]"); const act=btn?.dataset.act; if(!act) return;
  const sid=btn?.dataset.sid; hideCtx();
  if(act==="s-open"){ draft=null; selected=sid; msgKey=""; setExpanded(true); showView("chat"); return; }
  if(act==="s-fork"){ const s=state.sessions.find(x=>x.id===sid); if(s) await forkSession(s); return; }
  if(act==="s-abort"){ const s=state.sessions.find(x=>x.id===sid); if(s) try{ await post("/api/abort",{server:s.server,sessionId:s.id}); }catch(err){} return; }
  if(act==="s-hide"){ const s=state.sessions.find(x=>x.id===sid); if(!s) return;
    try{ await post("/api/session/hide",{server:s.server,sessionId:s.id,hidden:true});
      finishedIds=finishedIds.filter(x=>x!==sid);
      if(selected===sid){ selected=null; msgKey=""; } }catch(err){ alert(String(err)); }
    return; }
  if(act==="s-unhide"){ try{ await post("/api/session/hide",{sessionId:sid,hidden:false}); }catch(err){ alert(String(err)); } return; }
  if(act==="new"){ startDraft(); }
  if(act==="sessions"){ setExpanded(true); showView("chat"); }
  if(act==="pets"){ setExpanded(true); showView("pets"); }
  if(act==="settings"){ setExpanded(true); showView("settings"); }
  if(act==="hide"){ setExpanded(false); }
  if(act==="quit"){ api.quit(); }
});
function hideCtx(){ ctx.classList.remove("on"); }
document.addEventListener("contextmenu",e=>{
  const row=e.target.closest("[data-session]"); if(!row) return;
  const s=state.sessions.find(x=>x.id===row.dataset.session); if(!s) return;
  if(!IS_PANEL){
    e.preventDefault();
    api.bubbleMenu({sessionId:s.id,server:s.server,state:s.state});
    return;
  }
  e.preventDefault();
  showMenu([
    {label:"Open",act:"s-open",id:s.id},
    {label:"Fork",act:"s-fork",id:s.id},
    ...(s.state==="running"?[{label:"Stop",act:"s-abort",id:s.id}]:[]),
    "sep",
    {label:"Hide from pet",act:"s-hide",id:s.id},
  ], e.clientX, e.clientY);
});
document.addEventListener("mousedown",e=>{ if(!e.target.closest("#ctx")&&!e.target.closest("#pet")) hideCtx(); });
window.addEventListener("keydown",e=>{
  if(e.key==="Escape"){ hideCtx(); closePalette(); }
  if(e.ctrlKey&&e.key.toLowerCase()==="n"){
    e.preventDefault();
    if(IS_PET) api.panel({open:true,action:"new"});
    else if(IS_PANEL) startDraft();
  }
});

/* ---------------- copy buttons in code blocks ---------------- */
document.addEventListener("click",async e=>{
  const b=e.target.closest(".copybtn"); if(!b) return;
  const code=b.closest(".codeblock")?.querySelector("pre code"); if(!code) return;
  try{
    await navigator.clipboard.writeText(code.textContent);
    b.textContent="copied";
    setTimeout(()=>{ b.textContent="copy"; },900);
  }catch{}
});

/* ---------------- tooltip: hover in the bubble window, draw in the pet window ---------------- */
const tip=$("#tip");
function tipHtml(s){
  const txt=(s.lastText||"").trim();
  return `<b>${esc(s.title)}</b><div style="color:var(--dim);margin-top:3px">${esc(s.dirName||"")} · ${esc(s.state)}</div>`
    + (txt?`<div style="margin-top:5px">${esc(txt.slice(0,160))}${txt.length>160?"…":""}</div>`:"");
}
document.addEventListener("mouseover",e=>{
  if(!IS_BUBBLES) return;
  const b=e.target.closest(".bub"); if(!b) return;
  const s=state.sessions.find(x=>x.id===b.dataset.session); if(!s) return;
  api.tooltip({show:true,html:tipHtml(s)});
});
document.addEventListener("mouseout",e=>{ if(IS_BUBBLES&&e.target.closest(".bub")) api.tooltip({show:false}); });
if(api.onTooltip) api.onTooltip(info=>{
  if(!IS_PET) return;
  if(!info||!info.show||!info.html){ tip.classList.remove("on"); return; }
  tip.innerHTML=info.html;
  tip.classList.add("on");
});

/* ---------------- shell <-> surfaces, events, boot ---------------- */
// shell -> pet: the panel opened/closed (the click toggles it again)
if(api.onPanel) api.onPanel(s=>{
  if(!IS_PET) return;
  lastLayout=Date.now();
  setExpanded(!!s.open);
});
// shell -> panel: what to show when the panel window is opened
if(api.onPanelCommand) api.onPanelCommand(c=>{
  if(!IS_PANEL) return;
  expanded=true;
  document.body.classList.add("expanded");
  if(c.action==="new"){ startDraft(); return; }
  if(document.body.classList.contains("mini-open")){
    document.body.classList.remove("mini-open");
    api.panelSize({full:true});
  }
  if(c.sessionId){ draft=null; selected=c.sessionId; view="chat"; msgKey=""; }
  else if(c.view){ draft=null; view=c.view; }
  // a bare open keeps whatever the panel was showing (draft or session)
  render();
});

async function loadWorkspaces(){
  try{ workspaces=(await (await fetch("/api/workspaces")).json()).workspaces||[]; }catch{ workspaces=[]; }
}
async function loadDefaults(){
  try{ defaults=await (await fetch("/api/defaults")).json(); }catch{ defaults=null; }
}
function connect(){
  const es=new EventSource("/api/events");
  es.addEventListener("state",ev=>{
    state=JSON.parse(ev.data);
    render(); // renderDetail schedules the chat refresh (and keeps it on screen)
  });
  es.onerror=()=>{ es.close(); setTimeout(connect,1500); };
}
(async ()=>{ await loadDefaults(); await loadPet(); await loadWorkspaces(); await loadCommands(); connect(); render(); })();
setInterval(()=>{ loadPet(); },4000);
setInterval(()=>{ loadWorkspaces(); loadCommands(); },15000);
</script></body></html>
